name: cargo_sort_game
description: Cargo Sort - a bilingual Flutter puzzle game MVP with test ads.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.10.0 <4.0.0'

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/3d/manifest.json
    - assets/3d/runtime/models/cargame_native_slice_v1.glb
    - assets/3d/runtime/cargo/fashion/cg_cargo_accessory_box_pcargo_v01.webp
    - assets/3d/runtime/cargo/special/cg_cargo_accessory_carton_pcargo_v01.webp
    - assets/3d/runtime/cargo/toys/cg_cargo_action_figure_box_pcargo_v01.webp
    - assets/3d/runtime/cargo/fashion/cg_cargo_apparel_box_pcargo_v01.webp
    - assets/3d/runtime/cargo/food/cg_cargo_apple_crate_pcargo_v01.webp
    - assets/3d/runtime/cargo/office/cg_cargo_archive_box_pcargo_v01.webp
    - assets/3d/runtime/cargo/special/cg_cargo_auto_part_crate_pcargo_v01.webp
    - assets/3d/runtime/cargo/food/cg_cargo_bakery_box_pcargo_v01.webp
    - assets/3d/runtime/cargo/sports/cg_cargo_basketball_bag_pcargo_v01.webp
    - assets/3d/runtime/cargo/special/cg_cargo_battery_pack_pcargo_v01.webp
    - assets/3d/runtime/cargo/toys/cg_cargo_board_game_box_pcargo_v01.webp
    - assets/3d/runtime/cargo/fashion/cg_cargo_boot_carton_pcargo_v01.webp
    - assets/maps/world_continents_ai.svg

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.38.0
  google_mobile_ads: ^9.0.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.1