name: Temporary ENG-010 reconciliation

on:
  push:
    branches: [agent/eng-010-reconcile]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eng-010-reconcile
      - run: python3 tool/_reconcile_eng010.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temporary_reconcile_eng010.yml tool/_reconcile_eng010.py
          git add docs/FEATURE_CATALOG.md docs/STATUS.md
          git commit -m "docs: verify ENG-010 secret handling"
          git push origin HEAD:agent/eng-010-reconcile
