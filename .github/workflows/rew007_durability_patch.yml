name: REW007 Durability Patch

on:
  push:
    branches:
      - agent/rew-007-reward-ledger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rew-007-reward-ledger
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply durability hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          progress = Path('lib/core/storage/progress_store.dart')
          text = progress.read_text()

          old_commit = '''    await _prefs.setString(_pendingRewardTransactionKey, jsonEncode(journal));
              await _applyRewardTransactionValues(validated);
              await _recordCompletedRewardTransaction(idempotencyKey);
              await _prefs.remove(_pendingRewardTransactionKey);
              return true;
          '''
          new_commit = '''    await _prefs.setString(_pendingRewardTransactionKey, jsonEncode(journal));
              await _applyRewardTransactionValues(validated);
              await _recordCompletedRewardTransaction(idempotencyKey);
              try {
                await _prefs.remove(_pendingRewardTransactionKey);
              } catch (_) {
                // The durable completed ledger is authoritative. Recovery can
                // safely discard a stale pending journal on the next load/retry.
              }
              return true;
          '''
          if old_commit in text:
              text = text.replace(old_commit, new_commit, 1)
          elif 'The durable completed ledger is authoritative.' not in text:
              raise SystemExit('Reward commit cleanup block did not match.')

          old_record = '''  Future<void> _recordCompletedRewardTransaction(String idempotencyKey) async {
              await _ensureRewardLedgerLoaded();
              if (!_completedRewardTransactions.add(idempotencyKey)) return;
              while (_completedRewardTransactions.length >
                  _rewardTransactionLedgerLimit) {
                _completedRewardTransactions.remove(_completedRewardTransactions.first);
              }
              await _prefs.setStringList(
                _rewardTransactionLedgerKey,
                _completedRewardTransactions.toList(),
              );
            }
          '''
          new_record = '''  Future<void> _recordCompletedRewardTransaction(String idempotencyKey) async {
              await _ensureRewardLedgerLoaded();
              if (_completedRewardTransactions.contains(idempotencyKey)) return;

              final updated = <String>{
                ..._completedRewardTransactions,
                idempotencyKey,
              };
              while (updated.length > _rewardTransactionLedgerLimit) {
                updated.remove(updated.first);
              }
              await _prefs.setStringList(
                _rewardTransactionLedgerKey,
                updated.toList(),
              );
              _completedRewardTransactions
                ..clear()
                ..addAll(updated);
            }
          '''
          if old_record in text:
              text = text.replace(old_record, new_record, 1)
          elif 'final updated = <String>{' not in text:
              raise SystemExit('Completed reward ledger block did not match.')

          old_hearts = '''  Future<void> addHearts(int amount, {String? transactionId}) =>
              _serializeReward<void>(() async {
                await _ensureRewardLedgerLoaded();
                await _recoverPendingRewardTransaction();

                final transactionKey = _rewardTransactionKey(
                  reason: 'heart_grant',
                  idempotencyKey: transactionId,
                );
                if (_completedRewardTransactions.contains(transactionKey)) return;

                final nextHearts = (hearts + amount).clamp(0, maxHearts);
                final values = <String, Object?>{
                  _heartsKey: nextHearts,
                  if (nextHearts >= maxHearts) _heartTimestampKey: null,
                };
                final committed = await _commitRewardTransaction(
                  reason: 'heart_grant',
                  idempotencyKey: transactionKey,
                  values: values,
                );
                if (!committed) return;

                hearts = nextHearts;
                if (hearts >= maxHearts) _heartRefillTimestamp = null;
                notifyListeners();
              });
          '''
          new_hearts = '''  Future<void> addHearts(int amount) async {
              hearts = (hearts + amount).clamp(0, maxHearts);
              if (hearts >= maxHearts) {
                _heartRefillTimestamp = null;
                await _prefs.remove(_heartTimestampKey);
              }
              await _prefs.setInt(_heartsKey, hearts);
              notifyListeners();
            }

            Future<bool> grantHearts(
              int amount, {
              required String transactionId,
              String reason = 'heart_reward',
            }) => _serializeReward<bool>(() async {
              if (amount <= 0) return false;
              await _ensureRewardLedgerLoaded();
              await _recoverPendingRewardTransaction();

              final transactionKey = _rewardTransactionKey(
                reason: 'heart:$reason',
                idempotencyKey: transactionId,
              );
              if (_completedRewardTransactions.contains(transactionKey)) {
                return false;
              }

              final nextHearts = (hearts + amount).clamp(0, maxHearts);
              if (nextHearts == hearts) return false;
              final committed = await _commitRewardTransaction(
                reason: 'heart_grant:$reason',
                idempotencyKey: transactionKey,
                values: <String, Object?>{
                  _heartsKey: nextHearts,
                  if (nextHearts >= maxHearts) _heartTimestampKey: null,
                },
              );
              if (!committed) return false;

              hearts = nextHearts;
              if (hearts >= maxHearts) _heartRefillTimestamp = null;
              notifyListeners();
              return true;
            });
          '''
          if old_hearts in text:
              text = text.replace(old_hearts, new_hearts, 1)
          elif 'Future<bool> grantHearts(' not in text:
              raise SystemExit('Heart grant block did not match.')

          dead_start = text.find('  Future<void> _saveProgressAndStats() async {')
          if dead_start != -1:
              dead_end = text.find('  Future<bool> spendCoins', dead_start)
              if dead_end == -1:
                  raise SystemExit('Could not bound dead save helper.')
              text = text[:dead_start] + text[dead_end:]

          progress.write_text(text)

          tests = Path('test/core/storage/reward_transaction_recovery_test.dart')
          test_text = tests.read_text()
          old_test = '''    await store.addHearts(2, transactionId: 'revive-001');
              expect(store.hearts, 4);
              await store.addHearts(2, transactionId: 'revive-001');
              expect(store.hearts, 4);
              expect(
                store.completedRewardTransactions,
                contains('heart_grant:revive-001'),
              );
          '''
          new_test = '''    expect(
                await store.grantHearts(
                  2,
                  transactionId: 'revive-001',
                  reason: 'rewarded_continue',
                ),
                isTrue,
              );
              expect(store.hearts, 4);
              expect(
                await store.grantHearts(
                  2,
                  transactionId: 'revive-001',
                  reason: 'rewarded_continue',
                ),
                isFalse,
              );
              expect(store.hearts, 4);
              expect(
                store.completedRewardTransactions,
                contains('heart:rewarded_continue:revive-001'),
              );
          '''
          if old_test in test_text:
              test_text = test_text.replace(old_test, new_test, 1)
          elif 'heart:rewarded_continue:revive-001' not in test_text:
              raise SystemExit('Heart reward test block did not match.')
          tests.write_text(test_text)

          work = Path('docs/work/REW-007.md')
          work_text = work.read_text()
          if '## Review hardening' not in work_text:
              work.write_text(work_text.rstrip() + '''

          ## Review hardening

          - Completed transaction IDs are persisted before the in-memory ledger is mutated, preventing a transient ledger-write failure from creating a false completed state inside the running process.
          - Pending-journal cleanup is best-effort after the completed ledger is durable; cleanup failure no longer turns a committed reward into an application-level failure.
          - Rewarded heart grants use explicit `grantHearts()` reason/idempotency semantics while `addHearts()` remains available for non-reward adjustments.
          ''' + '\n')
          PY
          dart format lib/core/storage/progress_store.dart test/core/storage/reward_transaction_recovery_test.dart
          git diff --check
          if git diff --quiet; then
            echo "No durability changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/storage/progress_store.dart test/core/storage/reward_transaction_recovery_test.dart docs/work/REW-007.md
          git commit -m "fix: harden reward ledger durability"
          git push origin HEAD:agent/rew-007-reward-ledger
