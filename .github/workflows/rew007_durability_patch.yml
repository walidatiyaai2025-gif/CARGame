name: REW007 Durability Patch

on:
  push:
    branches:
      - agent/rew-007-reward-ledger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rew-007-reward-ledger
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply durability-only hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/core/storage/progress_store.dart')
          text = path.read_text()

          old_commit = '''    await _prefs.setString(_pendingRewardTransactionKey, jsonEncode(journal));
              await _applyRewardTransactionValues(validated);
              await _recordCompletedRewardTransaction(idempotencyKey);
              await _prefs.remove(_pendingRewardTransactionKey);
              return true;
          '''
          new_commit = '''    await _prefs.setString(_pendingRewardTransactionKey, jsonEncode(journal));
              await _applyRewardTransactionValues(validated);
              await _recordCompletedRewardTransaction(idempotencyKey);
              await _bestEffortClearPendingRewardTransaction();
              return true;
          '''
          if old_commit in text:
              text = text.replace(old_commit, new_commit, 1)
          elif new_commit not in text:
              raise SystemExit('commit cleanup block did not match')

          old_recovery = '''      if (_completedRewardTransactions.contains(idempotencyKey)) {
                await _prefs.remove(_pendingRewardTransactionKey);
                return;
              }

              final values = _validateRewardTransactionValues(rawValues);
              await _applyRewardTransactionValues(values);
              _applyRewardTransactionValuesToMemory(values);
              await _recordCompletedRewardTransaction(idempotencyKey);
              await _prefs.remove(_pendingRewardTransactionKey);
          '''
          new_recovery = '''      if (_completedRewardTransactions.contains(idempotencyKey)) {
                await _bestEffortClearPendingRewardTransaction();
                return;
              }

              final values = _validateRewardTransactionValues(rawValues);
              await _applyRewardTransactionValues(values);
              _applyRewardTransactionValuesToMemory(values);
              await _recordCompletedRewardTransaction(idempotencyKey);
              await _bestEffortClearPendingRewardTransaction();
          '''
          if old_recovery in text:
              text = text.replace(old_recovery, new_recovery, 1)
          elif new_recovery not in text:
              raise SystemExit('recovery cleanup block did not match')

          old_record = '''  Future<void> _recordCompletedRewardTransaction(String idempotencyKey) async {
              await _ensureRewardLedgerLoaded();
              if (!_completedRewardTransactions.add(idempotencyKey)) return;
              while (_completedRewardTransactions.length >
                  _rewardTransactionLedgerLimit) {
                _completedRewardTransactions.remove(_completedRewardTransactions.first);
              }
              await _prefs.setStringList(
                _rewardTransactionLedgerKey,
                _completedRewardTransactions.toList(),
              );
            }
          '''
          new_record = '''  Future<void> _recordCompletedRewardTransaction(String idempotencyKey) async {
              await _ensureRewardLedgerLoaded();
              if (_completedRewardTransactions.contains(idempotencyKey)) return;

              final updated = <String>{
                ..._completedRewardTransactions,
                idempotencyKey,
              };
              while (updated.length > _rewardTransactionLedgerLimit) {
                updated.remove(updated.first);
              }
              await _prefs.setStringList(
                _rewardTransactionLedgerKey,
                updated.toList(),
              );
              _completedRewardTransactions
                ..clear()
                ..addAll(updated);
            }

            Future<void> _bestEffortClearPendingRewardTransaction() async {
              try {
                await _prefs.remove(_pendingRewardTransactionKey);
              } catch (_) {
                // The completed ledger is already durable. A stale pending journal
                // is harmless and recovery can retry cleanup on the next operation.
              }
            }
          '''
          if old_record in text:
              text = text.replace(old_record, new_record, 1)
          elif new_record not in text:
              raise SystemExit('completed ledger block did not match')

          path.write_text(text)

          work = Path('docs/work/REW-007.md')
          work_text = work.read_text()
          if '## Durability review hardening' not in work_text:
              work.write_text(work_text.rstrip() + '''

          ## Durability review hardening

          - Completed transaction IDs are persisted before the in-memory ledger is mutated, preventing a transient ledger-write failure from creating a false completed state inside the running process.
          - Pending-journal cleanup is best-effort only after the completed ledger is durable, so cleanup failure cannot turn a committed reward into a replayable transaction.
          ''' + '\n')
          PY
          dart format lib/core/storage/progress_store.dart
          git diff --check
          if git diff --quiet; then
            echo 'Durability hardening already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/storage/progress_store.dart docs/work/REW-007.md
          git commit -m 'fix: harden reward ledger durability'
          git push origin HEAD:agent/rew-007-reward-ledger