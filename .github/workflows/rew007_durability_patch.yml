name: REW007 Durability Patch

on:
  push:
    branches:
      - agent/rew-007-reward-ledger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rew-007-reward-ledger
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply durability-only hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/core/storage/progress_store.dart')
          text = path.read_text()

          def section(source, start_marker, end_marker):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return start, end, source[start:end]

          commit_start, commit_end, commit_body = section(
              text,
              '  Future<bool> _commitRewardTransaction({',
              '  Future<void> _recoverPendingRewardTransaction()',
          )
          commit_body = commit_body.replace(
              'await _prefs.remove(_pendingRewardTransactionKey);',
              'await _bestEffortClearPendingRewardTransaction();',
          )
          text = text[:commit_start] + commit_body + text[commit_end:]

          recovery_start, recovery_end, recovery_body = section(
              text,
              '  Future<void> _recoverPendingRewardTransaction()',
              '  Map<String, Object?> _validateRewardTransactionValues',
          )
          recovery_body = recovery_body.replace(
              'await _prefs.remove(_pendingRewardTransactionKey);',
              'await _bestEffortClearPendingRewardTransaction();',
          )
          text = text[:recovery_start] + recovery_body + text[recovery_end:]

          record_start, record_end, record_body = section(
              text,
              '  Future<void> _recordCompletedRewardTransaction(String idempotencyKey) async {',
              '  Future<bool> useFreeHint()',
          )
          if 'final updated = <String>{' not in record_body:
              record_body = '''  Future<void> _recordCompletedRewardTransaction(String idempotencyKey) async {
              await _ensureRewardLedgerLoaded();
              if (_completedRewardTransactions.contains(idempotencyKey)) return;

              final updated = <String>{
                ..._completedRewardTransactions,
                idempotencyKey,
              };
              while (updated.length > _rewardTransactionLedgerLimit) {
                updated.remove(updated.first);
              }
              await _prefs.setStringList(
                _rewardTransactionLedgerKey,
                updated.toList(),
              );
              _completedRewardTransactions
                ..clear()
                ..addAll(updated);
            }

            Future<void> _bestEffortClearPendingRewardTransaction() async {
              try {
                await _prefs.remove(_pendingRewardTransactionKey);
              } catch (_) {
                // The completed ledger is durable; recovery may clear stale pending state later.
              }
            }

          '''
          elif '_bestEffortClearPendingRewardTransaction' not in record_body:
              record_body += '''  Future<void> _bestEffortClearPendingRewardTransaction() async {
              try {
                await _prefs.remove(_pendingRewardTransactionKey);
              } catch (_) {
                // The completed ledger is durable; recovery may clear stale pending state later.
              }
            }

          '''
          text = text[:record_start] + record_body + text[record_end:]
          path.write_text(text)

          work = Path('docs/work/REW-007.md')
          work_text = work.read_text()
          if '## Durability review hardening' not in work_text:
              work.write_text(work_text.rstrip() + '''

          ## Durability review hardening

          - Completed transaction IDs are persisted before the in-memory ledger is mutated, preventing a transient ledger-write failure from creating a false completed state inside the running process.
          - Pending-journal cleanup is best-effort only after the completed ledger is durable, so cleanup failure cannot turn a committed reward into a replayable transaction.
          ''' + '\n')
          PY
          dart format lib/core/storage/progress_store.dart
          git diff --check
          if git diff --quiet; then
            echo 'Durability hardening already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/storage/progress_store.dart docs/work/REW-007.md
          git commit -m 'fix: harden reward ledger durability'
          git push origin HEAD:agent/rew-007-reward-ledger
