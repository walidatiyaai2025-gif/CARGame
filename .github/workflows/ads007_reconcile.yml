name: ADS-007 Reconciliation

on:
  push:
    branches:
      - agent/ads-007-reconcile
    paths:
      - .github/scripts/ads007_reconcile.py
      - .github/workflows/ads007_reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ads-007-reconcile
          fetch-depth: 0
      - name: Reconcile ADS-007 tracking and evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ads007_reconcile.py
          python3 tool/verify_privacy_inventory.py
          python3 tool/verify_security_baseline.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/ADS-007.md
          git rm .github/scripts/ads007_reconcile.py .github/workflows/ads007_reconcile.yml
          git commit -m 'docs: reconcile ADS-007 client integration'
          git push origin HEAD:agent/ads-007-reconcile
