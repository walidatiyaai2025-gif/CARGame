name: TEST-002 Start Tracking

on:
  push:
    branches:
      - agent/test-002-level-release-contract

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-002-level-release-contract
          fetch-depth: 0
      - name: Mark TEST-002 in progress
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected tracking text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = 'docs/FEATURE_CATALOG.md'
          replace_once(
              catalog,
              '| TEST-002 | Level generator and solvability tests | P0 | PLANNED | LEVEL-003 | Levels 1, 25, 26, 150 and every generated configuration validate. |',
              '| TEST-002 | Level generator and solvability tests | P0 | IN PROGRESS | LEVEL-003 | Issue #143 consolidates the production 1..150 catalog into one deterministic release contract: exact identity, regeneration parity, `LevelSolvabilityValidator.validateAll`, `LevelDifficultyCurve.validateAll`, and explicit boundaries 1/25/26/150. Detailed negative cases stay in their owning suites; production level content changes only if integrated validation exposes a real defect. |',
          )
          replace_once(
              catalog,
              '## IN PROGRESS\n\n- None.',
              '## IN PROGRESS\n\n- `TEST-002` Level generator and solvability tests — issue #143; integrating deterministic generation, structural solvability, and quantitative difficulty acceptance into one release contract over the exact 150-level production catalog.',
          )
          replace_once(
              catalog,
              '## NEXT READY\n\n- `TEST-002` Level generator and solvability tests — P0 and dependency-ready because `LEVEL-003` is VERIFIED; consolidate generator, structural solvability, and LEVEL-002 difficulty acceptance into one deterministic regression gate.',
              '## NEXT READY\n\n- To be selected after TEST-002 verification.',
          )

          status = 'docs/STATUS.md'
          replace_once(
              status,
              '| Primary feature | None — `LEVEL-002` is VERIFIED; `TEST-002` is the next dependency-ready P0. |',
              '| Primary feature | `TEST-002` Level generator and solvability tests — IN PROGRESS under issue #143. |',
          )
          replace_once(
              status,
              '| Status | LEVEL-002 is VERIFIED. All 150 generated levels satisfy typed difficulty envelopes and macro-progression checks; Expert levels intentionally tighten spare-move slack to 1–3 without changing level IDs, worlds, products, persistence keys, unlock IDs, or reward identity. |',
              '| Status | TEST-002 is consolidating the exact production 150-level catalog into one deterministic release gate covering regeneration parity, structural solvability, quantitative difficulty acceptance, and required boundaries 1/25/26/150. No production level change is planned unless the integrated gate exposes a real defect. |',
          )
          replace_once(
              status,
              '| Next recommended feature | `TEST-002` Level generator and solvability tests — highest-priority dependency-ready P0 after LEVEL-002; consolidate generator, solvability, and difficulty acceptance into one deterministic regression gate. |',
              '| Next recommended feature | Complete TEST-002 issue #143 and reconcile verification evidence; select the next unblocked catalog item only after current-head CI passes. |',
          )
      - name: Remove temporary tracking workflow
        run: rm .github/workflows/test-002-start.yml
      - name: Commit TEST-002 tracking
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_CATALOG.md docs/STATUS.md .github/workflows/test-002-start.yml
          git commit -m "docs: mark TEST-002 in progress"
          git push origin HEAD:agent/test-002-level-release-contract
