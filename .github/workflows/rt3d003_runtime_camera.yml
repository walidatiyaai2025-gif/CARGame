name: RT3D-003 Native Camera Runtime

on:
  push:
    branches:
      - agent/rt3d-003-cinematic-polish-refresh

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rt3d-003-cinematic-polish-refresh
          fetch-depth: 0
      - name: Implement bloom camera presets and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/kotlin/com/walka/cargosort/NativeFilamentSceneView.kt')
          text = path.read_text()

          text = text.replace(
              '    private var yaw = 0.82\n    private var cameraHeight = 8.7\n',
              '    private var yaw = 0.82\n    private var cameraHeight = 8.7\n    private var activeCameraPreset = "overview"\n    private var frameCount = 0L\n    private var lastFrameTimeNanos = 0L\n    private var fpsEstimate = 0.0\n',
              1,
          )

          text = text.replace(
              '            if (!disposed && rendering) {\n                modelViewer.render(frameTimeNanos)\n                Choreographer.getInstance().postFrameCallback(this)\n            }',
              '            if (!disposed && rendering) {\n                if (lastFrameTimeNanos != 0L && frameTimeNanos > lastFrameTimeNanos) {\n                    val instantaneousFps = 1_000_000_000.0 / (frameTimeNanos - lastFrameTimeNanos).toDouble()\n                    fpsEstimate = if (fpsEstimate == 0.0) instantaneousFps else (fpsEstimate * 0.9) + (instantaneousFps * 0.1)\n                }\n                lastFrameTimeNanos = frameTimeNanos\n                frameCount += 1\n                modelViewer.render(frameTimeNanos)\n                Choreographer.getInstance().postFrameCallback(this)\n            }',
              1,
          )

          text = text.replace(
              '        updateCamera()\n',
              '        applyCameraPreset("overview")\n',
              1,
          )
          text = text.replace(
              '        modelViewer.view.bloomOptions =\n            modelViewer.view.bloomOptions.apply { enabled = false }',
              '        modelViewer.view.bloomOptions =\n            modelViewer.view.bloomOptions.apply {\n                enabled = true\n                strength = 0.18f\n            }',
              1,
          )

          old_camera = '''    private fun updateCamera() {
              val eyeX = cos(yaw) * 13.2
              val eyeY = cameraHeight
              val eyeZ = sin(yaw) * 13.2
              modelViewer.camera.lookAt(
                  eyeX,
                  eyeY,
                  eyeZ,
                  0.0,
                  0.9,
                  0.0,
                  0.0,
                  1.0,
                  0.0,
              )
          }
'''
          new_camera = '''    private fun updateOrbitCamera() {
              activeCameraPreset = "custom"
              val eyeX = cos(yaw) * 13.2
              val eyeY = cameraHeight
              val eyeZ = sin(yaw) * 13.2
              modelViewer.camera.lookAt(
                  eyeX,
                  eyeY,
                  eyeZ,
                  0.0,
                  0.9,
                  0.0,
                  0.0,
                  1.0,
                  0.0,
              )
          }

          private fun applyCameraPreset(preset: String): Boolean {
              val normalized = preset.lowercase()
              val camera = when (normalized) {
                  "overview" -> doubleArrayOf(9.0, 8.7, 9.3, 0.0, 0.9, 0.0)
                  "warehouse" -> doubleArrayOf(-0.8, 6.3, 10.8, -5.6, 1.4, 2.4)
                  "docks" -> doubleArrayOf(10.5, 5.8, 1.2, 4.2, 0.7, -0.1)
                  else -> return false
              }
              activeCameraPreset = normalized
              modelViewer.camera.lookAt(
                  camera[0], camera[1], camera[2],
                  camera[3], camera[4], camera[5],
                  0.0, 1.0, 0.0,
              )
              return true
          }
'''
          if old_camera not in text:
              raise SystemExit('camera function anchor not found')
          text = text.replace(old_camera, new_camera, 1)

          text = text.replace(
              '                    updateCamera()\n                    result.success(true)',
              '                    updateOrbitCamera()\n                    result.success(true)',
              1,
          )

          reset_anchor = '''                "resetCargo" -> {
                    resetEntity("cargo.demo.electronics")
                    resetEntity("cargo.demo.food")
                    result.success(true)
                }
'''
          camera_methods = '''                "setCameraPreset" -> {
                    val args = call.arguments as? Map<*, *> ?: emptyMap<String, Any>()
                    val preset = args["preset"] as? String ?: return result.success(false)
                    result.success(applyCameraPreset(preset))
                }
                "resetCamera" -> result.success(applyCameraPreset("overview"))
                "resetCargo" -> {
                    resetEntity("cargo.demo.electronics")
                    resetEntity("cargo.demo.food")
                    result.success(true)
                }
'''
          if reset_anchor not in text:
              raise SystemExit('resetCargo anchor not found')
          text = text.replace(reset_anchor, camera_methods, 1)

          old_info = '''                        "asset" to MODEL_ASSET,
                        "nativeGpu" to true,
'''
          new_info = '''                        "asset" to MODEL_ASSET,
                        "nativeGpu" to true,
                        "bloom" to true,
                        "cameraPreset" to activeCameraPreset,
                        "frameCount" to frameCount,
                        "fpsEstimate" to fpsEstimate,
'''
          if old_info not in text:
              raise SystemExit('rendererInfo anchor not found')
          text = text.replace(old_info, new_info, 1)

          path.write_text(text)
          PY
          grep -q 'enabled = true' android/app/src/main/kotlin/com/walka/cargosort/NativeFilamentSceneView.kt
          grep -q 'setCameraPreset' android/app/src/main/kotlin/com/walka/cargosort/NativeFilamentSceneView.kt
          grep -q 'fpsEstimate' android/app/src/main/kotlin/com/walka/cargosort/NativeFilamentSceneView.kt
          rm .github/workflows/rt3d003_runtime_camera.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RT3D-003 add native bloom camera presets and diagnostics'
          git push origin HEAD:agent/rt3d-003-cinematic-polish-refresh
