name: PERF-001 Reconcile Prep

on:
  push:
    branches:
      - agent/perf-001-post-merge-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/perf-001-post-merge-reconcile
          fetch-depth: 0

      - name: Reconcile source-controlled PERF-001 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = 'docs/FEATURE_CATALOG.md'
          replace_once(
              catalog,
              '| PERF-001 | Frame performance budget | P0 | IN PROGRESS | MOT-001, AST-004 | Issue #196 adds the source-controlled 60 Hz/16.67 ms frame policy, bounded rolling FrameTiming evaluation, deterministic full/constrained/reduced visual-quality state machine, conservative recovery hysteresis, app-wide performance scope, shared-motion degradation, ambient ticker shedding, focused regressions and CI ownership gates. Physical-device frame-time proof remains intentionally external before VERIFIED. |',
              '| PERF-001 | Frame performance budget | P0 | IMPLEMENTED | MOT-001, AST-004 | Issue #196 / PR #197 implement the source-controlled 60 Hz/16.67 ms frame policy, bounded rolling FrameTiming evaluation, deterministic full/constrained/reduced visual-quality state machine, conservative recovery hysteresis, app-wide performance scope, shared-motion degradation, ambient ticker shedding, focused regressions and CI ownership gates. Final PR head `7ad6d67e0963de15d2b08c6ce7a734ee6980de1a` passed Flutter CI #848 / run `31414950411`; PR #197 squash-merged as `f2b2c829755a5abdd3342dba731e1e669f42f57f`, and exact-main Flutter CI #849 / run `31415750686` passed 332/332 tests, 88.21% authored-source coverage, Debug APK, artifact security and upload. Main debug artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`. Source-controlled acceptance is IMPLEMENTED; VERIFIED still requires real Android device/profile frame measurements, so TEST-009 remains dependency-blocked. |',
          )
          replace_once(
              catalog,
              '- None. `AST-004` is VERIFIED after its 100/100 checkpoint sprint and exact-main CI #840; start exactly one next primary workstream only after the recorded dependency-ready selection.',
              '- None. `PERF-001` source-controlled implementation is merged and exact-main CI is green; its remaining VERIFIED evidence is real Android device/profile frame measurement, not another source-code workstream.',
          )
          replace_once(
              catalog,
              '- `PERF-001` Frame performance budget — P0 and dependency-ready now that MOT-001 is IMPLEMENTED and AST-004 is VERIFIED. It is the selected next primary workstream and must be marked IN PROGRESS only when implementation begins; completing it unlocks TEST-009 device/API compatibility work.',
              '- Run a fresh dependency-ready/team scan and select exactly one source-controlled workstream. Do not select `TEST-009` until `PERF-001` reaches VERIFIED with real device/profile evidence.',
          )
          recently = '## Recently implemented\n\n'
          perf_recent = '- `PERF-001` Frame performance budget — issue #196 / PR #197 implement the bounded 60 Hz frame policy and adaptive visual-quality fallback. Final PR-head CI #848 and exact-main CI #849 passed 332 tests, 88.21% authored-source coverage, Debug APK, artifact security and upload; main artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`. Physical-device frame measurements remain required before VERIFIED; issue #196 stays open and TEST-009 remains blocked.\n'
          p = Path(catalog)
          text = p.read_text(encoding='utf-8')
          if perf_recent not in text:
              if recently not in text:
                  raise SystemExit('FEATURE_CATALOG: Recently implemented anchor missing')
              p.write_text(text.replace(recently, recently + perf_recent, 1), encoding='utf-8')

          status = 'docs/STATUS.md'
          replace_once(
              status,
              '| Primary feature | `PERF-001` Frame performance budget — IN PROGRESS under issue #196 on `agent/perf-001-frame-budget`. |',
              '| Primary feature | None — `PERF-001` source-controlled implementation is merged; issue #196 remains open only for real Android device/profile verification. |',
          )
          replace_once(
              status,
              '| Completed checkpoint | `AST-004` bounded asset precache and memory policy — VERIFIED and reconciled on main as `82fbc4ac9abeb12ebad6484def9860c71e2027ca`; PERF-001 is the new single primary workstream. |',
              '| Completed checkpoint | `PERF-001` frame performance budget — IMPLEMENTED on main as `f2b2c829755a5abdd3342dba731e1e669f42f57f`; exact-main Flutter CI #849 / run `31415750686` passed 332/332 tests, 88.21% authored-source coverage, Debug APK, artifact security and upload. |',
          )
          replace_once(
              status,
              '| Status | PERF-001 implementation is active: bounded rolling frame timing drives a presentation-only full/constrained/reduced quality state machine; sustained pressure sheds ambient motion and scales shared effects while reduced-motion accessibility remains authoritative. No gameplay/economy/persistence/ad/privacy truth is affected. |',
              '| Status | PERF-001 source-controlled acceptance is IMPLEMENTED: bounded rolling frame timing drives a presentation-only full/constrained/reduced quality state machine; sustained pressure sheds ambient motion and scales shared effects while reduced-motion accessibility remains authoritative. Main debug artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`. VERIFIED remains pending honest physical-device/profile frame evidence. |',
          )
          replace_once(
              status,
              '| Next recommended feature | Finish PERF-001 focused/full CI and Debug APK verification; if source-controlled gates pass, reconcile as IMPLEMENTED pending real device-tier frame profiling, then rescan dependencies before TEST-009. |',
              '| Next recommended feature | After PERF-001 reconciliation, run a fresh dependency-ready/team scan and select exactly one source-controlled workstream; keep TEST-009 blocked until PERF-001 receives real device/profile evidence and becomes VERIFIED. |',
          )
          section_anchor = '- `docs/PERFORMANCE_BUDGET.md` records the verification boundary: CI proves deterministic policy/integration/build safety, while actual device-tier frame measurements remain later device/profile evidence and must not be fabricated.\n'
          section_append = (
              '- Final evidence-bearing PR head `7ad6d67e0963de15d2b08c6ce7a734ee6980de1a` passed Flutter CI #848 / run `31414950411`; PR #197 squash-merged as `f2b2c829755a5abdd3342dba731e1e669f42f57f`.\n'
              '- Exact-main Flutter CI #849 / run `31415750686` passed 332/332 tests, 88.21% authored-source coverage, Debug APK, artifact security and upload. Main artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`.\n'
              '- PERF-001 is IMPLEMENTED, not VERIFIED: issue #196 remains open for real Android device/profile frame measurements, and TEST-009 stays dependency-blocked until that evidence exists.\n'
          )
          p = Path(status)
          text = p.read_text(encoding='utf-8')
          if section_append not in text:
              if section_anchor not in text:
                  raise SystemExit('STATUS: PERF-001 section anchor missing')
              p.write_text(text.replace(section_anchor, section_anchor + section_append, 1), encoding='utf-8')

          work = 'docs/work/PERF-001.md'
          replace_once(work, '- State: IN PROGRESS', '- State: IMPLEMENTED — real Android device/profile frame evidence still required before VERIFIED')
          replace_once(
              work,
              '- [ ] T50 Merge only after final-head CI is green; run exact-main verification/promotion, then reconcile source-controlled PERF-001 evidence without inventing physical-device frame measurements.',
              '- [x] T50 Merge only after final-head CI is green; run exact-main verification/promotion, then reconcile source-controlled PERF-001 evidence without inventing physical-device frame measurements.',
          )
          old = '- The next gate is a full normal-CI run on this evidence-bearing final PR head before merge; device-tier profiling is still deliberately not claimed.'
          new = (
              '- Final evidence-bearing PR head `7ad6d67e0963de15d2b08c6ce7a734ee6980de1a` passed Flutter CI #848 / run `31414950411` end-to-end; PR #197 squash-merged as `f2b2c829755a5abdd3342dba731e1e669f42f57f`.\n'
              '- Exact-main Flutter CI #849 / run `31415750686` passed the same repository gates with 332/332 tests and 88.21% authored-source coverage. Main debug artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`.\n'
              '- Source-controlled PERF-001 acceptance is IMPLEMENTED. Issue #196 remains open and VERIFIED is intentionally withheld until real Android device/profile frame measurements exist; TEST-009 remains blocked by that status.'
          )
          replace_once(work, old, new)
          PY

      - name: Validate reconciliation
        run: |
          python3 tool/verify_frame_performance_budget.py
          python3 tool/test_frame_performance_budget.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          git diff --check

      - name: Commit prepared reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/PERF-001.md
          git diff --cached --check
          git commit -m "PERF-001: reconcile source-controlled evidence [skip ci]"
          git push origin HEAD:agent/perf-001-post-merge-reconcile
