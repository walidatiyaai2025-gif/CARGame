name: RT3D Filament Regenerate Once

on:
  push:
    branches:
      - agent/rt3d-002-native-filament-slice-02

permissions:
  contents: write

concurrency:
  group: rt3d-filament-regenerate-once
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rt3d-002-native-filament-slice-02
          fetch-depth: 0
      - name: Align generator and provenance with deterministic output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          generator = Path('tool/generate_rt3d_native_slice_glb.py')
          text = generator.read_text()
          old = '766e42dfc52314024771efe432c667e8a38e7d439c5182234d57e43dc4a5cd0b'
          new = 'bfd04d6d5f6d4e5c13dd7fc6f851e173d085b64be2fd90eed2664ce9f58feacc'
          if old not in text and new not in text:
              raise SystemExit('Expected generator digest token not found')
          generator.write_text(text.replace(old, new))
          PY
          python3 tool/generate_rt3d_native_slice_glb.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          asset = Path('assets/3d/runtime/models/cargame_native_slice_v1.glb')
          provenance_path = Path('assets/3d/provenance/cargame_native_slice_v1.json')
          payload = asset.read_bytes()
          provenance = json.loads(provenance_path.read_text())
          provenance['sha256'] = hashlib.sha256(payload).hexdigest()
          provenance['byteLength'] = len(payload)
          provenance_path.write_text(json.dumps(provenance, indent=2) + '\n')
          print(f"GLB sha256={provenance['sha256']} bytes={provenance['byteLength']}")
          PY
      - name: Commit regenerated evidence and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rt3d_filament_regenerate_once.yml
          git add tool/generate_rt3d_native_slice_glb.py assets/3d/runtime/models/cargame_native_slice_v1.glb assets/3d/provenance/cargame_native_slice_v1.json
          git commit -m 'RT3D-002: align deterministic native GLB evidence'
          git push origin HEAD:agent/rt3d-002-native-filament-slice-02
