name: UI3D-009 Apply Push

on:
  push:
    branches:
      - agent/ui3d-009-result-debrief

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui3d-009-result-debrief
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Wire premium result debrief
        shell: bash
        run: |
          python3 .github/scripts/ui3d009_patch.py
          dart format lib/features/game/game_screen.dart lib/features/game/gameplay_result_debrief.dart test/features/game/gameplay_result_debrief_visual_test.dart
          flutter pub get
          flutter test test/features/game/gameplay_result_debrief_visual_test.dart
          flutter test test/features/game/game_result_responsive_test.dart
          flutter test test/features/game/game_result_navigation_guard_test.dart
          flutter test test/features/game/game_rewarded_no_fill_test.dart
          flutter analyze
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/game/game_screen.dart lib/features/game/gameplay_result_debrief.dart test/features/game/gameplay_result_debrief_visual_test.dart docs/work/UI3D-009.md
          git rm .github/workflows/ui3d009_apply_push.yml .github/scripts/ui3d009_patch.py
          git commit -m 'feat: integrate premium mission result debrief'
          git push origin HEAD:agent/ui3d-009-result-debrief
