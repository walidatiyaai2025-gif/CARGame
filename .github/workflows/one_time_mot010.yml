name: One-time MOT-010 integration

on:
  push:
    branches: [main]
    paths:
      - scripts/one_time_mot010.py
      - .github/workflows/one_time_mot010.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: python scripts/one_time_mot010.py
      - run: dart format lib test && git diff --check
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(motion): add lifecycle-safe ticker boundaries [skip ci]"
          git push
