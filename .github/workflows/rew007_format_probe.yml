name: REW007 Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Print exact Dart formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/core/storage/progress_store.dart test/core/storage/reward_transaction_recovery_test.dart
          git diff -- lib/core/storage/progress_store.dart test/core/storage/reward_transaction_recovery_test.dart
          exit 1
