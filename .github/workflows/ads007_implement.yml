name: ADS-007 Focused Implementation

on:
  push:
    branches:
      - agent/ads-007-consent-privacy
    paths:
      - .github/scripts/ads007_implement.py
      - .github/workflows/ads007_implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ads-007-consent-privacy
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply and verify ADS-007
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ads007_implement.py
          flutter pub get --enforce-lockfile
          dart format lib test
          python3 tool/verify_privacy_inventory.py
          python3 tool/verify_security_baseline.py
          python3 tool/verify_ci_integrity.py
          flutter test test/core/ads/ad_consent_controller_test.dart test/core/ads/ad_request_gate_test.dart test/bootstrap/app_composition_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test docs tool
          git rm .github/scripts/ads007_implement.py .github/workflows/ads007_implement.yml
          git commit -m 'feat: gate ads behind UMP consent'
          git push origin HEAD:agent/ads-007-consent-privacy
