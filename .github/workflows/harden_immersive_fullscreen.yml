name: Harden immersive fullscreen

on:
  push:
    paths:
      - scripts/harden_immersive_fullscreen.py
      - .github/workflows/harden_immersive_fullscreen.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: python scripts/harden_immersive_fullscreen.py
      - run: dart format lib/main.dart
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - name: Commit checkpoint and cleanup
        run: |
          rm scripts/harden_immersive_fullscreen.py
          rm .github/workflows/harden_immersive_fullscreen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ui): keep immersive fullscreen active"
          git push
