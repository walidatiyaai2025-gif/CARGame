name: UI3D-008 Narrow Layout Fix

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/levels/city_briefing_screen.dart'
      - '.github/workflows/ui3d008_overflow_fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.pull_request.number == 146
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Bound deployment badge strip
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/levels/city_briefing_screen.dart')
          text = path.read_text()
          class_start = text.index('class _DeploymentHero extends StatelessWidget')
          marker = '                      Row(\n                        children: ['
          block_start = text.index(marker, class_start)
          block_end_marker = '                      const SizedBox(height: 10),'
          block_end = text.index(block_end_marker, block_start)
          block = text[block_start:block_end]

          if 'DEPLOYMENT BRIEF' not in block or '#${level.number}' not in block:
              raise SystemExit('Located row is not the deployment badge strip')

          lines = block.rstrip('\n').splitlines()
          if lines[0].strip() != 'Row(' or lines[-1].strip() != '),':
              raise SystemExit('Unexpected deployment badge row shape')

          wrapped = [
              '                      FittedBox(',
              '                        fit: BoxFit.scaleDown,',
              '                        alignment: AlignmentDirectional.centerStart,',
              '                        child: Row(',
              '                          mainAxisSize: MainAxisSize.min,',
          ]
          wrapped.extend('  ' + line for line in lines[1:])
          wrapped.append('                      ),')
          replacement = '\n'.join(wrapped) + '\n'
          path.write_text(text[:block_start] + replacement + text[block_end:])
          PY
          dart format lib/features/levels/city_briefing_screen.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/levels/city_briefing_screen.dart
          git commit -m 'Fix UI3D-008 narrow deployment badges'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}