name: Temporary TEST-004 formatter

on:
  push:
    branches:
      - agent/test-004-result-navigation-race-v5

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/test-004-result-navigation-race-v5
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Format TEST-004 files
        run: dart format lib/features/game/game_screen.dart test/features/game/game_result_navigation_guard_test.dart

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatter produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/game/game_screen.dart test/features/game/game_result_navigation_guard_test.dart
          git commit -m "style(test): apply Dart formatter to TEST-004"
          git push origin HEAD:agent/test-004-result-navigation-race-v5
