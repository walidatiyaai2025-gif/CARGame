name: UI3D-007 Reconcile

on:
  push:
    branches:
      - agent/ui3d-007-post-merge-reconcile

permissions:
  contents: write

concurrency:
  group: ui3d-007-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ui3d-007-post-merge-reconcile
          fetch-depth: 0

      - name: Apply reconciliation
        run: python3 tool/reconcile_ui3d_007.py

      - name: Validate tracking and contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/verify_ui3d_007_visual_effects.py
          python3 tool/test_ui3d_007_visual_effects.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          python3 tool/verify_test_quality.py
          python3 tool/test_test_quality.py
          python3 tool/verify_privacy_inventory.py
          git diff --check

      - name: Commit reconciled tracking
        shell: bash
        run: |
          set -euo pipefail
          rm tool/reconcile_ui3d_007.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/UI3D-007.md tool/reconcile_ui3d_007.py
          git diff --cached --check
          git commit -m "UI3D-007: reconcile 100 checkpoint completion"
          git push origin HEAD:agent/ui3d-007-post-merge-reconcile
