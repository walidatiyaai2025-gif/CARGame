name: TEST-010 tracking transition

on:
  push:
    branches:
      - agent/test-010-dashboard-catalog-parity
    paths:
      - .github/workflows/test010_tracking.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/test-010-dashboard-catalog-parity
          fetch-depth: 0

      - name: Mark TEST-010 in progress
        run: python3 tool/mark_test010_in_progress.py

      - name: Remove one-shot tracking helpers
        run: rm -f tool/mark_test010_in_progress.py .github/workflows/test010_tracking.yml

      - name: Commit tracking transition
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_CATALOG.md docs/STATUS.md tool/mark_test010_in_progress.py .github/workflows/test010_tracking.yml
          if git diff --cached --quiet; then
            echo "No tracking changes required"
            exit 0
          fi
          git commit -m "TEST-010: mark parser parity in progress"
          git push origin HEAD:agent/test-010-dashboard-catalog-parity
