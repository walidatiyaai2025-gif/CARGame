name: WORLD-009 Critical Path Repair

on:
  push:
    branches:
      - agent/world-009-real-capital-map

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/world-009-real-capital-map
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Repair critical-path map interaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/integration/test_007_critical_path_test.dart')
          text = path.read_text()

          import_old = "import 'package:cargo_sort_game/features/levels/city_briefing_screen.dart';\nimport 'package:cargo_sort_game/features/levels/level_select_screen.dart';"
          import_new = "import 'package:cargo_sort_game/features/levels/capital_world_map.dart';\nimport 'package:cargo_sort_game/features/levels/city_briefing_screen.dart';\nimport 'package:cargo_sort_game/features/levels/level_select_screen.dart';"
          if import_old not in text:
              raise SystemExit('critical path import anchor not found')
          text = text.replace(import_old, import_new, 1)

          old = """      final firstCapital = find.text('${levels.first.number}').first;\n      checkpoint('T11', firstCapital, findsOneWidget);\n\n      final lockedCapital = find.byIcon(Icons.lock_rounded).first;\n      await tester.tap(lockedCapital);\n      await tester.pump(const Duration(milliseconds: 350));\n      checkpoint('T12', find.byType(CityBriefingScreen), findsNothing);\n\n      await tester.tap(firstCapital);\n      await tester.pump();\n      await tester.pump(const Duration(milliseconds: 350));\n"""
          new = """      final mapNodes = find.descendant(\n        of: find.byType(CapitalWorldMap),\n        matching: find.byType(GestureDetector),\n      );\n      checkpoint('T11', mapNodes, findsNWidgets(25));\n\n      final firstCapitalNode = tester.widget<GestureDetector>(mapNodes.at(0));\n      final lockedCapitalNode = tester.widget<GestureDetector>(mapNodes.at(1));\n      checkpoint('T12', lockedCapitalNode.onTap, isNull);\n      checkpoint('T12', find.byType(CityBriefingScreen), findsNothing);\n\n      firstCapitalNode.onTap!.call();\n      await tester.pump();\n      await tester.pump(const Duration(milliseconds: 350));\n"""
          if old not in text:
              raise SystemExit('critical path map block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          dart format test/integration/test_007_critical_path_test.dart
          flutter pub get --enforce-lockfile
          flutter test test/integration/test_007_critical_path_test.dart

          rm .github/workflows/world009_critical_path_repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'WORLD-009 align critical path with map interactions'
          git push origin HEAD:agent/world-009-real-capital-map
