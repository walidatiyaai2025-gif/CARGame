name: PERF-002 Tracking Bootstrap

on:
  push:
    branches:
      - agent/perf-002-memory-image-budget

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PERF-002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/perf-002-memory-image-budget
          fetch-depth: 0

      - name: Mark PERF-002 active in project tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = 'docs/FEATURE_CATALOG.md'
          replace_once(
              catalog,
              '| PERF-002 | Memory and image budget | P0 | PLANNED | AST-004 | No unbounded cache and large assets decode near display size. |',
              '| PERF-002 | Memory and image budget | P0 | IN PROGRESS | AST-004 | Issue #199 adds explicit Flutter ImageCache ceilings (96 entries / 48 MiB), a deterministic 6 MiB per-image decoded RGBA budget, 1536 px hard decode dimension, 1024 px layout-free precache target, DPR-aware near-display `cacheWidth`/`cacheHeight`, resize-aware production precache/eviction, focused regressions and CI ownership gates while preserving AST-004 race-safe behavior. Physical-device RSS/GPU memory profiling remains separate evidence before VERIFIED. |',
          )
          replace_once(
              catalog,
              '- None. `PERF-001` source-controlled implementation is merged and exact-main CI is green; its remaining VERIFIED evidence is real Android device/profile frame measurement, not another source-code workstream.',
              '- `PERF-002` Memory and image budget — IN PROGRESS under issue #199 on `agent/perf-002-memory-image-budget`; no other primary source-controlled workstream should start until it is reconciled.',
          )
          replace_once(
              catalog,
              '- Run a fresh dependency-ready/team scan and select exactly one source-controlled workstream. Do not select `TEST-009` until `PERF-001` reaches VERIFIED with real device/profile evidence.',
              '- Finish PERF-002 source budgets, focused/full CI, Debug APK and reconciliation; keep TEST-009 blocked on PERF-001 physical-device verification.',
          )

          status = 'docs/STATUS.md'
          replace_once(
              status,
              '| Primary feature | None — `PERF-001` source-controlled implementation is merged; issue #196 remains open only for real Android device/profile verification. |',
              '| Primary feature | `PERF-002` Memory and image budget — IN PROGRESS under issue #199 on `agent/perf-002-memory-image-budget`. |',
          )
          replace_once(
              status,
              '| Status | PERF-001 source-controlled acceptance is IMPLEMENTED: bounded rolling frame timing drives a presentation-only full/constrained/reduced quality state machine; sustained pressure sheds ambient motion and scales shared effects while reduced-motion accessibility remains authoritative. Main debug artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`; latest-verified promotion #37 / run `31416602117` produced the 55,943,559-byte QA APK with SHA-256 `358d38a81708fce2a667f9b78a00b6b1bd28ae2f68013cdb60266ecbc65da1a2`. VERIFIED remains pending honest physical-device/profile frame evidence. |',
              '| Status | PERF-002 is active: Flutter ImageCache retention and manifest image decode sizes now have explicit source-controlled ceilings; display and precache paths use bounded resize targets while AST-004 race/LRU/failure behavior stays authoritative. No device RSS/GPU measurement is claimed yet. |',
          )
          replace_once(
              status,
              '| Next recommended feature | After PERF-001 reconciliation, run a fresh dependency-ready/team scan and select exactly one source-controlled workstream; keep TEST-009 blocked until PERF-001 receives real device/profile evidence and becomes VERIFIED. |',
              '| Next recommended feature | Finish PERF-002 focused/full CI and Debug APK verification, then reconcile source-controlled acceptance honestly; keep TEST-009 blocked until PERF-001 is physically VERIFIED. |',
          )
          marker = '## PERF-001 adaptive frame performance budget — 2026-08-10\n'
          insertion = '''## PERF-002 memory and image budget — 2026-08-10\n\n- Issue #199 / branch `agent/perf-002-memory-image-budget` are the single active source-controlled workstream after a fresh P0 dependency scan.\n- `GameImageMemoryPolicy.standard` defines 96 global Flutter ImageCache entries, 48 MiB global decoded cache bytes, 6 MiB per manifest image, a 1536 px hard decode dimension, and a 1024 px layout-free precache target.\n- `GameAssetView` converts logical render size through DPR and passes bounded `cacheWidth`/`cacheHeight`, never upsamples beyond authored dimensions, preserves aspect ratio, and falls back to bounded sizing when layout hints are absent or invalid.\n- AST-004 production precache now uses the same resize policy while retaining its injected `AssetImage` callbacks for existing deterministic tests; production eviction uses the matching resized provider.\n- Startup explicitly configures Flutter `ImageCache`; application LRU/failure history remains independently bounded by AST-004.\n- `docs/MEMORY_IMAGE_BUDGET.md` records the safety and verification boundary: CI can prove source budgets/build behavior, while real process RSS/GPU/device memory profiling remains separate evidence.\n\n'''
          p = Path(status)
          text = p.read_text(encoding='utf-8')
          if insertion not in text:
              if marker not in text:
                  raise SystemExit('STATUS: PERF-001 anchor missing')
              p.write_text(text.replace(marker, insertion + marker, 1), encoding='utf-8')

          work = 'docs/work/PERF-002.md'
          for task in ('T45', 'T46'):
              p = Path(work)
              text = p.read_text(encoding='utf-8')
              old = f'- [ ] {task}'
              if old not in text:
                  raise SystemExit(f'{work}: missing {task}')
              p.write_text(text.replace(old, f'- [x] {task}', 1), encoding='utf-8')
          PY

      - name: Validate PERF-002 repository contract
        run: |
          python3 tool/verify_memory_image_budget.py
          python3 tool/test_memory_image_budget.py
          python3 tool/verify_asset_cache_policy.py
          python3 tool/test_asset_cache_policy.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          git diff --check

      - name: Commit tracking bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/PERF-002.md
          git diff --cached --check
          git commit -m "PERF-002: mark memory image budget active [skip ci]"
          git push origin HEAD:agent/perf-002-memory-image-budget
