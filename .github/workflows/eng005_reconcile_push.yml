name: ENG-005 Reconcile Push

on:
  push:
    branches:
      - agent/eng-005-reconcile
    paths:
      - .github/workflows/eng005_reconcile_push.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eng-005-reconcile
          fetch-depth: 0
      - name: Reconcile ENG-005 evidence
        shell: bash
        run: |
          python3 .github/scripts/eng005_reconcile.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/ENG-005.md
          git rm .github/workflows/eng005_reconcile_push.yml .github/scripts/eng005_reconcile.py
          git commit -m 'docs: reconcile ENG-005 architecture evidence'
          git push origin HEAD:agent/eng-005-reconcile
