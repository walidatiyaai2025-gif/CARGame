name: PERF-001 Format Fix

on:
  push:
    branches:
      - agent/perf-001-frame-budget

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PERF-001 branch
        uses: actions/checkout@v4
        with:
          ref: agent/perf-001-frame-budget

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Format changed PERF-001 Dart files
        run: >-
          dart format
          lib/core/performance/frame_performance_budget.dart
          lib/core/performance/frame_performance_scope.dart
          test/core/performance/frame_performance_budget_test.dart
          test/core/performance/frame_performance_scope_test.dart

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/core/performance/frame_performance_budget.dart \
            lib/core/performance/frame_performance_scope.dart \
            test/core/performance/frame_performance_budget_test.dart \
            test/core/performance/frame_performance_scope_test.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git commit -m "PERF-001: apply Dart formatter [skip ci]"
          git push origin HEAD:agent/perf-001-frame-budget
