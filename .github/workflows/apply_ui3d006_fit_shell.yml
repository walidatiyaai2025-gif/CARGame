name: Apply UI3D-006 fit shell
on:
  push:
    paths:
      - scripts/apply_ui3d006_fit_shell.py
      - test/core/widgets/game_fit_view_test.dart
      - .github/workflows/apply_ui3d006_fit_shell.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: python scripts/apply_ui3d006_fit_shell.py
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/core/widgets/game_fit_view_test.dart
      - run: flutter test test/widget_test.dart
      - run: flutter test
      - run: flutter build apk --debug --no-pub
      - name: Validate dashboard catalog
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re
          text = Path('docs/FEATURE_CATALOG.md').read_text(encoding='utf-8')
          ids = [value for value in re.findall(r'^\| ([A-Z0-9-]+) \|', text, re.M) if value != 'ID']
          duplicates = [key for key, count in Counter(ids).items() if count > 1]
          assert not duplicates, duplicates
          assert '| UI3D-006 | Responsive screen shell and safe areas | P0 | IN PROGRESS |' in text
          assert text.count('| IN PROGRESS |') <= 1
          PY
      - name: Remove temporary tooling
        run: |
          rm -f scripts/apply_ui3d006_fit_shell.py
          rm -f .github/workflows/apply_ui3d006_fit_shell.yml
      - name: Commit checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib test docs scripts .github/workflows
          git commit -m "feat(ui): share fit-to-screen shell across home and briefing [skip ci]" || exit 0
          git push
