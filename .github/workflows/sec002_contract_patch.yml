name: SEC-002 CI Contract Patch

on:
  push:
    branches:
      - agent/sec-002-security-scans
    paths:
      - .github/scripts/sec002_contract_patch.py
      - .github/workflows/sec002_contract_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sec-002-security-scans
          fetch-depth: 0
      - name: Harden CI contracts and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sec002_contract_patch.py
          python3 tool/test_ci_integrity.py
          python3 tool/test_security_scans.py
          python3 tool/verify_ci_integrity.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tool/verify_ci_integrity.py tool/test_ci_integrity.py
          git rm .github/scripts/sec002_contract_patch.py .github/workflows/sec002_contract_patch.yml
          git commit -m 'ci: protect SEC-002 security gates'
          git push origin HEAD:agent/sec-002-security-scans
