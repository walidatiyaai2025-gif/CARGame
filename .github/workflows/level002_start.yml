name: LEVEL002 Start Tracking

on:
  push:
    branches:
      - agent/level-002-quantitative-difficulty-curve

permissions:
  contents: write

jobs:
  track:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark LEVEL-002 in progress
        shell: python
        run: |
          from pathlib import Path

          catalog_path = Path('docs/FEATURE_CATALOG.md')
          catalog = catalog_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "| LEVEL-002 | Difficulty curve | P0 | PLANNED | LEVEL-001 | Tutorial/easy/medium/hard/expert bands meet documented quantitative targets. |",
                  "| LEVEL-002 | Difficulty curve | P0 | IN PROGRESS | LEVEL-001 | Issue #134 defines typed tutorial/easy/medium/hard/expert bands, deterministic per-level balance metrics, quantitative envelopes, macro-progression validation, and explicit boundary regressions across the 150-level generator. Preserve current generated content unless measured acceptance exposes a real imbalance. |"
              ),
              (
                  "## IN PROGRESS\n\n- None after `LEVEL-003` verification.\n\n## NEXT READY\n\n1. `LEVEL-002` Difficulty curve — `LEVEL-001` is implemented and LEVEL-003 is now VERIFIED; define quantitative tutorial/easy/medium/hard/expert targets and validate the generated 150-level curve instead of relying on generator intuition.",
                  "## IN PROGRESS\n\n- `LEVEL-002` Difficulty curve — issue #134; defining typed quantitative bands and deterministic balance validation across all 150 generated levels.\n\n## NEXT READY\n\n- To be selected after LEVEL-002 verification."
              ),
          ]
          for old, new in replacements:
              count = catalog.count(old)
              if count != 1:
                  raise SystemExit(f'catalog replacement expected once, found {count}: {old[:120]}')
              catalog = catalog.replace(old, new)
          catalog_path.write_text(catalog, encoding='utf-8')

          status_path = Path('docs/STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          status_replacements = [
              (
                  "| Primary feature | None; `LEVEL-003` is VERIFIED after current-main reconciliation under issue #132. |",
                  "| Primary feature | `LEVEL-002` Difficulty curve — IN PROGRESS under issue #134. |"
              ),
              (
                  "| Status | Structural solvability is mechanically guarded for all 150 generated levels: bounds/world mapping, canonical products, multi-target/non-orphan cargo, sufficient move budgets, uniqueness, and complete level-set coverage are regression-tested. Difficulty balancing remains separate LEVEL-002 work. |",
                  "| Status | LEVEL-002 is converting the deterministic generator's implicit progression into typed tutorial/easy/medium/hard/expert quantitative bands with per-level metrics and macro-progression acceptance. Current content remains unchanged unless measured validation exposes a real balance defect. |"
              ),
              (
                  "| Next recommended feature | `LEVEL-002` difficulty curve: define quantitative difficulty-band targets and add deterministic validation across the 150 generated levels now that LEVEL-003 structural solvability is verified. |",
                  "| Next recommended feature | Complete LEVEL-002 issue #134; select the next unblocked catalog task only after its final verification/reconciliation. |"
              ),
          ]
          for old, new in status_replacements:
              count = status.count(old)
              if count != 1:
                  raise SystemExit(f'status replacement expected once, found {count}: {old[:120]}')
              status = status.replace(old, new)
          status_path.write_text(status, encoding='utf-8')

      - name: Commit tracking and remove helper
        shell: bash
        run: |
          rm .github/workflows/level002_start.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: mark LEVEL-002 in progress"
          git push origin HEAD:${GITHUB_REF_NAME}
