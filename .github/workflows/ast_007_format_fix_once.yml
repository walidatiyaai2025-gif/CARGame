name: AST-007 Format Fix Once

on:
  push:
    branches:
      - agent/ast-007-cargo-visual-pack

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ast-007-cargo-visual-pack
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply canonical Dart formatting
        run: >-
          dart format
          lib/core/assets/game_manifest_asset_view.dart
          test/core/assets/game_manifest_asset_view_test.dart
      - name: Verify focused manifest view regression
        run: |
          flutter pub get --enforce-lockfile
          flutter test test/core/assets/game_manifest_asset_view_test.dart
      - name: Verify whitespace
        run: git diff --check
      - name: Remove one-shot workflow
        run: rm .github/workflows/ast_007_format_fix_once.yml
      - name: Commit formatter result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "AST-007: format manifest readiness fix"
          git push origin HEAD:agent/ast-007-cargo-visual-pack