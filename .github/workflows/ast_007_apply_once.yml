name: AST-007 Apply Once

on:
  push:
    branches:
      - agent/ast-007-cargo-visual-pack

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ast-007-cargo-visual-pack

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Apply AST-007 implementation
        run: python3 tool/apply_ast_007_once.py

      - name: Format changed Dart
        run: >-
          dart format
          lib/features/game/cargo_visual_catalog.dart
          lib/features/game/cargo_visual_asset.dart
          lib/features/game/gameplay_operations_deck.dart
          lib/features/game/game_screen.dart
          test/features/game/cargo_visual_catalog_test.dart
          test/features/game/cargo_visual_asset_test.dart

      - name: Verify AST-007 machine contract
        run: python3 tool/verify_ast_007_cargo_visuals.py

      - name: Test AST-007 validator regressions
        run: python3 tool/test_ast_007_cargo_visuals.py

      - name: Verify dashboard/catalog parity
        run: python3 tool/verify_dashboard_catalog.py

      - name: Verify CI integrity
        run: python3 tool/verify_ci_integrity.py

      - name: Restore packages
        run: flutter pub get --enforce-lockfile

      - name: Validate asset admission pipeline
        run: dart run tool/validate_asset_pipeline.dart

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test AST-007 focused Flutter contract
        run: >-
          flutter test
          test/features/game/cargo_visual_catalog_test.dart
          test/features/game/cargo_visual_asset_test.dart
          test/features/game/game_screen_responsive_test.dart

      - name: Verify whitespace
        run: git diff --check

      - name: Restore protected normal CI workflow
        run: git checkout HEAD -- .github/workflows/flutter_ci.yml

      - name: Remove one-shot tooling and transient caches
        run: |
          rm .github/workflows/ast_007_apply_once.yml
          rm tool/apply_ast_007_once.py
          rm -rf tool/__pycache__

      - name: Commit implementation candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "AST-007: add deterministic cargo visual catalog"
          git push origin HEAD:agent/ast-007-cargo-visual-pack
