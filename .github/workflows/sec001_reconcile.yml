name: SEC001 Tracking Reconciliation

on:
  push:
    branches:
      - agent/sec-001-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile catalog and status
        shell: python
        run: |
          from pathlib import Path

          catalog_path = Path('docs/FEATURE_CATALOG.md')
          catalog = catalog_path.read_text(encoding='utf-8')
          replacements = [
              (
                  "| SEC-001 | Mobile security baseline and threat model | P0 | PLANNED | ENG-010 | Threats, trust boundaries, secure storage, network rules, tamper risks, and mitigations are documented. |",
                  "| SEC-001 | Mobile security baseline and threat model | P0 | VERIFIED | ENG-010 | Historical PR #35 established the threat-model/CI gate; issue #34 / PR #128 refreshed it against current main. The security model now mirrors PRIV-001 Ads/diagnostics runtime-control truth, classifies six protected asset groups including transaction/reward recovery state and the storage-recovery snapshot, and validates network processor/trust-boundary parity, protected-asset ownership, privacy security-gap ownership, threat structure, and secret-policy controls. Flutter CI #655 / run `31300172519` passed privacy/security validation, Analyze, full Flutter tests, Debug APK build and artifact upload on head `e25c4f8239635981d43e7c0865c2f9f04c3e8b8e`. Debug artifact #9034317021 is 80,544,512 bytes with SHA-256 `67938778535d63de844f455b324796a4488b1a33efe20ea004fe9894d9db135d`; PR #128 squash-merged as `c0e7c561e0bafa810ef9248322102b10b684a490`. SEC-002, SEC-003, ADS-007, ENG-013, PRIV-002, and TEST-011 remain explicit downstream gates. |"
              ),
              (
                  "- None after `PRIV-001` verification.",
                  "- None after `SEC-001` verification."
              ),
              (
                  "1. `SEC-001` Mobile security baseline and threat model — historical PR #35 implemented the baseline, but current-main reconciliation must account for the refreshed PRIV-001 processor/gating truth and later persistence/release hardening.\n2. `AST-011` Asset licensing and provenance — `AST-001` is VERIFIED; commercial-use provenance remains a release-critical content-rights prerequisite.",
                  "1. `AST-011` Asset licensing and provenance — `AST-001` is VERIFIED; commercial-use provenance remains a release-critical content-rights prerequisite."
              ),
              (
                  "- `REL-007`/`REL-008` distribution-ready artifact verification requires the actual production AdMob application configuration and real release signing material, both intentionally external to source control.",
                  "- `PRIV-002` remains blocked on `ADS-007`; policy/store disclosures must match the final consent-aware ad SDK behavior.\n- `SEC-002` remains dependency-blocked while `ENG-006` and `ENG-007` are PLANNED.\n- `TEST-011` now has its declared PRIV-001/SEC-001 prerequisites satisfied, but its acceptance cannot pass until ADS-007 consent, PRIV-003 deletion controls, and SEC-002 dependency/artifact scanning are completed.\n- `REL-007`/`REL-008` distribution-ready artifact verification requires the actual production AdMob application configuration and real release signing material, both intentionally external to source control."
              ),
              (
                  "## Recently verified\n\n- `PRIV-001` Privacy inventory, consent, and data minimization",
                  "## Recently verified\n\n- `SEC-001` Mobile security baseline and threat model — issue #34 / PR #128 refreshed historical PR #35 to current main, mirrored PRIV-001 Ads/diagnostics runtime truth, classified transaction/recovery assets, and strengthened runtime-parity/protected-asset/threat validation. Flutter CI #655 passed all gates and uploaded artifact #9034317021 (`67938778535d63de844f455b324796a4488b1a33efe20ea004fe9894d9db135d`); PR #128 merged as `c0e7c561e0bafa810ef9248322102b10b684a490`.\n- `PRIV-001` Privacy inventory, consent, and data minimization"
              ),
          ]
          for old, new in replacements:
              count = catalog.count(old)
              if count != 1:
                  raise SystemExit(f'catalog replacement expected once, found {count}: {old[:100]}')
              catalog = catalog.replace(old, new)
          catalog_path.write_text(catalog, encoding='utf-8')

          status_path = Path('docs/STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          status_replacements = [
              (
                  "| Primary feature | None; `PRIV-001` is VERIFIED after issue #32 / PR #126 current-main refresh. |",
                  "| Primary feature | None; `SEC-001` is VERIFIED after issue #34 / PR #128 current-main refresh. |"
              ),
              (
                  "| Completed checkpoint | `PRIV-001` privacy inventory current-main reconciliation — PR #126 merged as `dd076dd383d6c3cd0dd33986f980e8b4f012b38b` after Flutter CI #651 passed the strengthened privacy drift gate, security cross-check, full Flutter suite, Debug APK and artifact upload. |",
                  "| Completed checkpoint | `SEC-001` mobile security baseline current-main reconciliation — PR #128 merged as `c0e7c561e0bafa810ef9248322102b10b684a490` after Flutter CI #655 passed privacy/security runtime parity, full Flutter tests, Debug APK build and artifact upload. |"
              ),
              (
                  "| Status | Privacy inventory is synchronized with the current 33 persisted key/prefix families and mechanically drift-protected; Google Mobile Ads is the sole declared network processor. ADS-007 ad-consent/bootstrap gating, ENG-013 diagnostics gating, PRIV-003 in-app data controls, and PRIV-002 store/policy mapping remain explicit follow-ups. |",
                  "| Status | Security baseline now mirrors PRIV-001 runtime truth, classifies current transaction/reward/recovery assets, and mechanically validates network/trust-boundary, protected-asset, privacy-gap, threat, and secret-policy parity. ADS-007, ENG-013, SEC-002, SEC-003, PRIV-002, and TEST-011 remain explicit downstream gates. |"
              ),
              (
                  "| Previous checkpoint | `ECON-005` versioned economy configuration — PR #124 merged as `2091cf35ff9b4a261fa76f9d90975735711c58e3` after Flutter CI #647. |",
                  "| Previous checkpoint | `PRIV-001` privacy inventory current-main reconciliation — PR #126 merged as `dd076dd383d6c3cd0dd33986f980e8b4f012b38b` after Flutter CI #651. |"
              ),
              (
                  "| Next recommended feature | `SEC-001` mobile security baseline and threat model current-main reconciliation: historical PR #35 exists, but it must be checked against the refreshed privacy processor/gating truth and later release-hardening changes. |",
                  "| Next recommended feature | `AST-011` asset licensing and provenance: `AST-001` is VERIFIED and commercial-use provenance is the next unblocked release-critical P0 prerequisite. |"
              ),
              (
                  "## PRIV-001 privacy inventory current-main verification — 2026-08-09",
                  "## SEC-001 mobile security baseline current-main verification — 2026-08-09\n\n- Historical PR #35 established the original human/machine mobile threat model and CI security-baseline gate; issue #34 was reopened because later privacy, persistence, transaction, economy, signing, and secret-hardening work changed current-main security truth.\n- PR #128 reconciles the client/local-storage/Google Mobile Ads/CI-secret-store/future-backend trust boundaries and classifies six protected asset groups, including transaction/reward recovery state and the storage-recovery snapshot.\n- The threat model now distinguishes `AdService` request/load/show gating from the still-ungated `MobileAds` SDK bootstrap, and records the ineffective `ENABLE_DIAGNOSTICS` bootstrap gate while preserving redacted local-only diagnostics. Owners remain ADS-007 and ENG-013.\n- `tool/verify_security_baseline.py` cross-checks security runtime-control truth against PRIV-001, network processors against trust boundaries, protected-asset ownership/location, security-relevant privacy gap ownership, required threat categories/structure, and ENG-010 secret-policy controls.\n- REL-004, SHOP-002, REW-007, ECON-005, REL-006, and ENG-010 are reflected as verified mitigation inputs without falsely completing SEC-002, SEC-003, ADS-007, ENG-013, PRIV-002, or TEST-011.\n- Final implementation head `e25c4f8239635981d43e7c0865c2f9f04c3e8b8e` passed Flutter CI #655 / run `31300172519`, including privacy/security validation, formatting, Analyze, full Flutter tests, Debug APK build, and upload.\n- Debug artifact #9034317021 is 80,544,512 bytes with SHA-256 `67938778535d63de844f455b324796a4488b1a33efe20ea004fe9894d9db135d`.\n- PR #128 squash-merged to `main` as `c0e7c561e0bafa810ef9248322102b10b684a490`; `SEC-001` is VERIFIED.\n- Next release-critical unblocked P0 selected for audit: `AST-011`.\n\n## PRIV-001 privacy inventory current-main verification — 2026-08-09"
              ),
              (
                  "| 2026-08-09 | PRIV-001 privacy inventory current-main reconciliation | PASSED — PR #126 / Flutter CI #651 / run `31299285194` / debug artifact #9034063433 / SHA-256 `6fc839b195551ffcdbb0bd30b69bb9f29124aa5b9f5277ab8aa981d3508f4f9c` |",
                  "| 2026-08-09 | SEC-001 mobile security baseline current-main reconciliation | PASSED — PR #128 / Flutter CI #655 / run `31300172519` / debug artifact #9034317021 / SHA-256 `67938778535d63de844f455b324796a4488b1a33efe20ea004fe9894d9db135d` |\n| 2026-08-09 | PRIV-001 privacy inventory current-main reconciliation | PASSED — PR #126 / Flutter CI #651 / run `31299285194` / debug artifact #9034063433 / SHA-256 `6fc839b195551ffcdbb0bd30b69bb9f29124aa5b9f5277ab8aa981d3508f4f9c` |"
              ),
          ]
          for old, new in status_replacements:
              count = status.count(old)
              if count != 1:
                  raise SystemExit(f'status replacement expected once, found {count}: {old[:100]}')
              status = status.replace(old, new)
          status_path.write_text(status, encoding='utf-8')

      - name: Commit reconciliation and remove helper
        shell: bash
        run: |
          rm .github/workflows/sec001_reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: reconcile SEC-001 verification"
          git push origin HEAD:${GITHUB_REF_NAME}
