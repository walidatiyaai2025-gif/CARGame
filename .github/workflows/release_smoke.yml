name: Android Release Packaging Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release_smoke.yml'
      - 'android/**'
      - 'BUILD_RC.ps1'
      - 'BUILD_COMMON.ps1'
      - 'VERIFY_RELEASE_INPUTS.ps1'
      - 'tool/test_release_input_preflight.ps1'
      - 'tool/verify_dependency_security.py'
      - 'tool/security_advisory_exceptions.json'
      - 'tool/verify_build_artifact_security.py'
      - 'tool/test_security_scans.py'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

concurrency:
  group: release-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-packaging-smoke:
    name: Release APK + AAB smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Restore packages and capture resolved lockfile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get 2>&1 | tee /tmp/cargame-release-pub-get.log
          echo '---WORLD010-LOCKFILE-BEGIN---'
          cat pubspec.lock
          echo '---WORLD010-LOCKFILE-END---'
          exit 86

      - name: Verify dependency security advisories
        run: python3 tool/verify_dependency_security.py --input-log /tmp/cargame-release-pub-get.log

      - name: Generate localization
        run: flutter gen-l10n

      - name: Test release input preflight contract
        shell: pwsh
        run: ./tool/test_release_input_preflight.ps1

      - name: Prepare ephemeral release signing
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          keystore="$RUNNER_TEMP/cargame-release-smoke.jks"
          echo "::add-mask::$password"

          keytool -genkeypair \
            -noprompt \
            -keystore "$keystore" \
            -storepass "$password" \
            -alias release-smoke \
            -keypass "$password" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname 'CN=CARGame Release Smoke, OU=CI, O=WALKA, L=Kuwait, C=KW'

          {
            echo 'ADMOB_ANDROID_APP_ID=ca-app-pub-0000000000000000~0000000000'
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$password"
            echo 'ANDROID_KEY_ALIAS=release-smoke'
            echo "ANDROID_KEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Verify release smoke inputs
        shell: pwsh
        run: |
          $result = ./VERIFY_RELEASE_INPUTS.ps1 `
            -AndroidAdMobAppId $env:ADMOB_ANDROID_APP_ID `
            -Quiet
          if (-not $result.Ready) {
            throw 'Release smoke input preflight did not report ready.'
          }
          Write-Host 'Release smoke inputs: PASSED (values redacted)'

      - name: Build release APK smoke
        run: >-
          flutter build apk --release --no-pub
          --dart-define=APP_ENV=release
          --dart-define=ENABLE_ADS=false

      - name: Build release AAB smoke
        run: >-
          flutter build appbundle --release --no-pub
          --dart-define=APP_ENV=release
          --dart-define=ENABLE_ADS=false

      - name: Verify release artifact security
        run: >-
          python3 tool/verify_build_artifact_security.py
          build/app/outputs/flutter-apk/app-release.apk
          build/app/outputs/bundle/release/app-release.aab

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          apk='build/app/outputs/flutter-apk/app-release.apk'
          aab='build/app/outputs/bundle/release/app-release.aab'
          test -s "$apk"
          test -s "$aab"
          mkdir -p build/release-smoke-evidence
          {
            echo 'NON-DISTRIBUTABLE RELEASE PACKAGING SMOKE'
            echo 'Ephemeral CI signing; synthetic compile-only AdMob application ID; runtime ads disabled.'
            echo 'Dependency advisories and packaged artifact leakage checks passed before evidence upload.'
            sha256sum "$apk"
            sha256sum "$aab"
          } | tee build/release-smoke-evidence/checksums.txt

      - name: Upload release smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: cargame-release-smoke-evidence
          path: build/release-smoke-evidence/checksums.txt
          if-no-files-found: error
          retention-days: 7
