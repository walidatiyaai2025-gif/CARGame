name: One-time GameButton adoption

on:
  push:
    branches: [main]
    paths:
      - scripts/one_time_gamebutton_adoption.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/one_time_gamebutton_adoption.py
      - name: Format and verify
        run: |
          dart format lib/features/home/home_screen.dart lib/features/levels/city_briefing_screen.dart lib/features/shop/shop_screen.dart
          git diff --check
      - name: Commit checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(motion): adopt GameButton in major CTAs [skip ci]"
          git push
