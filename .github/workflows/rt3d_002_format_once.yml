name: RT3D-002 One-shot Dart Format

on:
  push:
    branches: [agent/rt3d-002-slice-01]
    paths:
      - 'lib/core/domain/realtime_3d/renderer_admission.dart'
      - 'lib/core/domain/realtime_3d/production_scene_slice.dart'
      - 'test/core/domain/realtime_3d_renderer_admission_test.dart'
      - 'test/core/domain/realtime_3d_production_scene_slice_test.dart'
      - '.github/workflows/rt3d_002_format_once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rt3d-002-slice-01

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Format RT3D-002 Dart files
        run: >-
          dart format
          lib/core/domain/realtime_3d/renderer_admission.dart
          lib/core/domain/realtime_3d/production_scene_slice.dart
          test/core/domain/realtime_3d_renderer_admission_test.dart
          test/core/domain/realtime_3d_production_scene_slice_test.dart

      - name: Commit formatter output when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "RT3D-002 Dart files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/domain/realtime_3d/renderer_admission.dart \
            lib/core/domain/realtime_3d/production_scene_slice.dart \
            test/core/domain/realtime_3d_renderer_admission_test.dart \
            test/core/domain/realtime_3d_production_scene_slice_test.dart
          git commit -m "chore: format RT3D-002 Dart sources"
          git push origin HEAD:agent/rt3d-002-slice-01
