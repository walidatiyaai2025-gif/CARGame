name: GAME-017 Test Probe

on:
  pull_request:
    paths:
      - 'lib/features/game/**'
      - 'test/**'
      - '.github/workflows/game_017_test_probe.yml'

permissions:
  contents: read

jobs:
  full-suite-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Restore packages
        run: flutter pub get --enforce-lockfile
      - name: Generate localization
        run: flutter gen-l10n
      - name: Run full suite and capture output
        id: tests
        shell: bash
        run: |
          set +e
          flutter test --reporter=expanded > game017-test.log 2>&1
          code=$?
          cat game017-test.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game017-test-log
          path: game017-test.log
          if-no-files-found: error
      - name: Preserve test result
        if: always()
        shell: bash
        run: exit "${{ steps.tests.outputs.exit_code }}"
