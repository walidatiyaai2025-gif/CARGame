name: Temporary ADS-002 reconciliation

on:
  push:
    branches:
      - agent/ads-002-reconcile
    paths:
      - '.github/workflows/_temporary_reconcile_ads002.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ads-002-reconcile
          fetch-depth: 0
      - name: Apply reconciliation and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/_reconcile_ads002.py
          git rm tool/_reconcile_ads002.py .github/workflows/_temporary_reconcile_ads002.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/ADS-002.md
          git commit -m 'docs: verify ADS-002 release ad configuration'
          git push origin HEAD:agent/ads-002-reconcile
