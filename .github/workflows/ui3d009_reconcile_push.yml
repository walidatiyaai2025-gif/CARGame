name: UI3D-009 Reconcile Push

on:
  push:
    branches:
      - agent/ui3d-009-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui3d-009-reconcile
          fetch-depth: 0
      - name: Reconcile UI3D-009 evidence
        shell: bash
        run: |
          python3 .github/scripts/ui3d009_reconcile.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/UI3D-009.md
          git rm .github/workflows/ui3d009_reconcile_push.yml .github/scripts/ui3d009_reconcile.py
          git commit -m 'docs: reconcile UI3D-009 verification'
          git push origin HEAD:agent/ui3d-009-reconcile
