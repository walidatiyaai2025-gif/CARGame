name: A11Y-003 Bootstrap V2

on:
  push:
    branches:
      - agent/a11y-003-reduced-motion-enforcement

permissions:
  contents: write

concurrency:
  group: a11y-003-bootstrap-v2
  cancel-in-progress: true

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/a11y-003-reduced-motion-enforcement
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Apply A11Y-003 implementation
        run: python3 tool/bootstrap_a11y_003.py

      - name: Correct validator enum ownership and route cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          verifier = Path('tool/verify_a11y_003_reduced_motion.py')
          text = verifier.read_text(encoding='utf-8')
          old = """    'GameMotionIntent.essential',
              'GameMotionIntent.nonessential',
              'GameMotionIntent.cinematic',
          """
          new = """    'essential,',
              'nonessential,',
              'cinematic,',
          """
          if old not in text:
              raise SystemExit('verifier enum ownership anchor missing')
          verifier.write_text(text.replace(old, new, 1), encoding='utf-8')

          mutations = Path('tool/test_a11y_003_reduced_motion.py')
          text = mutations.read_text(encoding='utf-8')
          old = """    'GameMotionIntent.essential',
              'GameMotionIntent.nonessential',
              'GameMotionIntent.cinematic',
          """
          new = """    'essential,',
              'nonessential,',
              'cinematic,',
          """
          if old not in text:
              raise SystemExit('mutation enum ownership anchor missing')
          mutations.write_text(text.replace(old, new, 1), encoding='utf-8')

          route = Path('lib/core/motion/game_route.dart')
          text = route.read_text(encoding='utf-8')
          text = text.replace(
              '    const intent = GameMotionIntent.essential;\n'
              '    final reducedMotion = profile.reducedMotion;\n',
              '    const intent = GameMotionIntent.essential;\n',
              1,
          )
          route.write_text(text, encoding='utf-8')
          PY

      - name: Restore packages
        run: flutter pub get --enforce-lockfile

      - name: Format changed Dart
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/core/motion/game_motion.dart \
            lib/core/motion/game_cinematic_gate.dart \
            lib/core/motion/game_route.dart \
            lib/core/motion/game_travel_motion.dart \
            lib/core/motion/ambient_motion_background.dart \
            lib/core/motion/game_action_feedback.dart \
            lib/core/widgets/game_button.dart \
            lib/features/settings/settings_screen.dart \
            test/core/motion/a11y_003_motion_policy_test.dart \
            test/core/motion/game_cinematic_gate_test.dart \
            test/features/settings/visual_effects_settings_test.dart

      - name: Validate A11Y-003 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/verify_a11y_003_reduced_motion.py
          python3 tool/test_a11y_003_reduced_motion.py
          python3 tool/verify_ui3d_007_visual_effects.py
          python3 tool/test_ui3d_007_visual_effects.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          python3 tool/verify_test_quality.py
          python3 tool/test_test_quality.py
          python3 tool/verify_privacy_inventory.py
          git diff --check

      - name: Run focused Flutter tests
        run: >-
          flutter test
          test/core/motion/a11y_003_motion_policy_test.dart
          test/core/motion/game_cinematic_gate_test.dart
          test/core/motion/game_motion_test.dart
          test/core/motion/game_route_test.dart
          test/core/motion/game_travel_motion_test.dart
          test/core/motion/game_action_feedback_test.dart
          test/core/motion/motion_lifecycle_scope_test.dart
          test/core/motion/ui3d_007_visual_effects_test.dart
          test/core/widgets/game_button_test.dart
          test/features/settings/visual_effects_settings_test.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm tool/bootstrap_a11y_003.py
          rm .github/workflows/a11y_003_bootstrap.yml
          rm .github/workflows/a11y_003_bootstrap_v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "A11Y-003: enforce reduced-motion accessibility"
          git push origin HEAD:agent/a11y-003-reduced-motion-enforcement
