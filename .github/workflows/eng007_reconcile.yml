name: ENG-007 Reconcile

on:
  push:
    branches:
      - agent/eng-007-reconcile
    paths:
      - '.github/workflows/eng007_reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eng-007-reconcile
          fetch-depth: 0
      - name: Reconcile ENG-007 verification evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/eng007_reconcile.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/ENG-007.md
          git rm .github/scripts/eng007_reconcile.py .github/workflows/eng007_reconcile.yml
          git commit -m 'docs: reconcile ENG-007 verification evidence'
          git push origin HEAD:agent/eng-007-reconcile
