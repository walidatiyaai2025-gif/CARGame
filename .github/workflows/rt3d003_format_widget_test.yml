name: RT3D-003 Widget Test Format Once

on:
  push:
    branches:
      - agent/rt3d-003-cinematic-polish-refresh

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rt3d-003-cinematic-polish-refresh
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Format widget test and push source only
        shell: bash
        run: |
          set -euo pipefail
          dart format test/features/realtime_3d_preview_screen_test.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/features/realtime_3d_preview_screen_test.dart
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'RT3D-003 format Visual Lab widget tests'
          git push origin HEAD:agent/rt3d-003-cinematic-polish-refresh
