name: WORLD-009 Repair

on:
  push:
    branches:
      - agent/world-009-real-capital-map

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/world-009-real-capital-map
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply compact-layout and localization repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'expected block missing in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          level_select = 'lib/features/levels/level_select_screen.dart'
          replace(
              level_select,
              '''                    Row(
                      children: [
                        _StageMeta(
                          icon: Icons.flag_rounded,
                          text:
                              '${isArabic ? 'مرحلة' : 'Level'} ${level.number}',
                        ),
                        const SizedBox(width: 7),
                        _StageMeta(
                          icon: Icons.inventory_2_rounded,
                          text:
                              '${level.items.length} ${isArabic ? 'منتج' : 'cargo'}',
                        ),
                        const SizedBox(width: 7),
                        _StageMeta(
                          icon: Icons.house_rounded,
                          text:
                              '${level.houseCount} ${isArabic ? 'بيوت' : 'houses'}',
                        ),
                      ],
                    ),''',
              '''                    Wrap(
                      spacing: 7,
                      runSpacing: 5,
                      children: [
                        _StageMeta(
                          icon: Icons.flag_rounded,
                          text:
                              '${isArabic ? 'مرحلة' : 'Level'} ${level.number}',
                        ),
                        _StageMeta(
                          icon: Icons.inventory_2_rounded,
                          text:
                              '${level.items.length} ${isArabic ? 'منتج' : 'cargo'}',
                        ),
                        _StageMeta(
                          icon: Icons.house_rounded,
                          text:
                              '${level.houseCount} ${isArabic ? 'بيوت' : 'houses'}',
                        ),
                      ],
                    ),''',
          )
          replace(
              level_select,
              '''  Widget build(BuildContext context) {
    return Flexible(
      child: Container(
        padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 5),
        decoration: BoxDecoration(
          color: const Color(0xFFF1F4F8),
          borderRadius: BorderRadius.circular(12),
        ),
        child: Row(
          mainAxisSize: MainAxisSize.min,
          children: [
            Icon(icon, size: 12, color: AppTheme.muted),
            const SizedBox(width: 4),
            Flexible(
              child: Text(
                text,
                maxLines: 1,
                overflow: TextOverflow.ellipsis,
                style: const TextStyle(
                  color: AppTheme.muted,
                  fontSize: 8.5,
                  fontWeight: FontWeight.w800,
                ),
              ),
            ),
          ],
        ),
      ),
    );
  }''',
              '''  Widget build(BuildContext context) {
    return Container(
      padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 5),
      decoration: BoxDecoration(
        color: const Color(0xFFF1F4F8),
        borderRadius: BorderRadius.circular(12),
      ),
      child: Row(
        mainAxisSize: MainAxisSize.min,
        children: [
          Icon(icon, size: 12, color: AppTheme.muted),
          const SizedBox(width: 4),
          Text(
            text,
            maxLines: 1,
            overflow: TextOverflow.ellipsis,
            style: const TextStyle(
              color: AppTheme.muted,
              fontSize: 8.5,
              fontWeight: FontWeight.w800,
            ),
          ),
        ],
      ),
    );
  }''',
          )

          capital_map = Path('lib/features/levels/capital_world_map.dart')
          text = capital_map.read_text()
          text = text.replace("import '../../core/theme/app_theme.dart';\n", '')
          capital_map.write_text(text)

          briefing = 'lib/features/levels/city_briefing_screen.dart'
          replace(
              briefing,
              '''    final world = gameWorlds[level.world - 1];
    final previousStars = store.starsForLevel(level.number);''',
              '''    final world = gameWorlds[level.world - 1];
    final route = capitalRouteForWorld(level.world);
    final previousStars = store.starsForLevel(level.number);''',
          )
          replace(
              briefing,
              '''                                worldName: world.name,''',
              '''                                worldName: route.name(isArabic),''',
          )
          replace(
              briefing,
              '''              '${isArabic ? 'العالم' : 'WORLD'} $worldNumber',''',
              '''              '${isArabic ? 'المسار' : 'ROUTE'} $worldNumber',''',
          )
          replace(
              briefing,
              '''                        level.cityName,''',
              '''                        level.localizedCityName(isArabic),''',
          )
          replace(
              briefing,
              '''                        '$worldName • ${isArabic ? 'المرحلة' : 'Level'} ${level.number}',''',
              '''                        '${level.localizedCountryName(isArabic)} • $worldName • ${isArabic ? 'المرحلة' : 'Level'} ${level.number}',''',
          )
          replace(
              briefing,
              '''                    semanticLabel: level.cityName,''',
              '''                    semanticLabel: level.localizedDestinationLabel(isArabic),''',
          )

          game = 'lib/features/game/game_screen.dart'
          replace(
              game,
              '''    final world = gameWorlds[widget.level.world - 1];

    await showModalBottomSheet<void>(''',
              '''    final routeName = capitalRouteForWorld(widget.level.world).name(ar);

    await showModalBottomSheet<void>(''',
          )
          replace(
              game,
              '''        cityName: widget.level.cityName,
        worldName: world.name,''',
              '''        cityName: widget.level.localizedDestinationLabel(ar),
        worldName: routeName,''',
          )
          replace(
              game,
              '''    final world = gameWorlds[widget.level.world - 1];
    final ar = Localizations.localeOf(context).languageCode == 'ar';
    final flight = _flight;''',
              '''    final world = gameWorlds[widget.level.world - 1];
    final ar = Localizations.localeOf(context).languageCode == 'ar';
    final routeName = capitalRouteForWorld(widget.level.world).name(ar);
    final flight = _flight;''',
          )
          replace(
              game,
              '''                          cityName: widget.level.cityName,
                          worldName: world.name,''',
              '''                          cityName: widget.level.localizedDestinationLabel(ar),
                          worldName: routeName,''',
          )

          responsive = 'test/features/levels/level_select_responsive_test.dart'
          replace(
              responsive,
              '''    final compactException = tester.takeException();
    if (compactException != null) {
      debugPrint('WORLD009_COMPACT_EXCEPTION: $compactException');
      debugDumpRenderTree();
    }
    expect(compactException, isNull);''',
              '''    expect(tester.takeException(), isNull);''',
          )

          Path('test/features/levels/level_select_overflow_probe_test.dart').unlink(missing_ok=True)
          Path('.github/workflows/world009_overflow_probe.yml').unlink(missing_ok=True)
          PY

          dart format \
            lib/features/levels/level_select_screen.dart \
            lib/features/levels/capital_world_map.dart \
            lib/features/levels/city_briefing_screen.dart \
            lib/features/game/game_screen.dart \
            test/features/levels/level_select_responsive_test.dart

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'WORLD-009 fix compact map and localize destinations'
          git push origin HEAD:agent/world-009-real-capital-map
