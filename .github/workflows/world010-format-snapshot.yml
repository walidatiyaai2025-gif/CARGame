name: WORLD-010 Format Snapshot

on:
  pull_request:
    paths:
      - lib/features/levels/capital_world_map.dart
      - .github/workflows/world010-format-snapshot.yml

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Format source
        run: dart format lib/features/levels/capital_world_map.dart
      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: world010-formatted-map-source
          path: lib/features/levels/capital_world_map.dart
          if-no-files-found: error
          retention-days: 1
