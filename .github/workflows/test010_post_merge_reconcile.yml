name: TEST-010 post-merge reconciliation

on:
  push:
    branches:
      - agent/test-010-post-merge-reconcile
    paths:
      - .github/workflows/test010_post_merge_reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/test-010-post-merge-reconcile
          fetch-depth: 0

      - name: Reconcile final TEST-010 evidence
        run: python3 tool/reconcile_test010_post_merge.py

      - name: Validate catalog and dashboard contracts
        run: |
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py

      - name: Commit docs-only reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/TEST-010.md
          if git diff --cached --quiet; then
            echo "No reconciliation changes required"
            exit 0
          fi
          git commit -m "TEST-010: reconcile merged verification evidence [skip ci]"
          git push origin HEAD:agent/test-010-post-merge-reconcile
