name: SEC-002 Focused Security Probe

on:
  push:
    branches:
      - agent/sec-002-security-scans
    paths:
      - .github/workflows/sec002_probe.yml

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sec-002-security-scans
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Verify SEC-002 focused contracts
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/verify_secret_hygiene.dart
          dart run tool/test_secret_hygiene.dart
          python3 tool/test_security_scans.py
          python3 tool/verify_dependency_security.py
          python3 tool/verify_ci_integrity.py
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter build apk --debug --no-pub
          python3 tool/verify_build_artifact_security.py build/app/outputs/flutter-apk/app-debug.apk
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/sec002_probe.yml
          git commit -m 'ci: remove SEC-002 focused probe'
          git push origin HEAD:agent/sec-002-security-scans
