name: Apply fullscreen home banner
on:
  push:
    paths:
      - scripts/apply_fullscreen_home_banner.py
      - .github/workflows/apply_fullscreen_home_banner.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: python scripts/apply_fullscreen_home_banner.py
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --debug --no-pub
      - name: Commit checkpoint
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib scripts/apply_fullscreen_home_banner.py
          git commit -m "feat(home): fit fullscreen layout with banner footer [skip ci]" || exit 0
          git push
