name: Temporary TEST-004 production patch

on:
  push:
    branches:
      - agent/test-004-navigation-race-current
    paths:
      - .github/workflows/_temporary_test004_production_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-004-navigation-race-current
          fetch-depth: 0
      - name: Apply result navigation hardening
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/game/game_screen.dart')
          text = path.read_text()
          old = '''  Future<void> _closeResultAndReturnToMap(BuildContext sheetContext) async {
            if (_resultActionBusy) return;
            _resultActionBusy = true;

            Navigator.of(sheetContext).pop();
            await Future<void>.delayed(const Duration(milliseconds: 260));
            if (!mounted) return;

            await Navigator.of(context).maybePop();
          }

          Future<void> _retryFromResult(BuildContext sheetContext) async {
            if (_resultActionBusy) return;
            _resultActionBusy = true;

            Navigator.of(sheetContext).pop();
            await Future<void>.delayed(const Duration(milliseconds: 220));
            if (!mounted) return;
            setState(() => _reset());
          }
'''
          new = '''  void _dismissResultSheet(BuildContext sheetContext) {
            final route = ModalRoute.of(sheetContext);
            if (route == null) return;
            Navigator.of(sheetContext).removeRoute(route);
          }

          Future<void> _closeResultAndReturnToMap(BuildContext sheetContext) async {
            if (_resultActionBusy) return;
            _resultActionBusy = true;

            final route = ModalRoute.of(context);
            if (route == null) return;
            final navigator = Navigator.of(context);
            _dismissResultSheet(sheetContext);
            await WidgetsBinding.instance.endOfFrame;
            if (!mounted) return;
            navigator.removeRoute(route);
          }

          Future<void> _retryFromResult(BuildContext sheetContext) async {
            if (_resultActionBusy) return;
            _resultActionBusy = true;

            _dismissResultSheet(sheetContext);
            if (!mounted) return;
            setState(() => _reset());
          }
'''
          if old not in text:
              raise SystemExit('Expected result navigation block was not found')
          text = text.replace(old, new, 1)

          old_reward = '''                                  onReward: () {
                                    if (!mounted) return;
                                    Navigator.of(sheetContext).pop();
                                    setState(() {
'''
          new_reward = '''                                  onReward: () {
                                    if (!mounted) return;
                                    _dismissResultSheet(sheetContext);
                                    setState(() {
'''
          if old_reward not in text:
              raise SystemExit('Expected rewarded callback block was not found')
          path.write_text(text.replace(old_reward, new_reward, 1))
      - name: Remove temporary workflow and push
        run: |
          git rm .github/workflows/_temporary_test004_production_patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/game/game_screen.dart
          git commit -m 'fix: make result route exits deterministic'
          git push origin HEAD:agent/test-004-navigation-race-current
