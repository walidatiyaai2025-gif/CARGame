name: Formatter Probe

on:
  pull_request:
    paths:
      - 'test/bootstrap_splash_responsive_test.dart'
      - '.github/workflows/formatter_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  show-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Show canonical format
        run: dart format --output=show test/bootstrap_splash_responsive_test.dart
