name: AST-004 Reconcile Run

on:
  push:
    branches:
      - agent/ast-004-post-merge-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/ast-004-post-merge-reconcile
          fetch-depth: 0

      - name: Apply reconciliation
        run: python3 tool/reconcile_ast004_post_merge.py

      - name: Validate reconciliation
        run: |
          python3 tool/verify_asset_cache_policy.py
          python3 tool/test_asset_cache_policy.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          python3 tool/verify_test_quality.py
          python3 tool/test_test_quality.py
          git diff --check

      - name: Commit reconciliation
        run: |
          rm .github/workflows/ast004_reconcile_run.yml
          rm tool/reconcile_ast004_post_merge.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/AST-004.md .github/workflows/ast004_reconcile_run.yml tool/reconcile_ast004_post_merge.py
          git diff --cached --check
          git commit -m "AST-004: reconcile final verified evidence"
          git push origin HEAD:agent/ast-004-post-merge-reconcile
