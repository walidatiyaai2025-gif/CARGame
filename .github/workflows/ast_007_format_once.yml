name: AST-007 format once

on:
  push:
    branches:
      - agent/ast-007-asset-intake
    paths:
      - .github/workflows/ast_007_format_once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ast-007-asset-intake
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Canonical Dart format
        run: >-
          dart format
          lib/core/assets/game_asset_intake_plan.dart
          test/core/assets/game_asset_intake_plan_test.dart
          tool/plan_ast_007_asset_intake.dart

      - name: Commit formatted sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            lib/core/assets/game_asset_intake_plan.dart \
            test/core/assets/game_asset_intake_plan_test.dart \
            tool/plan_ast_007_asset_intake.dart; then
            echo "Files already canonical."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/core/assets/game_asset_intake_plan.dart \
            test/core/assets/game_asset_intake_plan_test.dart \
            tool/plan_ast_007_asset_intake.dart
          git commit -m "style: format AST-007 asset intake"
          git push origin HEAD:agent/ast-007-asset-intake
