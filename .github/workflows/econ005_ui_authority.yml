name: ECON005 UI Authority

on:
  push:
    branches:
      - agent/econ-005-versioned-economy

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/econ-005-versioned-economy
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Bind UI to economy authority
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/econ005_ui_authority.py
          dart format \
            lib/core/economy/economy_config.dart \
            lib/core/storage/progress_store.dart \
            lib/features/home/home_screen.dart \
            lib/features/progress/progress_hub_screen.dart \
            test/features/progress/progress_hub_game_panel_test.dart
          flutter pub get
          flutter test \
            test/features/progress/progress_hub_game_panel_test.dart \
            test/features/progress/progress_hub_responsive_test.dart \
            test/features/home/home_ambient_background_test.dart \
            test/features/home/home_environment_responsive_test.dart \
            test/features/home/home_navigation_test.dart \
            test/features/home/home_shared_panels_test.dart \
            test/core/economy/economy_config_test.dart \
            test/core/economy/economy_migration_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check
          git rm tools/econ005_ui_authority.py .github/workflows/econ005_ui_authority.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/core/economy/economy_config.dart \
            lib/core/storage/progress_store.dart \
            lib/features/home/home_screen.dart \
            lib/features/progress/progress_hub_screen.dart \
            test/features/progress/progress_hub_game_panel_test.dart
          git commit -m 'fix: bind economy UI to versioned config'
          git push origin HEAD:agent/econ-005-versioned-economy