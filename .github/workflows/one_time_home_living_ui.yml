name: One-time living home UI

on:
  push:
    branches: [main]
    paths:
      - scripts/one_time_home_living_ui.py
      - .github/workflows/one_time_home_living_ui.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply checkpoint
        run: python scripts/one_time_home_living_ui.py
      - name: Format and static verification
        run: |
          dart format lib test
          git diff --check
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test test/features/home/home_ambient_background_test.dart
      - name: Commit checkpoint and remove temporary files
        run: |
          rm scripts/one_time_home_living_ui.py
          rm .github/workflows/one_time_home_living_ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(home): add lifecycle-safe living backdrop [skip ci]"
          git push
