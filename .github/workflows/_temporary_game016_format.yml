name: Temporary GAME-016 formatter

on:
  push:
    branches:
      - agent/game-016-input-determinism
    paths:
      - .github/workflows/_temporary_game016_format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/game-016-input-determinism
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
      - run: dart format test/features/game/game_screen_motion_test.dart
      - run: |
          git rm .github/workflows/_temporary_game016_format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/features/game/game_screen_motion_test.dart
          git commit -m 'style: format GAME-016 regression test'
          git push origin HEAD:agent/game-016-input-determinism
