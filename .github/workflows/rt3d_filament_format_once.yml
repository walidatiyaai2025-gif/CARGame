name: RT3D Filament Format Once

on:
  push:
    branches:
      - agent/rt3d-002-native-filament-slice-02

permissions:
  contents: write

concurrency:
  group: rt3d-filament-format-once
  cancel-in-progress: true

jobs:
  format-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rt3d-002-native-filament-slice-02
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Format native Filament Dart
        run: dart format lib/features/realtime_3d/native_filament_realtime_3d_scene.dart test/features/native_filament_realtime_3d_scene_test.dart
      - name: Commit canonical format and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rt3d_filament_format_once.yml
          git add lib/features/realtime_3d/native_filament_realtime_3d_scene.dart test/features/native_filament_realtime_3d_scene_test.dart
          git commit -m 'RT3D-002: apply canonical Filament Dart format'
          git push origin HEAD:agent/rt3d-002-native-filament-slice-02
