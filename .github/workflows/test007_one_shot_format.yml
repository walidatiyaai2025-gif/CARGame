name: TEST-007 One-shot formatter

on:
  push:
    branches:
      - agent/test-007-critical-path-50

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-007-critical-path-50
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply canonical Dart formatting
        run: dart format test/integration/test_007_critical_path_test.dart
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/integration/test_007_critical_path_test.dart
          git commit -m "TEST-007: apply canonical Dart formatting"
          git push origin HEAD:agent/test-007-critical-path-50