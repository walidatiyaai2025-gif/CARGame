name: UI3D-007 Format Probe

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/levels/level_select_screen.dart'
      - '.github/workflows/ui3d007_format_probe.yml'

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Show Dart format patch
        shell: bash
        run: |
          dart format lib/features/levels/level_select_screen.dart
          echo '--- FORMAT PATCH START ---'
          git diff -- lib/features/levels/level_select_screen.dart
          echo '--- FORMAT PATCH END ---'