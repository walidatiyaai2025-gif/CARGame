name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Verify dynamic Android targets
        run: dart run tool/verify_dynamic_android_targets.dart

      - name: Verify secret hygiene
        run: dart run tool/verify_secret_hygiene.dart

      - name: Test secret hygiene policy
        run: dart run tool/test_secret_hygiene.dart

      - name: Verify privacy data inventory
        run: python3 tool/verify_privacy_inventory.py

      - name: Verify analytics privacy contract
        run: python3 tool/verify_analytics_privacy.py

      - name: Verify crash reporting privacy contract
        run: python3 tool/verify_crash_reporting_privacy.py

      - name: Verify Play Data Safety disclosures
        run: python3 tool/verify_privacy_disclosures.py

      - name: Test privacy disclosure policy
        run: python3 tool/test_privacy_disclosures.py

      - name: Verify security baseline
        run: python3 tool/verify_security_baseline.py

      - name: Verify developer workflow documentation
        run: python3 tool/verify_developer_workflows.py

      - name: Test developer workflow documentation
        run: python3 tool/test_developer_workflows.py

      - name: Verify core screen widget matrix
        run: python3 tool/verify_core_screen_widget_matrix.py

      - name: Verify TEST-007 critical-path contract
        run: python3 tool/verify_test_007_critical_path.py

      - name: Test TEST-007 critical-path validator
        run: python3 tool/test_test_007_critical_path.py

      - name: Verify TEST-010 dashboard catalog parity
        run: python3 tool/verify_dashboard_catalog.py

      - name: Test TEST-010 dashboard catalog validator
        run: python3 tool/test_dashboard_catalog.py

      - name: Verify TEST-008 quality policy
        run: python3 tool/verify_test_quality.py

      - name: Test TEST-008 quality validator
        run: python3 tool/test_test_quality.py

      - name: Verify AST-004 asset cache policy
        run: python3 tool/verify_asset_cache_policy.py

      - name: Test AST-004 cache policy validator
        run: python3 tool/test_asset_cache_policy.py

      - name: Verify PERF-001 frame performance budget
        run: python3 tool/verify_frame_performance_budget.py

      - name: Test PERF-001 frame performance validator
        run: python3 tool/test_frame_performance_budget.py

      - name: Verify PERF-002 memory and image budget
        run: python3 tool/verify_memory_image_budget.py

      - name: Test PERF-002 memory budget validator
        run: python3 tool/test_memory_image_budget.py

      - name: Verify TEST-011 privacy consent and security contract
        run: python3 tool/verify_test_011_privacy_security.py

      - name: Test TEST-011 privacy consent and security validator
        run: python3 tool/test_test_011_privacy_security.py

      - name: Verify UI3D-007 adaptive visual effects
        run: python3 tool/verify_ui3d_007_visual_effects.py

      - name: Test UI3D-007 visual-effects validator
        run: python3 tool/test_ui3d_007_visual_effects.py

      - name: Verify A11Y-003 reduced motion
        run: python3 tool/verify_a11y_003_reduced_motion.py

      - name: Test A11Y-003 reduced-motion validator
        run: python3 tool/test_a11y_003_reduced_motion.py

      - name: Verify AST-007 cargo visual pack
        run: python3 tool/verify_ast_007_cargo_visuals.py

      - name: Test AST-007 cargo visual validator
        run: python3 tool/test_ast_007_cargo_visuals.py

      - name: Restore packages
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile 2>&1 | tee /tmp/cargame-pub-get.log

      - name: Verify dependency security advisories
        run: python3 tool/verify_dependency_security.py --input-log /tmp/cargame-pub-get.log

      - name: Test security scan policy
        run: python3 tool/test_security_scans.py

      - name: Verify dependency governance
        run: python3 tool/dependency_governance.py verify

      - name: Test dependency governance policy
        run: python3 tool/test_dependency_governance.py

      - name: Report dependency drift
        continue-on-error: true
        run: flutter pub outdated --json

      - name: Verify dashboard and release CI contracts
        run: python3 tool/verify_ci_integrity.py

      - name: Test dashboard and release CI contracts
        run: python3 tool/test_ci_integrity.py

      - name: Validate 3D asset registry and provenance
        run: dart run tool/validate_asset_pipeline.dart

      - name: Smoke AST-007 intake handoff
        shell: bash
        run: |
          set -euo pipefail
          dart run tool/plan_ast_007_asset_intake.dart --format=json --limit=3 > /tmp/ast007-intake.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/ast007-intake.json').read_text())
          assert data['summary']['total'] == 124
          assert 0 <= data['summary']['admitted'] <= 124
          assert data['summary']['remaining'] == 124 - data['summary']['admitted']
          assert len(data['batch']) <= 3
          assert data['batchOffset'] == 0
          PY
          dart run tool/plan_ast_007_asset_intake.dart --format=csv --limit=3 > /tmp/ast007-intake.csv
          grep -q '^assetId,concept,runtimePath,profile,width,height,state,needsRuntimeBinary,needsProvenance$' /tmp/ast007-intake.csv
          dart run tool/plan_ast_007_asset_intake.dart --summary-only > /tmp/ast007-summary.txt
          set +e
          dart run tool/plan_ast_007_asset_intake.dart --summary-only --strict > /tmp/ast007-strict.txt 2>&1
          strict_code=$?
          set -e
          if [[ "$strict_code" -ne 0 && "$strict_code" -ne 2 ]]; then
            cat /tmp/ast007-strict.txt
            exit "$strict_code"
          fi

      - name: Generate localization
        run: flutter gen-l10n

      - name: Verify changed Dart formatting
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" && -n "${PR_BASE_SHA:-}" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "${PUSH_BEFORE_SHA:-}" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_sha="$(git rev-parse HEAD^)"
          else
            echo "No parent commit is available; skipping changed-file formatting validation."
            exit 0
          fi

          mapfile -t dart_files < <(
            git diff --diff-filter=ACMR --name-only "$base_sha" "$GITHUB_SHA" -- '*.dart'
          )

          if (( ${#dart_files[@]} == 0 )); then
            echo "No changed Dart files to validate."
            exit 0
          fi

          printf 'Validating Dart formatting for %d changed file(s):\n' "${#dart_files[@]}"
          printf ' - %s\n' "${dart_files[@]}"
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"

      - name: Verify whitespace integrity
        run: git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test AST-007 cargo visual pack
        run: >-
          flutter test
          test/core/assets/game_asset_intake_plan_test.dart
          test/features/game/cargo_visual_catalog_test.dart
          test/features/game/cargo_visual_asset_test.dart

      - name: Test AST-004 asset cache policy
        run: flutter test test/core/assets/game_asset_cache_policy_test.dart

      - name: Test PERF-001 frame performance budget
        run: >-
          flutter test
          test/core/performance/frame_performance_budget_test.dart
          test/core/performance/frame_performance_scope_test.dart
          test/core/motion/game_motion_test.dart

      - name: Test PERF-002 memory and image budget
        run: >-
          flutter test
          test/core/assets/game_image_memory_policy_test.dart
          test/core/assets/game_asset_view_memory_test.dart
          test/core/assets/game_asset_cache_policy_test.dart

      - name: Test TEST-011 privacy consent and security matrix
        run: >-
          flutter test
          test/core/ads/ad_consent_controller_test.dart
          test/core/ads/ad_request_gate_test.dart
          test/features/settings/settings_privacy_consent_test.dart
          test/core/privacy/local_data_controller_test.dart
          test/features/settings/settings_local_data_test.dart
          test/core/analytics/privacy_gated_analytics_test.dart
          test/core/diagnostics/privacy_gated_crash_reporting_test.dart
          test/core/logging/app_logger_gate_test.dart
          test/core/security/secret_redactor_test.dart

      - name: Test UI3D-007 adaptive visual effects
        run: >-
          flutter test
          test/core/settings/game_visual_effects_preference_test.dart
          test/core/settings/visual_effects_preference_scope_test.dart
          test/core/settings/app_settings_store_test.dart
          test/core/motion/game_motion_test.dart
          test/core/motion/ui3d_007_visual_effects_test.dart
          test/core/motion/game_route_test.dart
          test/features/settings/visual_effects_settings_test.dart

      - name: Test A11Y-003 reduced motion matrix
        run: >-
          flutter test
          test/core/motion/a11y_003_motion_policy_test.dart
          test/core/motion/game_cinematic_gate_test.dart
          test/core/motion/game_motion_test.dart
          test/core/motion/game_route_test.dart
          test/core/motion/game_travel_motion_test.dart
          test/core/motion/game_action_feedback_test.dart
          test/core/motion/motion_lifecycle_scope_test.dart
          test/core/widgets/game_button_test.dart
          test/features/home/home_ambient_background_test.dart
          test/features/settings/visual_effects_settings_test.dart

      - name: Test core screen widget matrix
        run: >-
          flutter test
          test/features/home/home_environment_responsive_test.dart
          test/features/levels/level_select_responsive_test.dart
          test/features/levels/city_briefing_responsive_test.dart
          test/features/game/game_screen_responsive_test.dart
          test/features/game/game_result_responsive_test.dart
          test/features/shop/shop_responsive_test.dart

      - name: Test TEST-007 critical path
        run: flutter test test/integration/test_007_critical_path_test.dart

      - name: Test analytics schema and privacy gate
        run: >-
          flutter test
          test/core/domain/analytics_event_test.dart
          test/core/analytics/privacy_gated_analytics_test.dart
          test/core/config/analytics_build_config_test.dart
          test/bootstrap/analytics_composition_test.dart

      - name: Test crash reporting and diagnostics gates
        run: >-
          flutter test
          test/core/diagnostics/privacy_gated_crash_reporting_test.dart
          test/core/config/remote_diagnostics_build_config_test.dart
          test/core/logging/app_logger_gate_test.dart

      - name: Test local data controller
        run: flutter test test/core/privacy/local_data_controller_test.dart

      - name: Test Settings local data controls
        run: flutter test test/features/settings/settings_local_data_test.dart

      - name: Test optional-service isolation
        run: flutter test test/core/services/optional_service_coordinator_test.dart

      - name: Test animated GameButton
        run: flutter test test/core/widgets/game_button_test.dart

      - name: Run full test suite
        run: flutter test --coverage

      - name: Verify TEST-008 coverage threshold
        run: python3 tool/verify_test_quality.py --coverage coverage/lcov.info

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Verify debug APK artifact security
        run: python3 tool/verify_build_artifact_security.py build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cargame-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
