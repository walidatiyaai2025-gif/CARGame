name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Verify dynamic Android targets
        run: dart run tool/verify_dynamic_android_targets.dart

      - name: Verify secret hygiene
        run: dart run tool/verify_secret_hygiene.dart

      - name: Verify privacy data inventory
        run: python3 tool/verify_privacy_inventory.py

      - name: Verify security baseline
        run: python3 tool/verify_security_baseline.py

      - name: Restore packages
        run: flutter pub get

      - name: Validate 3D asset registry and provenance
        run: dart run tool/validate_asset_pipeline.dart

      - name: Generate localization
        run: flutter gen-l10n

      - name: Verify changed Dart formatting
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" && -n "${PR_BASE_SHA:-}" ]]; then
            base_sha="$PR_BASE_SHA"
          elif [[ "$EVENT_NAME" == "push" && -n "${PUSH_BEFORE_SHA:-}" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base_sha="$(git rev-parse HEAD^)"
          else
            echo "No parent commit is available; skipping changed-file formatting validation."
            exit 0
          fi

          mapfile -t dart_files < <(
            git diff --diff-filter=ACMR --name-only "$base_sha" "$GITHUB_SHA" -- '*.dart'
          )

          if (( ${#dart_files[@]} == 0 )); then
            echo "No changed Dart files to validate."
            exit 0
          fi

          printf 'Validating Dart formatting for %d changed file(s):\n' "${#dart_files[@]}"
          printf ' - %s\n' "${dart_files[@]}"
          dart format "${dart_files[@]}"
          git diff -- test/features/shop/shop_game_panel_test.dart
          exit 1

      - name: Verify whitespace integrity
        run: git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test optional-service isolation
        run: flutter test test/core/services/optional_service_coordinator_test.dart

      - name: Test animated GameButton
        run: flutter test test/core/widgets/game_button_test.dart

      - name: Run full test suite
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cargame-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
