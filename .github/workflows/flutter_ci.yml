name: Flutter CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/world-009-real-capital-map
          fetch-depth: 0
      - name: Restore canonical CI and clean temporary helper
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .github/workflows/flutter_ci.yml
          rm -f .github/workflows/world009_header_repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: restore canonical Flutter CI after WORLD-009 repair'
          git push origin HEAD:agent/world-009-real-capital-map
