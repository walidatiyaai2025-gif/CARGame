name: A11Y-003 Reconcile

on:
  push:
    branches:
      - agent/a11y-003-post-merge-reconcile

permissions:
  contents: write

concurrency:
  group: a11y-003-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/a11y-003-post-merge-reconcile
          fetch-depth: 0

      - name: Apply reconciliation
        run: python3 tool/reconcile_a11y_003.py

      - name: Validate tracking and contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/verify_a11y_003_reduced_motion.py
          python3 tool/test_a11y_003_reduced_motion.py
          python3 tool/verify_ui3d_007_visual_effects.py
          python3 tool/test_ui3d_007_visual_effects.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          python3 tool/verify_test_quality.py
          python3 tool/test_test_quality.py
          python3 tool/verify_privacy_inventory.py
          git diff --check

      - name: Commit reconciled tracking
        shell: bash
        run: |
          set -euo pipefail
          rm tool/reconcile_a11y_003.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/A11Y-003.md tool/reconcile_a11y_003.py
          git diff --cached --check
          git commit -m "A11Y-003: reconcile 100 checkpoint completion"
          git push origin HEAD:agent/a11y-003-post-merge-reconcile
