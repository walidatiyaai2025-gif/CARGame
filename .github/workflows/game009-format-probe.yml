name: GAME-009 Format Probe

on:
  push:
    branches:
      - agent/game-009-pause-lifecycle

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Show formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/game/game_screen.dart test/features/game/game_screen_pause_test.dart
          git diff -- lib/features/game/game_screen.dart test/features/game/game_screen_pause_test.dart
