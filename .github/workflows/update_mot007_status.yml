name: Update MOT-007 status

on:
  push:
    branches: [main]
    paths:
      - scripts/update_mot007_status.py
      - .github/workflows/update_mot007_status.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_mot007_status.py
      - name: Validate catalog shape
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/FEATURE_CATALOG.md').read_text(encoding='utf-8')
          assert all(f'# {letter}.' in text for letter in 'ABCDEFGHIJKLMNOPQRS')
          assert '| MOT-007 | Correct/wrong/combo feedback | P0 | IN PROGRESS |' in text
          ids = []
          for line in text.splitlines():
              if line.startswith('| ') and not line.startswith('| ID ') and not line.startswith('|---'):
                  parts = [part.strip() for part in line.strip('|').split('|')]
                  if len(parts) == 6:
                      ids.append(parts[0])
          assert len(ids) == len(set(ids))
          PY
      - name: Commit status
        run: |
          rm scripts/update_mot007_status.py
          rm .github/workflows/update_mot007_status.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: mark MOT-007 feedback checkpoint in progress"
          git push
