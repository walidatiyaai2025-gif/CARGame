name: RT3D-003 Port

on:
  push:
    branches:
      - agent/rt3d-003-cinematic-polish-refresh

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout refreshed branch
        uses: actions/checkout@v4
        with:
          ref: agent/rt3d-003-cinematic-polish-refresh
          fetch-depth: 0
      - name: Port cinematic generator and regenerate GLB
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/rt3d-003-cinematic-polish-01
          git show origin/agent/rt3d-003-cinematic-polish-01:tool/generate_rt3d_native_slice_glb.py > tool/generate_rt3d_native_slice_glb.py
          python3 tool/generate_rt3d_native_slice_glb.py
          rm .github/workflows/rt3d003_port.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RT3D-003 port cinematic GLB dressing onto current main'
          git push origin HEAD:agent/rt3d-003-cinematic-polish-refresh
