name: RT3D-002 Production 3D Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rt3d-002-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/rt3d-003-cinematic-polish-refresh
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Canonical format and restore focused CI
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/realtime_3d/native_filament_realtime_3d_scene.dart \
            lib/features/realtime_3d/realtime_3d_preview_screen.dart \
            test/features/native_filament_realtime_3d_scene_test.dart
          git checkout HEAD^ -- .github/workflows/rt3d_002_contract.yml
          rm -f .github/workflows/rt3d003_format_once.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RT3D-003 apply canonical Dart formatting'
          git push origin HEAD:agent/rt3d-003-cinematic-polish-refresh
