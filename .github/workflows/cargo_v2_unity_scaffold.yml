name: CARGO V2 Unity Scaffold

on:
  pull_request:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - 'BUILD_CARGO_V2_UNITY.ps1'
      - 'BUILD_CARGO_V2_UNITY.bat'
      - 'SMOKE_CARGO_V2_ANDROID.ps1'
      - 'docs/CARGO_V2_BUILD_EVIDENCE.md'
      - 'tool/verify_cargo_v2_unity_scaffold.py'
      - 'tool/verify_cargo_v2_company_transactions.py'
      - 'tool/verify_cargo_v2_android_smoke.py'
      - '.github/workflows/cargo_v2_unity_scaffold.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify CARGO V2 Unity scaffold
        run: python3 tool/verify_cargo_v2_unity_scaffold.py
      - name: Verify company transaction crash recovery
        run: python3 tool/verify_cargo_v2_company_transactions.py
      - name: Verify Android install launch smoke source contract
        run: python3 tool/verify_cargo_v2_android_smoke.py
      - name: Parse Windows Unity closure script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path './BUILD_CARGO_V2_UNITY.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "CARGO V2 Windows Unity launcher syntax PASS."
      - name: Parse Android smoke script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = (Resolve-Path './SMOKE_CARGO_V2_ANDROID.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "CARGO V2 Android smoke harness syntax PASS."
      - name: Exercise APK artifact verifier contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function New-CargoV2ApkFixture {
            param(
              [Parameter(Mandatory = $true)][string]$Root,
              [Parameter(Mandatory = $true)][string]$Destination,
              [switch]$IncludeWrongArchitecture
            )

            Remove-Item -LiteralPath $Root -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $Destination -Force -ErrorAction SilentlyContinue
            $zipPath = "$Destination.zip"
            Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue

            $relativeFiles = @(
              'AndroidManifest.xml',
              'classes.dex',
              'assets/bin/Data/globalgamemanagers',
              'lib/arm64-v8a/libmain.so',
              'lib/arm64-v8a/libunity.so',
              'lib/arm64-v8a/libil2cpp.so'
            )
            if ($IncludeWrongArchitecture) {
              $relativeFiles += 'lib/x86_64/libunity.so'
            }

            foreach ($relativeFile in $relativeFiles) {
              $target = Join-Path $Root $relativeFile
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
              Set-Content -LiteralPath $target -Value "CARGO V2 verifier fixture: $relativeFile" -Encoding ASCII
            }

            Compress-Archive -Path (Join-Path $Root '*') -DestinationPath $zipPath -Force
            Move-Item -LiteralPath $zipPath -Destination $Destination
          }

          $validRoot = Join-Path $env:RUNNER_TEMP 'cargo-v2-valid-apk'
          $validApk = Join-Path $env:RUNNER_TEMP 'cargo-v2-valid.apk'
          $validEvidence = Join-Path $env:RUNNER_TEMP 'cargo-v2-valid-evidence.json'
          New-CargoV2ApkFixture -Root $validRoot -Destination $validApk

          & pwsh -NoProfile -File ./BUILD_CARGO_V2_UNITY.ps1 -VerifyApkOnly -OutputApk $validApk -EvidenceJson $validEvidence
          if ($LASTEXITCODE -ne 0) {
            throw "Positive APK verifier fixture unexpectedly failed with exit code $LASTEXITCODE."
          }

          $record = Get-Content -LiteralPath $validEvidence -Raw | ConvertFrom-Json
          if ($record.verificationMode -ne 'apk-archive-contract') {
            throw "APK verifier evidence mode mismatch."
          }
          if ($record.sha256 -notmatch '^[0-9a-f]{64}$') {
            throw "APK verifier did not emit a lowercase SHA-256 digest."
          }
          $architectures = @($record.nativeArchitectures)
          if ($architectures.Count -ne 1 -or $architectures[0] -ne 'arm64-v8a') {
            throw "APK verifier evidence did not preserve the ARM64-only contract."
          }
          if ($record.runtimeInstallExecuted -ne $false -or $record.runtimeLaunchExecuted -ne $false) {
            throw "Archive verification must never fabricate runtime install/launch evidence."
          }

          $invalidRoot = Join-Path $env:RUNNER_TEMP 'cargo-v2-invalid-apk'
          $invalidApk = Join-Path $env:RUNNER_TEMP 'cargo-v2-invalid.apk'
          $invalidEvidence = Join-Path $env:RUNNER_TEMP 'cargo-v2-invalid-evidence.json'
          New-CargoV2ApkFixture -Root $invalidRoot -Destination $invalidApk -IncludeWrongArchitecture

          & pwsh -NoProfile -File ./BUILD_CARGO_V2_UNITY.ps1 -VerifyApkOnly -OutputApk $invalidApk -EvidenceJson $invalidEvidence 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Negative APK verifier fixture with x86_64 unexpectedly passed."
          }

          $global:LASTEXITCODE = 0
          Write-Host "CARGO V2 APK artifact verifier positive/negative contract PASS (synthetic archives only; no Unity/runtime claim)."
      - name: Exercise Android smoke orchestration with fake ADB
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function New-CargoV2ApkFixture {
            param(
              [Parameter(Mandatory = $true)][string]$Root,
              [Parameter(Mandatory = $true)][string]$Destination
            )
            Remove-Item -LiteralPath $Root -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $Destination -Force -ErrorAction SilentlyContinue
            $zipPath = "$Destination.zip"
            Remove-Item -LiteralPath $zipPath -Force -ErrorAction SilentlyContinue
            foreach ($relativeFile in @(
              'AndroidManifest.xml',
              'classes.dex',
              'assets/bin/Data/globalgamemanagers',
              'lib/arm64-v8a/libmain.so',
              'lib/arm64-v8a/libunity.so',
              'lib/arm64-v8a/libil2cpp.so'
            )) {
              $target = Join-Path $Root $relativeFile
              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
              Set-Content -LiteralPath $target -Value "CARGO V2 smoke fixture: $relativeFile" -Encoding ASCII
            }
            Compress-Archive -Path (Join-Path $Root '*') -DestinationPath $zipPath -Force
            Move-Item -LiteralPath $zipPath -Destination $Destination
          }

          $fakeAdb = Join-Path $env:RUNNER_TEMP 'fake-cargo-v2-adb'
          @'
          #!/usr/bin/env bash
          set -u
          if [[ $# -ge 1 && "$1" == "devices" ]]; then
            echo 'List of devices attached'
            if [[ "${CARGO_V2_FAKE_ADB_SCENARIO:-}" == "multi" ]]; then
              echo 'FAKE001 device product:qa model:Cargo_QA_One device:qa transport_id:1'
              echo 'FAKE002 device product:qa model:Cargo_QA_Two device:qa transport_id:2'
            else
              echo 'FAKE001 device product:qa model:Cargo_QA_One device:qa transport_id:1'
            fi
            exit 0
          fi
          if [[ $# -lt 3 || "$1" != "-s" ]]; then exit 2; fi
          command="$3"
          if [[ "$command" == "install" ]]; then echo 'Success'; exit 0; fi
          if [[ "$command" == "logcat" ]]; then
            if [[ " $* " == *" -d "* ]]; then echo 'I/Unity ( 4242): com.walka.cargov2 launch healthy'; fi
            exit 0
          fi
          if [[ "$command" != "shell" || $# -lt 4 ]]; then exit 3; fi
          shell_command="$4"
          if [[ "$shell_command" == "getprop" ]]; then
            case "${5:-}" in
              ro.product.manufacturer) echo 'OpenAI-QA' ;;
              ro.product.model) echo 'Cargo-Fake-Device' ;;
              ro.build.version.sdk) echo '35' ;;
              ro.product.cpu.abi) echo 'arm64-v8a' ;;
            esac
            exit 0
          fi
          if [[ "$shell_command" == "pm" ]]; then echo 'package:/data/app/com.walka.cargov2/base.apk'; exit 0; fi
          if [[ "$shell_command" == "am" ]]; then exit 0; fi
          if [[ "$shell_command" == "monkey" ]]; then echo 'Events injected: 1'; exit 0; fi
          if [[ "$shell_command" == "pidof" ]]; then echo '4242'; exit 0; fi
          if [[ "$shell_command" == "dumpsys" ]]; then
            echo 'mResumedActivity: ActivityRecord{qa u0 com.walka.cargov2/com.unity3d.player.UnityPlayerActivity t1}'
            exit 0
          fi
          exit 4
          '@ | Set-Content -LiteralPath $fakeAdb -Encoding UTF8
          & chmod +x $fakeAdb
          if ($LASTEXITCODE -ne 0) { throw 'Failed to make fake ADB fixture executable.' }

          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'cargo-v2-smoke-apk'
          $fixtureApk = Join-Path $env:RUNNER_TEMP 'cargo-v2-smoke.apk'
          New-CargoV2ApkFixture -Root $fixtureRoot -Destination $fixtureApk

          $positiveEvidence = Join-Path $env:RUNNER_TEMP 'cargo-v2-smoke-positive.json'
          Remove-Item Env:CARGO_V2_FAKE_ADB_SCENARIO -ErrorAction SilentlyContinue
          & pwsh -NoProfile -File ./SMOKE_CARGO_V2_ANDROID.ps1 -ApkPath $fixtureApk -AdbPath $fakeAdb -LaunchWaitSeconds 0 -EvidenceJson $positiveEvidence
          if ($LASTEXITCODE -ne 0) {
            throw "Positive fake-ADB smoke unexpectedly failed with exit code $LASTEXITCODE."
          }
          $positive = Get-Content -LiteralPath $positiveEvidence -Raw | ConvertFrom-Json
          if (-not $positive.archiveContractPassed -or -not $positive.installExecuted -or -not $positive.installPassed -or -not $positive.launchExecuted -or -not $positive.launchPassed -or -not $positive.processObserved -or -not $positive.foregroundObserved -or -not $positive.smokePassed) {
            throw "Positive fake-ADB evidence did not record the expected install/launch truth fields."
          }
          if ($positive.deviceSerial -ne 'FAKE001' -or $positive.abi -ne 'arm64-v8a') {
            throw "Positive fake-ADB evidence did not preserve dynamic device metadata."
          }
          if ($positive.limitation -notmatch 'does not prove gameplay') {
            throw "Android smoke evidence lost its truth-boundary limitation."
          }

          $env:CARGO_V2_FAKE_ADB_SCENARIO = 'multi'
          $negativeEvidence = Join-Path $env:RUNNER_TEMP 'cargo-v2-smoke-multiple-devices.json'
          & pwsh -NoProfile -File ./SMOKE_CARGO_V2_ANDROID.ps1 -ApkPath $fixtureApk -AdbPath $fakeAdb -LaunchWaitSeconds 0 -EvidenceJson $negativeEvidence 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Multiple-device fake ADB scenario unexpectedly passed without explicit -Serial."
          }
          $negative = Get-Content -LiteralPath $negativeEvidence -Raw | ConvertFrom-Json
          if ($negative.smokePassed -ne $false -or $negative.installExecuted -ne $false -or $negative.error -notmatch 'Multiple authorized Android devices') {
            throw "Multiple-device failure did not fail closed before installation."
          }

          $global:LASTEXITCODE = 0
          Write-Host "CARGO V2 Android smoke orchestration positive/negative contract PASS (fake ADB only; no device/runtime claim)."
