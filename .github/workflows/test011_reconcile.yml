name: TEST-011 Reconcile

on:
  push:
    branches:
      - agent/test-011-post-merge-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/test-011-post-merge-reconcile
          fetch-depth: 0

      - name: Apply final TEST-011 evidence
        run: python3 tool/reconcile_test011.py

      - name: Preserve one authoritative external-evidence marker
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/TEST_011_PRIVACY_SECURITY.md')
          text = path.read_text(encoding='utf-8')
          old = '- Repository status is IMPLEMENTED. `External UMP regulated-device verification: PENDING` remains authoritative, so TEST-011 MUST NOT be marked VERIFIED from CI-only evidence.'
          new = '- Repository status is IMPLEMENTED. The external UMP regulated-device verification remains PENDING, so TEST-011 MUST NOT be marked VERIFIED from CI-only evidence.'
          if text.count(old) != 1:
              raise SystemExit(f'expected one completion marker, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate final tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/verify_test_011_privacy_security.py
          python3 tool/test_test_011_privacy_security.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          python3 tool/verify_test_quality.py
          python3 tool/test_test_quality.py
          git diff --check

      - name: Commit docs reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm tool/reconcile_test011.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/TEST-011.md docs/TEST_011_PRIVACY_SECURITY.md tool/reconcile_test011.py
          git diff --cached --check
          git commit -m "TEST-011: reconcile 100 checkpoint completion"
          git push origin HEAD:agent/test-011-post-merge-reconcile
