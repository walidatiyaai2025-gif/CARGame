name: AST-007 intake reconcile once

on:
  push:
    branches:
      - agent/ast-007-intake-reconcile
    paths:
      - .github/workflows/ast_007_intake_reconcile_once.yml

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/ast-007-intake-reconcile
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Apply tracking reconciliation
        run: python3 tool/reconcile_ast_007_intake_once.py

      - name: Verify AST-007 contract
        run: python3 tool/verify_ast_007_cargo_visuals.py

      - name: Test AST-007 validator regressions
        run: python3 tool/test_ast_007_cargo_visuals.py

      - name: Verify CI integrity
        run: python3 tool/verify_ci_integrity.py

      - name: Validate asset admission
        run: dart run tool/validate_asset_pipeline.dart

      - name: Verify whitespace
        run: git diff --check

      - name: Remove one-shot tooling
        run: |
          rm tool/reconcile_ast_007_intake_once.py
          rm .github/workflows/ast_007_intake_reconcile_once.yml

      - name: Commit reconciled tracking docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/AST-007.md
          git add -u tool/reconcile_ast_007_intake_once.py .github/workflows/ast_007_intake_reconcile_once.yml
          git commit -m "AST-007: reconcile production intake checkpoint"
          git push origin HEAD:agent/ast-007-intake-reconcile
