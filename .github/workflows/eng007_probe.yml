name: ENG-007 CI Integrity Probe

on:
  push:
    branches:
      - agent/eng-007-ci-verification
    paths:
      - '.github/workflows/eng007_probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eng-007-ci-verification
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Verify focused ENG-007 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/eng007_probe.yml
          git commit -m 'ci: remove ENG-007 focused probe'
          git push origin HEAD:agent/eng-007-ci-verification
