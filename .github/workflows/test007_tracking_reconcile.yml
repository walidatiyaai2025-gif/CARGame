name: TEST-007 Tracking Reconciliation

on:
  push:
    branches:
      - agent/test-007-critical-path-50

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-007-critical-path-50
      - name: Reconcile verified tracking
        run: python3 tool/reconcile_test007_tracking.py
      - name: Remove one-shot helpers and commit tracking
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/test007_tracking_reconcile.yml
          rm tool/reconcile_test007_tracking.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/TEST-003.md .github/workflows/test007_tracking_reconcile.yml tool/reconcile_test007_tracking.py
          git diff --cached --check
          git commit -m "TEST-007: reconcile verified project tracking"
          git push origin HEAD:agent/test-007-critical-path-50