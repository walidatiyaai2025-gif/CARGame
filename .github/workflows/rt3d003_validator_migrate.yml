name: RT3D-003 Validator Migration

on:
  push:
    branches:
      - agent/rt3d-003-cinematic-polish-refresh

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rt3d-003-cinematic-polish-refresh
          fetch-depth: 0
      - name: Migrate validator and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/generate_rt3d_native_slice_glb.py
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import hashlib
          import struct

          root = Path('.')
          validator_path = root / 'tool/verify_rt3d_native_slice.py'
          text = validator_path.read_text()
          old_hash = '5de93589908d375446567cd84aa84dcba496a705538cec37c098f82440b480b2'
          new_hash = 'b727b594612452a9a3723aa64423ee5d18a9b90567aba191d9a035bf888de157'
          text = text.replace(old_hash, new_hash)

          required_nodes = '''REQUIRED_NODES = {
              'cargo.demo.electronics',
              'cargo.demo.food',
              'delivery.electronics',
              'delivery.food',
              'delivery.electronics.rim.north',
              'delivery.food.rim.south',
              'environment.lamp.0.head',
              'environment.loading.safety.0',
              'environment.pallet.0',
              'environment.signal.0.red',
              'environment.signal.0.green',
              'environment.skyline.0',
              'environment.tree.0.crown',
              'environment.warehouse',
              'environment.warehouse.door',
              'environment.warehouse.sign.panel',
              'ground.main',
              'road.arrow.main.shaft',
              'road.cross',
              'road.main',
              'road.stop.north',
              'vehicle.player',
              'vehicle.player.beacon.light',
              'vehicle.player.bumper.front',
              'vehicle.player.bumper.rear',
              'vehicle.player.headlight.left',
              'vehicle.player.headlight.right',
              'vehicle.player.mirror.left',
              'vehicle.player.mirror.right',
              'vehicle.player.rearlight.left',
              'vehicle.player.rearlight.right',
              'vehicle.player.windshield',
          }'''
          text, count = re.subn(
              r'REQUIRED_NODES = \{.*?\n\}\n\n\ndef require',
              required_nodes + '\n\n\ndef require',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('failed to replace REQUIRED_NODES')

          scene_contract = '''require(len(nodes) >= 110, 'RT3D-003 cinematic yard must retain at least 110 visible scene nodes')
              require(
                  len([name for name in node_names if isinstance(name, str) and name.startswith('cargo.')]) >= 6,
                  'cinematic yard must contain at least six visible cargo nodes',
              )
              require(
                  len([name for name in node_names if isinstance(name, str) and name.startswith('road.stripe.')]) >= 11,
                  'cinematic yard must contain readable main/cross road striping',
              )
              require(
                  len([name for name in node_names if isinstance(name, str) and name.startswith('road.arrow.')]) >= 6,
                  'cinematic yard must retain directional road arrows',
              )
              require(
                  len([name for name in node_names if isinstance(name, str) and name.startswith('vehicle.player.wheel.')]) == 4,
                  'cinematic vehicle must contain four visible wheel nodes',
              )
              require(
                  len([name for name in node_names if isinstance(name, str) and name.startswith('environment.pallet.') and not name.endswith('.crate')]) >= 6,
                  'cinematic yard must retain parked pallet dressing',
              )
              require(
                  len([name for name in node_names if isinstance(name, str) and name.startswith('environment.skyline.')]) >= 5,
                  'cinematic yard must retain skyline depth dressing',
              )
              require(
                  len([name for name in node_names if isinstance(name, str) and name.startswith('environment.signal.')]) >= 10,
                  'cinematic yard must retain two complete traffic signals',
              )
              require(
                  len([name for name in node_names if isinstance(name, str) and '.rim.' in name and name.startswith('delivery.')]) == 8,
                  'delivery targets must retain eight visible dock-rim nodes',
              )

              meshes ='''
          text, count = re.subn(
              r"require\(len\(nodes\) >= 120,.*?\n\n    meshes =",
              scene_contract,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('failed to replace stale RT3D-002 scene-count contract')

          text = text.replace(
              "provenance.get('generator') == 'CARGame RT3D-002 native slice visual expansion v3'",
              "provenance.get('generator') == 'CARGame RT3D-003 cinematic native slice v3'",
          )
          text = text.replace(
              "require('visual expansion v3' in generator, 'generator must identify the visible expansion revision')\n    require('RT3D2-T081..T110' in generator, 'generator must identify the 30-task visual checkpoint')",
              "require('RT3D-003 cinematic native slice v3' in generator, 'generator must identify the cinematic revision')\n    require('emissiveFactor' in generator, 'generator must author emissive material metadata')",
          )
          text = text.replace(
              "print('RT3D NATIVE VISUAL EXPANSION VALIDATION PASSED')",
              "print('RT3D-003 CINEMATIC NATIVE YARD VALIDATION PASSED')",
          )

          material_anchor = """    for material in materials:\n        require(\n            isinstance(material, dict) and 'pbrMetallicRoughness' in material,\n            'every native-slice material must use glTF PBR metallic-roughness',\n        )\n"""
          emissive_block = material_anchor + """\n    material_by_name = {\n        material.get('name'): material\n        for material in materials\n        if isinstance(material, dict)\n    }\n    for name in ('lamp', 'headlight', 'rearLight', 'beacon', 'sign', 'signalRed', 'signalAmber', 'signalGreen'):\n        require(name in material_by_name, f'missing cinematic material: {name}')\n        emissive = material_by_name[name].get('emissiveFactor')\n        require(\n            isinstance(emissive, list) and len(emissive) == 3 and any(float(value) > 0 for value in emissive),\n            f'cinematic emissive material missing emissiveFactor: {name}',\n        )\n"""
          if material_anchor not in text:
              raise SystemExit('material validation anchor not found')
          text = text.replace(material_anchor, emissive_block, 1)
          validator_path.write_text(text)

          glb_path = root / 'assets/3d/runtime/models/cargame_native_slice_v1.glb'
          data = glb_path.read_bytes()
          digest = hashlib.sha256(data).hexdigest()
          if digest != new_hash:
              raise SystemExit(f'unexpected generated hash {digest}')
          json_len, json_type = struct.unpack_from('<I4s', data, 12)
          if json_type != b'JSON':
              raise SystemExit('invalid GLB JSON chunk')
          document = json.loads(data[20:20 + json_len].decode('utf-8').rstrip(' '))
          names = {node.get('name') for node in document.get('nodes', []) if isinstance(node, dict)}

          provenance_path = root / 'assets/3d/provenance/cargame_native_slice_v1.json'
          provenance = json.loads(provenance_path.read_text())
          provenance['generator'] = 'CARGame RT3D-003 cinematic native slice v3'
          provenance['sha256'] = digest
          provenance['byteLength'] = len(data)
          provenance['requiredNodes'] = sorted({
              'cargo.demo.electronics', 'cargo.demo.food', 'delivery.electronics', 'delivery.food',
              'delivery.electronics.rim.north', 'delivery.food.rim.south', 'environment.lamp.0.head',
              'environment.loading.safety.0', 'environment.pallet.0', 'environment.signal.0.red',
              'environment.signal.0.green', 'environment.skyline.0', 'environment.tree.0.crown',
              'environment.warehouse', 'environment.warehouse.door', 'environment.warehouse.sign.panel',
              'ground.main', 'road.arrow.main.shaft', 'road.cross', 'road.main', 'road.stop.north',
              'vehicle.player', 'vehicle.player.beacon.light', 'vehicle.player.bumper.front',
              'vehicle.player.bumper.rear', 'vehicle.player.headlight.left', 'vehicle.player.headlight.right',
              'vehicle.player.mirror.left', 'vehicle.player.mirror.right', 'vehicle.player.rearlight.left',
              'vehicle.player.rearlight.right', 'vehicle.player.windshield',
          })
          missing = set(provenance['requiredNodes']) - names
          if missing:
              raise SystemExit(f'new required nodes missing from GLB: {sorted(missing)}')
          provenance['notes'] = (
              'RT3D-003 cinematic Native Filament yard checkpoint with emissive vehicle/yard lighting, '
              'warehouse signage, safety barriers, road arrows, traffic signals, pallet dressing, skyline depth '
              'and delivery-rim geometry while preserving stable cargo/delivery interaction identities.'
          )
          provenance_path.write_text(json.dumps(provenance, indent=2, ensure_ascii=False) + '\n')
          PY
          python3 tool/verify_rt3d_native_slice.py
          python3 tool/test_rt3d_native_slice.py
          rm .github/workflows/rt3d003_validator_migrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RT3D-003 migrate native GLB contract and provenance'
          git push origin HEAD:agent/rt3d-003-cinematic-polish-refresh
