name: A11Y-003 Reconcile Once

on:
  push:
    branches:
      - agent/a11y-003-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/a11y-003-reconcile

      - name: Apply reconciliation
        run: python3 tool/reconcile_a11y_003_once.py

      - name: Verify A11Y contract
        run: python3 tool/verify_a11y_003_reduced_motion.py

      - name: Verify dashboard/catalog parity
        run: python3 tool/verify_dashboard_catalog.py

      - name: Verify CI integrity
        run: python3 tool/verify_ci_integrity.py

      - name: Verify whitespace
        run: git diff --check

      - name: Remove one-shot tooling
        run: |
          rm .github/workflows/a11y_003_reconcile_once.yml
          rm tool/reconcile_a11y_003_once.py

      - name: Commit reconciled evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/A11Y-003.md .github/workflows/a11y_003_reconcile_once.yml tool/reconcile_a11y_003_once.py
          if git diff --cached --quiet; then
            echo "No reconciliation changes to commit"
            exit 0
          fi
          git commit -m "A11Y-003: reconcile final merged evidence"
          git push origin HEAD:agent/a11y-003-reconcile
