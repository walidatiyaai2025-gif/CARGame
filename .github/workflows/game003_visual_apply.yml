name: GAME-003 Visual Apply

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/game/game_screen.dart'
      - 'test/features/game/gameplay_operations_deck_visual_test.dart'
      - '.github/workflows/game003_visual_apply.yml'

permissions:
  contents: write

jobs:
  apply-visual-refresh:
    if: github.event.pull_request.number == 149
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Apply premium gameplay operations deck
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/game/game_screen.dart')
          text = path.read_text()

          if "../../core/motion/ambient_motion_background.dart" not in text:
              text = text.replace(
                  "import '../../core/economy/economy_config.dart';\n",
                  "import '../../core/economy/economy_config.dart';\nimport '../../core/motion/ambient_motion_background.dart';\n",
                  1,
              )
          if "../../core/theme/three_d_game_icon.dart" not in text:
              text = text.replace(
                  "import '../../core/theme/game_skin.dart';\n",
                  "import '../../core/theme/game_skin.dart';\nimport '../../core/theme/three_d_game_icon.dart';\n",
                  1,
              )

          state_start = text.index('class _GameScreenState')
          build_start = text.index('  @override\n  Widget build(BuildContext context) {', state_start)
          result_marker = text.index('class _ResultChip', build_start)

          new_build = r'''  @override
          Widget build(BuildContext context) {
            final skin = gameSkinById(widget.store.selectedTheme);
            final world = gameWorlds[widget.level.world - 1];
            final ar = Localizations.localeOf(context).languageCode == 'ar';
            final flight = _flight;
            final canGoBack = Navigator.of(context).canPop();

            return PopScope(
              canPop: !_resultVisible && !_resolving,
              child: Scaffold(
                backgroundColor: const Color(0xFFF4F7FB),
                body: Stack(
                  key: _motionLayerKey,
                  children: [
                    Positioned.fill(
                      child: AmbientMotionBackground(
                        startColor: world.startColor,
                        endColor: world.endColor,
                      ),
                    ),
                    Positioned.fill(
                      child: IgnorePointer(
                        child: DecoratedBox(
                          decoration: BoxDecoration(
                            gradient: LinearGradient(
                              begin: Alignment.topCenter,
                              end: Alignment.bottomCenter,
                              colors: [
                                const Color(0xFF091321).withValues(alpha: .82),
                                const Color(0xFFF4F7FB).withValues(alpha: .82),
                                const Color(0xFFF4F7FB).withValues(alpha: .97),
                              ],
                              stops: const [0, .31, 1],
                            ),
                          ),
                        ),
                      ),
                    ),
                    SafeArea(
                      child: LayoutBuilder(
                        builder: (context, constraints) {
                          final compact =
                              constraints.maxHeight < 690 ||
                              constraints.maxWidth < 370;
                          final horizontal = compact ? 9.0 : 14.0;

                          return Padding(
                            padding: EdgeInsets.fromLTRB(
                              horizontal,
                              compact ? 6 : 9,
                              horizontal,
                              compact ? 8 : 12,
                            ),
                            child: Column(
                              children: [
                                _GameCommandBar(
                                  cityName: widget.level.cityName,
                                  worldName: world.name,
                                  levelNumber: widget.level.number,
                                  difficulty: widget.level.difficulty,
                                  compact: compact,
                                  isArabic: ar,
                                  onBack:
                                      !canGoBack || _resultVisible || _resolving
                                      ? null
                                      : () => Navigator.maybePop(context),
                                  onRestart:
                                      _finished || _resultVisible || _resolving
                                      ? null
                                      : () => setState(() => _reset()),
                                ),
                                SizedBox(height: compact ? 6 : 9),
                                _StatusPanel(
                                  moves: _moves,
                                  matched: _matchedCount,
                                  total: widget.level.items.length,
                                  progress: _progress,
                                  combo: _combo,
                                  hearts: widget.store.hearts,
                                  skin: skin,
                                  shieldActive: _shieldActive,
                                  compact: compact,
                                  isArabic: ar,
                                ),
                                SizedBox(height: compact ? 5 : 8),
                                _MissionBanner(
                                  isBoss: widget.level.isBossCity,
                                  isArabic: ar,
                                  selectedCargo: _selected,
                                  resolving: _resolving,
                                  accent: skin.accent,
                                  primary: skin.primary,
                                  compact: compact,
                                ),
                                SizedBox(height: compact ? 5 : 8),
                                Expanded(
                                  flex: 3,
                                  child: _CargoBoard(
                                    items: _remaining,
                                    selectedIndex: _selectedIndex,
                                    travellingIndex: _resolving
                                        ? _selectedIndex
                                        : null,
                                    onTap: _choosePackage,
                                    compact: compact,
                                    isArabic: ar,
                                    accent: skin.primary,
                                  ),
                                ),
                                SizedBox(height: compact ? 6 : 9),
                                Expanded(
                                  flex: 2,
                                  child: _WarehouseBoard(
                                    warehouses: _warehouses,
                                    activeFlight: flight,
                                    onTap: _chooseWarehouse,
                                    compact: compact,
                                    isArabic: ar,
                                    accent: skin.primary,
                                  ),
                                ),
                                SizedBox(height: compact ? 6 : 9),
                                _BoosterDock(
                                  compact: compact,
                                  children: [
                                    _BoosterButton(
                                      type: ThreeDIconType.hint,
                                      label: ar ? 'تلميح' : 'HINT',
                                      count:
                                          widget.store.freeHints + _preparedHints,
                                      active: _selected != null,
                                      accent: const Color(0xFFFFB300),
                                      compact: compact,
                                      onPressed:
                                          _selected == null ||
                                              _finished ||
                                              _resolving
                                          ? null
                                          : _useHint,
                                    ),
                                    _BoosterButton(
                                      type: ThreeDIconType.extraMoves,
                                      label: ar ? 'حركات' : 'MOVES',
                                      count: widget.store.extraMovesBoosters,
                                      accent: const Color(0xFF2D6CDF),
                                      compact: compact,
                                      onPressed: _finished || _resolving
                                          ? null
                                          : _useExtraMoves,
                                    ),
                                    _BoosterButton(
                                      type: ThreeDIconType.shield,
                                      label: ar ? 'درع' : 'SHIELD',
                                      count: widget.store.comboShields,
                                      active: _shieldActive,
                                      accent: const Color(0xFF7B3FF2),
                                      compact: compact,
                                      onPressed: _finished || _resolving
                                          ? null
                                          : _useComboShield,
                                    ),
                                  ],
                                ),
                              ],
                            ),
                          );
                        },
                      ),
                    ),
                    if (flight != null)
                      GameTravelMotion(
                        key: ValueKey(flight.id),
                        start: flight.start,
                        end: flight.end,
                        size: 58,
                        onCompleted: () => unawaited(_completeFlight(flight)),
                        child: _FlightCargo(item: flight.item),
                      ),
                    if (_feedbackKind case final feedbackKind?)
                      GameActionFeedback(
                        key: ValueKey(_feedbackSequence),
                        kind: feedbackKind,
                        combo: _feedbackCombo,
                        semanticLabel:
                            feedbackKind == GameActionFeedbackKind.correct
                            ? (ar
                                  ? 'وضع صحيح، سلسلة $_feedbackCombo'
                                  : 'Correct placement, combo $_feedbackCombo')
                            : (ar ? 'وضع غير صحيح' : 'Wrong placement'),
                        hapticsEnabled: widget.hapticsEnabled,
                        onSound: widget.soundEnabled
                            ? widget.onPlacementSound
                            : null,
                        onCompleted: () =>
                            _completeActionFeedback(_feedbackSequence),
                      ),
                  ],
                ),
              ),
            );
          }
          }

          '''
          text = text[:build_start] + new_build + text[result_marker:]

          visual_start = text.index('class _BoosterButton')
          cargo_flight_start = text.index('class _CargoFlight', visual_start)

          visual_classes = r'''class _GameCommandBar extends StatelessWidget {
            const _GameCommandBar({
              required this.cityName,
              required this.worldName,
              required this.levelNumber,
              required this.difficulty,
              required this.compact,
              required this.isArabic,
              required this.onBack,
              required this.onRestart,
            });

            final String cityName;
            final String worldName;
            final int levelNumber;
            final int difficulty;
            final bool compact;
            final bool isArabic;
            final VoidCallback? onBack;
            final VoidCallback? onRestart;

            @override
            Widget build(BuildContext context) => Container(
              padding: EdgeInsets.symmetric(
                horizontal: compact ? 7 : 10,
                vertical: compact ? 5 : 7,
              ),
              decoration: BoxDecoration(
                color: const Color(0xFF0B1423).withValues(alpha: .92),
                borderRadius: BorderRadius.circular(compact ? 20 : 24),
                border: Border.all(color: Colors.white24),
                boxShadow: const [
                  BoxShadow(
                    color: Color(0x33000000),
                    blurRadius: 18,
                    offset: Offset(0, 8),
                  ),
                ],
              ),
              child: Row(
                children: [
                  _CommandIconButton(
                    icon: Icons.arrow_back_rounded,
                    tooltip: isArabic ? 'رجوع' : 'Back',
                    onTap: onBack,
                  ),
                  SizedBox(width: compact ? 7 : 10),
                  Expanded(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Text(
                          cityName,
                          maxLines: 1,
                          overflow: TextOverflow.ellipsis,
                          style: TextStyle(
                            color: Colors.white,
                            fontSize: compact ? 14 : 17,
                            height: 1,
                            fontWeight: FontWeight.w900,
                          ),
                        ),
                        const SizedBox(height: 3),
                        Text(
                          '$worldName • ${isArabic ? 'المرحلة' : 'Level'} $levelNumber • ${isArabic ? 'صعوبة' : 'D'} $difficulty',
                          maxLines: 1,
                          overflow: TextOverflow.ellipsis,
                          style: TextStyle(
                            color: Colors.white60,
                            fontSize: compact ? 8 : 9,
                            fontWeight: FontWeight.w700,
                          ),
                        ),
                      ],
                    ),
                  ),
                  SizedBox(width: compact ? 7 : 10),
                  Container(
                    padding: EdgeInsets.symmetric(
                      horizontal: compact ? 7 : 9,
                      vertical: 5,
                    ),
                    decoration: BoxDecoration(
                      color: const Color(0xFF20C997).withValues(alpha: .15),
                      borderRadius: BorderRadius.circular(20),
                      border: Border.all(
                        color: const Color(0xFF20C997).withValues(alpha: .38),
                      ),
                    ),
                    child: Row(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        const SizedBox(
                          width: 7,
                          height: 7,
                          child: DecoratedBox(
                            decoration: BoxDecoration(
                              color: Color(0xFF20C997),
                              shape: BoxShape.circle,
                            ),
                          ),
                        ),
                        const SizedBox(width: 5),
                        Text(
                          isArabic ? 'مباشر' : 'LIVE',
                          style: TextStyle(
                            color: const Color(0xFF67E8C0),
                            fontSize: compact ? 8 : 9,
                            fontWeight: FontWeight.w900,
                            letterSpacing: .5,
                          ),
                        ),
                      ],
                    ),
                  ),
                  SizedBox(width: compact ? 5 : 7),
                  _CommandIconButton(
                    icon: Icons.restart_alt_rounded,
                    tooltip: isArabic ? 'إعادة' : 'Restart',
                    onTap: onRestart,
                  ),
                ],
              ),
            );
          }

          class _CommandIconButton extends StatelessWidget {
            const _CommandIconButton({
              required this.icon,
              required this.tooltip,
              required this.onTap,
            });

            final IconData icon;
            final String tooltip;
            final VoidCallback? onTap;

            @override
            Widget build(BuildContext context) => Tooltip(
              message: tooltip,
              child: Material(
                color: Colors.white.withValues(alpha: onTap == null ? .05 : .10),
                shape: const CircleBorder(),
                child: InkWell(
                  onTap: onTap,
                  customBorder: const CircleBorder(),
                  child: SizedBox.square(
                    dimension: 36,
                    child: Icon(
                      icon,
                      color: onTap == null ? Colors.white24 : Colors.white,
                      size: 20,
                    ),
                  ),
                ),
              ),
            );
          }

          class _MissionBanner extends StatelessWidget {
            const _MissionBanner({
              required this.isBoss,
              required this.isArabic,
              required this.selectedCargo,
              required this.resolving,
              required this.accent,
              required this.primary,
              required this.compact,
            });

            final bool isBoss;
            final bool isArabic;
            final CargoItem? selectedCargo;
            final bool resolving;
            final Color accent;
            final Color primary;
            final bool compact;

            @override
            Widget build(BuildContext context) {
              final detail = resolving
                  ? (isArabic ? 'جارٍ نقل الشحنة' : 'CARGO IN TRANSIT')
                  : selectedCargo != null
                  ? '${selectedCargo!.name} → ${selectedCargo!.category}'
                  : isBoss
                  ? (isArabic ? 'مهمة مدينة الزعيم' : 'BOSS CITY MISSION')
                  : (isArabic ? 'رتّب كل الشحنات' : 'SORT ALL CARGO');

              return Container(
                padding: EdgeInsets.symmetric(
                  horizontal: compact ? 10 : 13,
                  vertical: compact ? 6 : 8,
                ),
                decoration: BoxDecoration(
                  color: Colors.white.withValues(alpha: .90),
                  borderRadius: BorderRadius.circular(18),
                  border: Border.all(color: primary.withValues(alpha: .14)),
                ),
                child: Row(
                  children: [
                    Container(
                      padding: const EdgeInsets.symmetric(
                        horizontal: 8,
                        vertical: 4,
                      ),
                      decoration: BoxDecoration(
                        color: primary.withValues(alpha: .10),
                        borderRadius: BorderRadius.circular(20),
                      ),
                      child: Text(
                        isArabic ? 'المهمة مباشرة' : 'MISSION LIVE',
                        style: TextStyle(
                          color: primary,
                          fontSize: compact ? 8 : 9,
                          fontWeight: FontWeight.w900,
                          letterSpacing: .5,
                        ),
                      ),
                    ),
                    const SizedBox(width: 8),
                    Expanded(
                      child: Text(
                        detail,
                        maxLines: 1,
                        overflow: TextOverflow.ellipsis,
                        style: TextStyle(
                          color: isBoss ? accent : AppTheme.navy,
                          fontSize: compact ? 9 : 11,
                          fontWeight: FontWeight.w900,
                        ),
                      ),
                    ),
                  ],
                ),
              );
            }
          }

          class _BoosterDock extends StatelessWidget {
            const _BoosterDock({required this.children, required this.compact});

            final List<Widget> children;
            final bool compact;

            @override
            Widget build(BuildContext context) => Container(
              padding: EdgeInsets.all(compact ? 5 : 7),
              decoration: BoxDecoration(
                color: const Color(0xFF0B1423).withValues(alpha: .92),
                borderRadius: BorderRadius.circular(compact ? 20 : 24),
                border: Border.all(color: Colors.white24),
                boxShadow: const [
                  BoxShadow(
                    color: Color(0x26000000),
                    blurRadius: 16,
                    offset: Offset(0, 8),
                  ),
                ],
              ),
              child: Row(
                children: [
                  for (var index = 0; index < children.length; index++) ...[
                    Expanded(child: children[index]),
                    if (index != children.length - 1)
                      SizedBox(width: compact ? 5 : 7),
                  ],
                ],
              ),
            );
          }

          class _BoosterButton extends StatelessWidget {
            const _BoosterButton({
              required this.type,
              required this.label,
              required this.count,
              required this.onPressed,
              required this.accent,
              required this.compact,
              this.active = false,
            });

            final ThreeDIconType type;
            final String label;
            final int count;
            final GameButtonCallback? onPressed;
            final Color accent;
            final bool compact;
            final bool active;

            @override
            Widget build(BuildContext context) => GameButton(
              semanticLabel: '$label $count',
              onPressed: onPressed,
              enabled: onPressed != null,
              height: compact ? 48 : 56,
              expand: true,
              padding: EdgeInsets.symmetric(
                horizontal: compact ? 5 : 7,
                vertical: compact ? 4 : 6,
              ),
              borderRadius: BorderRadius.circular(compact ? 15 : 18),
              gradient: active
                  ? LinearGradient(
                      colors: [accent, Color.lerp(accent, AppTheme.navy, .28)!],
                    )
                  : null,
              backgroundColor: active ? null : Colors.white,
              foregroundColor: active ? Colors.white : AppTheme.navy,
              border: Border.all(
                color: active
                    ? Colors.white.withValues(alpha: .36)
                    : accent.withValues(alpha: .20),
              ),
              shadowColor: active
                  ? accent.withValues(alpha: .32)
                  : Colors.black12,
              child: FittedBox(
                fit: BoxFit.scaleDown,
                child: Row(
                  mainAxisSize: MainAxisSize.min,
                  children: [
                    ThreeDGameIcon(
                      type: type,
                      size: compact ? 25 : 29,
                      semanticLabel: label,
                    ),
                    SizedBox(width: compact ? 3 : 5),
                    Column(
                      mainAxisSize: MainAxisSize.min,
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text(
                          label,
                          style: TextStyle(
                            fontSize: compact ? 7 : 8,
                            height: 1,
                            fontWeight: FontWeight.w900,
                            letterSpacing: .4,
                          ),
                        ),
                        const SizedBox(height: 2),
                        Text(
                          active ? 'ON • $count' : 'x$count',
                          style: TextStyle(
                            color: active ? Colors.white70 : accent,
                            fontSize: compact ? 10 : 11,
                            height: 1,
                            fontWeight: FontWeight.w900,
                          ),
                        ),
                      ],
                    ),
                  ],
                ),
              ),
            );
          }

          class _CargoBoard extends StatelessWidget {
            const _CargoBoard({
              required this.items,
              required this.selectedIndex,
              required this.travellingIndex,
              required this.onTap,
              required this.compact,
              required this.isArabic,
              required this.accent,
            });

            final List<CargoItem> items;
            final int? selectedIndex;
            final int? travellingIndex;
            final void Function(CargoItem item, int index, Offset globalOrigin) onTap;
            final bool compact;
            final bool isArabic;
            final Color accent;

            @override
            Widget build(BuildContext context) => Container(
              padding: EdgeInsets.fromLTRB(
                compact ? 7 : 10,
                compact ? 6 : 9,
                compact ? 7 : 10,
                compact ? 7 : 10,
              ),
              decoration: BoxDecoration(
                gradient: const LinearGradient(
                  begin: Alignment.topLeft,
                  end: Alignment.bottomRight,
                  colors: [Color(0xFFFDFEFF), Color(0xFFF0F4F8)],
                ),
                borderRadius: BorderRadius.circular(compact ? 22 : 28),
                border: Border.all(color: Colors.white),
                boxShadow: const [
                  BoxShadow(
                    color: Color(0x1F0B1423),
                    blurRadius: 20,
                    offset: Offset(0, 9),
                  ),
                ],
              ),
              child: Column(
                children: [
                  _BoardHeader(
                    title: isArabic ? 'منطقة الشحن' : 'CARGO BAY',
                    trailing: selectedIndex == null
                        ? (isArabic ? 'اختر شحنة' : 'SELECT CARGO')
                        : (isArabic ? 'تم الاختيار' : 'SELECTED'),
                    accent: accent,
                    compact: compact,
                  ),
                  SizedBox(height: compact ? 5 : 7),
                  Expanded(
                    child: GridView.builder(
                      padding: EdgeInsets.zero,
                      itemCount: items.length,
                      gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(
                        crossAxisCount: 3,
                        crossAxisSpacing: compact ? 6 : 9,
                        mainAxisSpacing: compact ? 6 : 9,
                        childAspectRatio: compact ? 1.0 : .92,
                      ),
                      itemBuilder: (_, index) {
                        final item = items[index];
                        final selectedItem = index == selectedIndex;
                        final travellingItem = index == travellingIndex;
                        return Builder(
                          builder: (tileContext) {
                            Offset? tapOrigin;
                            return InkWell(
                              key: ValueKey('cargo-${item.id}-$index'),
                              onTapDown: (details) =>
                                  tapOrigin = details.globalPosition,
                              onTap: () => onTap(
                                item,
                                index,
                                tapOrigin ?? _globalCenter(tileContext),
                              ),
                              borderRadius: BorderRadius.circular(18),
                              child: CargoMotionTile(
                                selected: selectedItem,
                                busy: travellingItem,
                                child: AnimatedContainer(
                                  duration: const Duration(milliseconds: 160),
                                  padding: EdgeInsets.all(compact ? 5 : 7),
                                  decoration: BoxDecoration(
                                    gradient: LinearGradient(
                                      begin: Alignment.topLeft,
                                      end: Alignment.bottomRight,
                                      colors: [item.accentColor, item.color],
                                    ),
                                    borderRadius: BorderRadius.circular(18),
                                    border: Border.all(
                                      color: selectedItem
                                          ? Colors.white
                                          : Colors.white.withValues(alpha: .34),
                                      width: selectedItem ? 3 : 1,
                                    ),
                                    boxShadow: [
                                      BoxShadow(
                                        color: item.color.withValues(
                                          alpha: selectedItem ? .36 : .18,
                                        ),
                                        blurRadius: selectedItem ? 14 : 8,
                                        offset: const Offset(0, 6),
                                      ),
                                    ],
                                  ),
                                  child: Column(
                                    mainAxisAlignment: MainAxisAlignment.center,
                                    children: [
                                      Icon(
                                        item.icon,
                                        color: Colors.white,
                                        size: compact ? 25 : 33,
                                      ),
                                      const SizedBox(height: 3),
                                      Text(
                                        item.name,
                                        maxLines: 1,
                                        overflow: TextOverflow.ellipsis,
                                        style: TextStyle(
                                          color: Colors.white,
                                          fontSize: compact ? 8 : 10,
                                          fontWeight: FontWeight.w900,
                                        ),
                                      ),
                                      if (!compact) ...[
                                        const SizedBox(height: 2),
                                        Text(
                                          item.category.toUpperCase(),
                                          maxLines: 1,
                                          overflow: TextOverflow.ellipsis,
                                          style: const TextStyle(
                                            color: Colors.white70,
                                            fontSize: 7,
                                            fontWeight: FontWeight.w800,
                                            letterSpacing: .4,
                                          ),
                                        ),
                                      ],
                                    ],
                                  ),
                                ),
                              ),
                            );
                          },
                        );
                      },
                    ),
                  ),
                ],
              ),
            );
          }

          class _WarehouseBoard extends StatelessWidget {
            const _WarehouseBoard({
              required this.warehouses,
              required this.activeFlight,
              required this.onTap,
              required this.compact,
              required this.isArabic,
              required this.accent,
            });

            final List<CargoItem> warehouses;
            final _CargoFlight? activeFlight;
            final void Function(CargoItem item, Offset globalDestination) onTap;
            final bool compact;
            final bool isArabic;
            final Color accent;

            @override
            Widget build(BuildContext context) => Container(
              padding: EdgeInsets.fromLTRB(
                compact ? 7 : 10,
                compact ? 6 : 9,
                compact ? 7 : 10,
                compact ? 7 : 10,
              ),
              decoration: BoxDecoration(
                color: const Color(0xFF101C2D).withValues(alpha: .94),
                borderRadius: BorderRadius.circular(compact ? 22 : 28),
                border: Border.all(color: Colors.white24),
                boxShadow: const [
                  BoxShadow(
                    color: Color(0x330B1423),
                    blurRadius: 20,
                    offset: Offset(0, 10),
                  ),
                ],
              ),
              child: Column(
                children: [
                  _BoardHeader(
                    title: isArabic ? 'أرصفة الفرز' : 'SORTING DOCKS',
                    trailing: isArabic ? 'اختر الوجهة' : 'CHOOSE DESTINATION',
                    accent: accent,
                    compact: compact,
                    dark: true,
                  ),
                  SizedBox(height: compact ? 5 : 7),
                  Expanded(
                    child: GridView.builder(
                      padding: EdgeInsets.zero,
                      itemCount: warehouses.length,
                      gridDelegate: SliverGridDelegateWithFixedCrossAxisCount(
                        crossAxisCount: min(3, warehouses.length),
                        crossAxisSpacing: compact ? 6 : 9,
                        mainAxisSpacing: compact ? 6 : 9,
                        childAspectRatio: compact ? 1.2 : 1.05,
                      ),
                      itemBuilder: (_, index) {
                        final item = warehouses[index];
                        final active = activeFlight?.warehouse.id == item.id;
                        final correct = active && activeFlight?.item.id == item.id;
                        return Builder(
                          builder: (tileContext) {
                            Offset? tapDestination;
                            return WarehouseMotionTarget(
                              active: active,
                              correct: correct,
                              child: InkWell(
                                key: ValueKey('warehouse-${item.id}'),
                                onTapDown: (details) =>
                                    tapDestination = details.globalPosition,
