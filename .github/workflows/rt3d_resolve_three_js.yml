name: RT3D Resolve three_js Dependency

on:
  push:
    branches:
      - agent/rt3d-002-slice-01

permissions:
  contents: write

concurrency:
  group: rt3d-resolve-three-js
  cancel-in-progress: true

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout RT3D branch
        uses: actions/checkout@v4
        with:
          ref: agent/rt3d-002-slice-01
          fetch-depth: 0

      - name: Skip until candidate is staged
        id: candidate
        shell: bash
        run: |
          if grep -q '^  three_js:' pubspec.yaml; then
            echo 'staged=true' >> "$GITHUB_OUTPUT"
          else
            echo 'staged=false' >> "$GITHUB_OUTPUT"
            echo 'three_js is not staged yet; leaving resolver installed.'
          fi

      - name: Set up Flutter
        if: steps.candidate.outputs.staged == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Resolve dependency lock
        if: steps.candidate.outputs.staged == 'true'
        run: flutter pub get

      - name: Commit resolved lock and remove helper
        if: steps.candidate.outputs.staged == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock
          git rm .github/workflows/rt3d_resolve_three_js.yml
          git commit -m 'RT3D-002: resolve three_js dependency lock'
          git push origin HEAD:agent/rt3d-002-slice-01
