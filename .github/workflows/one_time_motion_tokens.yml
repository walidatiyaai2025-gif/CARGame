name: One-time MOT-001 implementation

on:
  push:
    branches: [main]
    paths:
      - scripts/one_time_motion_tokens.py
      - .github/workflows/one_time_motion_tokens.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply MOT-001 patch
        run: python scripts/one_time_motion_tokens.py
      - name: Format and verify
        run: |
          dart format lib/core/motion/game_motion.dart lib/core/widgets/game_button.dart test/core/motion/game_motion_test.dart
          git diff --check
      - name: Commit checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(motion): add shared motion tokens [skip ci]"
          git push
