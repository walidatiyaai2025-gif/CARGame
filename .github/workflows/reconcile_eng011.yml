name: ENG-011 Tracking Reconciliation

on:
  push:
    paths:
      - tool/reconcile_eng011_trigger.txt

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconcile catalog and live status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          catalog_path = Path("docs/FEATURE_CATALOG.md")
          catalog = catalog_path.read_text(encoding="utf-8")
          catalog = replace_once(
              catalog,
              "| ENG-011 | Developer tooling and documentation | P1 | PLANNED | ENG-001 | Setup, run, repair, dashboard, release, and troubleshooting workflows are reproducible on a clean machine. |",
              "| ENG-011 | Developer tooling and documentation | P1 | VERIFIED | ENG-001 | Issue #173 / PR #174 replace stale root setup/release guidance with `docs/DEVELOPER_WORKFLOWS.md` as the canonical clean-checkout, run, repair, dashboard, CI-parity, privacy, troubleshooting, and guarded-release workflow; current supported scripts remain the single operational surface rather than adding a competing launcher. `tool/verify_developer_workflows.py` protects 16 required entry points/current guidance and rejects project regeneration, obsolete bootstrap instructions, tracked AdMob-ID replacement, manual duplicate UMP integration, hard-coded emulator serials, and direct release-build bypasses; 10 focused regressions cover the contract. Flutter CI #773 / run `31339612397` passed the new ENG-011 gates, privacy/security/dependency/dashboard/catalog/assets checks, formatting, Analyze, the full Flutter suite, Debug APK build, artifact security and upload on implementation head `c34881bda12a6a355930755b39e47d09d24f0f3d`; artifact #9045499219 is 80,619,633 bytes with SHA-256 `2baf734f6a3362837f140cbbd25863c7ea189b15de3ea81d75d5b7dde43e7d5b`. |",
              "ENG-011 catalog row",
          )
          catalog = replace_once(
              catalog,
              "- `ENG-011` Developer tooling and documentation — P1; `ENG-001` is VERIFIED and no higher-priority source-controlled P0 is currently dependency-ready. `TEST-011` remains an RC acceptance target but now waits only on external production UMP/privacy-message evidence rather than repository-owned local data controls.",
              "- `ENG-012` Analytics event schema and privacy gating — P1; `ENG-005` is IMPLEMENTED and `PRIV-001` is VERIFIED. Repository search confirms no current first-party analytics implementation, so the next safe checkpoint is a versioned schema/port that remains disabled until explicit privacy/config eligibility rather than introducing a network SDK.",
              "ENG-011 NEXT READY",
          )
          catalog = replace_once(
              catalog,
              "## Recently verified\n\n- `PRIV-003` User data export/deletion readiness",
              "## Recently verified\n\n- `ENG-011` Developer tooling and documentation — issue #173 / PR #174 establish one canonical developer workflow over the existing supported scripts, replace stale README setup/release guidance, and add a blocking 16-entry-point/current-guidance drift validator with 10 focused regressions. Flutter CI #773 / run `31339612397` passed the new gates, full Flutter tests, Debug APK and artifact security; artifact #9045499219 is 80,619,633 bytes with SHA-256 `2baf734f6a3362837f140cbbd25863c7ea189b15de3ea81d75d5b7dde43e7d5b`.\n- `PRIV-003` User data export/deletion readiness",
              "ENG-011 recently verified entry",
          )
          catalog_path.write_text(catalog, encoding="utf-8")

          status_path = Path("docs/STATUS.md")
          status = status_path.read_text(encoding="utf-8")
          status = replace_once(
              status,
              "| Primary feature | None — `PRIV-003` first-party local data controls are VERIFIED on PR #172. |\n| Completed checkpoint | `PRIV-003` user data export/deletion readiness — VERIFIED after Flutter CI #768 / run `31338337454`. |\n| Status | PRIV-003 is VERIFIED: Settings now provides zero-network JSON export plus confirmation-guarded deletion/reset of CARGame first-party local progress/economy/settings/transaction/reward/recovery data and diagnostics, followed by fresh-store rehydration. |\n| Previous checkpoint | `PRIV-002` privacy policy and Play Data Safety mapping — IMPLEMENTED after PR #170 / Flutter CI #750; publication/store evidence remains external. |\n| Next recommended feature | `ENG-011` Developer tooling and documentation — P1; ENG-001 is VERIFIED and no higher-priority source-controlled P0 is currently dependency-ready. `TEST-011` now waits only on external production UMP/privacy-message evidence. |",
              "| Primary feature | None — `ENG-011` developer tooling/documentation is VERIFIED on PR #174. |\n| Completed checkpoint | `ENG-011` canonical developer workflows and documentation drift guard — VERIFIED after Flutter CI #773 / run `31339612397`. |\n| Status | ENG-011 is VERIFIED: README and `docs/DEVELOPER_WORKFLOWS.md` now define the supported setup/run/repair/dashboard/verification/release path, and CI blocks stale or dangerous workflow documentation from returning. |\n| Previous checkpoint | `PRIV-003` user data export/deletion readiness — VERIFIED after PR #172 / Flutter CI #771. |\n| Next recommended feature | `ENG-012` Analytics event schema and privacy gating — P1; ENG-005 is IMPLEMENTED and PRIV-001 is VERIFIED. No first-party analytics implementation exists yet, so the safe next step is a disabled-by-default versioned schema/port with explicit privacy/config eligibility. |",
              "ENG-011 current-work summary",
          )
          status = replace_once(
              status,
              "## PRIV-003 user data export/deletion readiness — 2026-08-10",
              "## ENG-011 developer tooling and documentation — 2026-08-10\n\n- Issue #173 / PR #174 replace obsolete README bootstrap/release instructions with a current canonical developer path over the repository's existing tooling rather than introducing another launcher.\n- `docs/DEVELOPER_WORKFLOWS.md` documents clean checkout/first run, daily Android execution with dynamic target selection, CI-parity verification, Android/Kotlin repair, dashboard access, privacy contracts, guarded APK/AAB release packaging, and a troubleshooting matrix.\n- `README.md` now points to `START_CARGAME_TOOL.bat`, `FIRST_TIME_SETUP_AND_RUN.ps1`, `RUN_ON_EMULATOR.ps1`, repair/dashboard scripts, and the guarded `VERIFY_RELEASE_INPUTS.ps1` / `BUILD_RC.ps1` release path; production signing/AdMob values remain external and ADS-007 UMP integration is treated as authoritative.\n- `tool/verify_developer_workflows.py` protects 16 required entry-point/doc files and current guidance while rejecting project-regeneration commands, obsolete bootstrap guidance, tracked AdMob replacement instructions, manual duplicate UMP integration, hard-coded emulator serials, and direct unguarded release builds.\n- `tool/test_developer_workflows.py` provides 10 focused regressions for valid text/repository contracts and every protected stale/missing workflow class.\n- Flutter CI now runs the developer-workflow validator and regression suite as blocking gates before package restore.\n- Flutter CI #773 / run `31339612397` passed both ENG-011 gates, privacy/security/dependency/dashboard/catalog/assets checks, formatting, whitespace, Analyze, focused privacy/service/widget tests, the full Flutter suite, Debug APK build, packaged-artifact security scan and upload on implementation head `c34881bda12a6a355930755b39e47d09d24f0f3d`.\n- Debug artifact #9045499219 is 80,619,633 bytes with SHA-256 `2baf734f6a3362837f140cbbd25863c7ea189b15de3ea81d75d5b7dde43e7d5b`.\n- Repository search found no current first-party analytics implementation; ENG-012 is the next dependency-ready source-controlled feature and must preserve the existing analytics-disabled privacy posture until an explicit gate permits collection.\n\n## PRIV-003 user data export/deletion readiness — 2026-08-10",
              "ENG-011 status section",
          )
          status = replace_once(
              status,
              "| 2026-08-10 | PRIV-003 local data export/deletion readiness | PASSED — PR #172 / Flutter CI #768 / run `31338337454` / 15 disclosure regressions + focused controller/Settings tests + full Flutter suite + Debug APK artifact #9045113026 / SHA-256 `6c101a90e89053b48836dd48be72b76ceb9290401ae3643310ad46730b653ddf`; repository-owned state VERIFIED |",
              "| 2026-08-10 | PRIV-003 local data export/deletion readiness | PASSED — PR #172 / Flutter CI #768 / run `31338337454` / 15 disclosure regressions + focused controller/Settings tests + full Flutter suite + Debug APK artifact #9045113026 / SHA-256 `6c101a90e89053b48836dd48be72b76ceb9290401ae3643310ad46730b653ddf`; repository-owned state VERIFIED |\n| 2026-08-10 | ENG-011 canonical developer workflows | PASSED — PR #174 / Flutter CI #773 / run `31339612397` / 16-entry-point workflow validator + 10 regressions + full Flutter suite + Debug APK artifact #9045499219 / SHA-256 `2baf734f6a3362837f140cbbd25863c7ea189b15de3ea81d75d5b7dde43e7d5b`; repository-owned state VERIFIED |",
              "ENG-011 verification ledger",
          )
          status_path.write_text(status, encoding="utf-8")
          PY

      - name: Validate reconciled tracking
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 tool/verify_ci_integrity.py
          python3 tool/verify_developer_workflows.py
          grep -F '| ENG-011 | Developer tooling and documentation | P1 | VERIFIED |' docs/FEATURE_CATALOG.md
          grep -F '`ENG-012` Analytics event schema and privacy gating' docs/FEATURE_CATALOG.md
          grep -F '`ENG-011` developer tooling/documentation is VERIFIED' docs/STATUS.md

      - name: Commit exact reconciliation and remove one-shot job
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/reconcile_eng011.yml tool/reconcile_eng011_trigger.txt
          git add docs/FEATURE_CATALOG.md docs/STATUS.md
          git commit -m 'ENG-011: reconcile verified tracking'
          git push origin "HEAD:${GITHUB_REF_NAME}"
