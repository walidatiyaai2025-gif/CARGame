name: TEST-011 Bootstrap

on:
  push:
    branches:
      - agent/test-011-privacy-security-verification

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/test-011-privacy-security-verification
          fetch-depth: 0

      - name: Apply TEST-011 tracking and CI contract
        run: python3 tool/bootstrap_test011.py

      - name: Tighten TEST-011 Settings validator
        run: python3 tool/test011_validator_fixup.py

      - name: Validate TEST-011 repository contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/verify_test_011_privacy_security.py
          python3 tool/test_test_011_privacy_security.py
          python3 tool/verify_privacy_inventory.py
          python3 tool/verify_analytics_privacy.py
          python3 tool/verify_crash_reporting_privacy.py
          python3 tool/verify_privacy_disclosures.py
          python3 tool/test_privacy_disclosures.py
          python3 tool/verify_security_baseline.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          git diff --check

      - name: Commit non-workflow bootstrap result
        shell: bash
        run: |
          set -euo pipefail
          find tool -type d -name __pycache__ -prune -exec rm -rf {} +
          rm tool/bootstrap_test011.py
          rm tool/test011_validator_fixup.py
          git checkout HEAD -- .github/workflows
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/PERF-002.md docs/work/TEST-011.md docs/TEST_011_PRIVACY_SECURITY.md tool/verify_test_011_privacy_security.py tool/test_test_011_privacy_security.py tool/bootstrap_test011.py tool/test011_validator_fixup.py test/core/ads/ad_request_gate_test.dart
          git diff --cached --check
          git commit -m "TEST-011: establish privacy security verification contract"
          git push origin HEAD:agent/test-011-privacy-security-verification
