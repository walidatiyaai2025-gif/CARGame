name: REW007 Tracking Patch

on:
  push:
    branches:
      - agent/rew-007-reward-ledger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rew-007-reward-ledger
      - name: Reconcile active REW-007 tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          catalog = Path('docs/FEATURE_CATALOG.md')
          text = catalog.read_text()
          old = '| REW-007 | Reward transaction ledger and reconciliation | P0 | PLANNED | ENG-008, REW-001 | Every grant has stable reason/idempotency key and can be audited/reconciled after interruption. |'
          new = '| REW-007 | Reward transaction ledger and reconciliation | P0 | IN PROGRESS | ENG-008, REW-001 | Issue #119 / PR #120 add stable reason/idempotency keys, a bounded completed ledger, an absolute-state pending journal, and deterministic interruption recovery for level, daily reward, and daily mission grants; full CI/build verification is in progress. |'
          if text.count(old) != 1:
              raise SystemExit('REW-007 catalog row did not match exactly once')
          catalog.write_text(text.replace(old, new, 1))

          status = Path('docs/STATUS.md')
          text = status.read_text()
          replacements = [
              (
                  '| Primary feature | `ADS-002` verification complete — issue #116 / PR #117; transitioning to the next RC P0. |',
                  '| Primary feature | `REW-007` IN PROGRESS — issue #119 / draft PR #120 on `agent/rew-007-reward-ledger`. |',
              ),
              (
                  '| Status | `ENG-010` VERIFIED: tracked secret/config artifacts fail closed, scanner policy has focused regression coverage, standalone provider credentials are redacted from diagnostics, and local/CI injection plus rotation/recovery guidance is documented. |',
                  '| Status | `REW-007` implementation adds an interruption-safe absolute-state reward journal, bounded completed-idempotency ledger, deterministic recovery before load, and stable gameplay-attempt IDs; CI/build verification remains before VERIFIED. |',
              ),
              (
                  '| Next recommended feature | `REW-007` reward transaction ledger and reconciliation: add stable grant reasons/idempotency keys and interruption-safe audit/reconciliation on top of the verified persistence/reward flows. |',
                  '| Next recommended feature | Complete `REW-007` CI/build verification and tracking reconciliation; then select the next unblocked RC P0 from the catalog. |',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'STATUS replacement did not match exactly once: {old}')
              text = text.replace(old, new, 1)
          status.write_text(text)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_CATALOG.md docs/STATUS.md
          git commit -m "docs: mark REW-007 in progress"
          git push origin HEAD:agent/rew-007-reward-ledger
