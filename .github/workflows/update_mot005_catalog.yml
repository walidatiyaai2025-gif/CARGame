name: Finalize MOT-005 Catalog

on:
  push:
    paths:
      - '.github/workflows/update_mot005_catalog.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update catalog
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/FEATURE_CATALOG.md')
          text = path.read_text(encoding='utf-8')
          old = '| MOT-005 | Ambient home/world motion | P1 | IN PROGRESS | MOT-001, UI3D-007 | Home now uses a lifecycle-safe animated gradient, drifting clouds, glow parallax, and low-cost road depth with reduced-motion support; world-map adoption and physical-device review remain. |'
          new = '| MOT-005 | Ambient home/world motion | P1 | IMPLEMENTED | MOT-001, UI3D-007 | Home and World Map reuse one lifecycle-safe animated gradient, drifting-cloud, glow-parallax, and low-cost depth implementation with reduced-motion support; physical-device performance review remains. |'
          if old not in text:
              raise SystemExit('MOT-005 catalog row not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit catalog update
        run: |
          rm .github/workflows/update_mot005_catalog.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md .github/workflows/update_mot005_catalog.yml
          git commit -m 'docs: mark MOT-005 implemented [skip ci]'
          git push
