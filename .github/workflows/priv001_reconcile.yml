name: PRIV001 Tracking Reconciliation

on:
  push:
    branches:
      - agent/priv-001-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconcile catalog and status
        shell: python
        run: |
          from pathlib import Path

          catalog_path = Path('docs/FEATURE_CATALOG.md')
          catalog = catalog_path.read_text(encoding='utf-8')

          replacements = [
              (
                  "| PRIV-001 | Privacy inventory, consent, and data minimization | P0 | PLANNED | ENG-001 | Every collected datum, purpose, retention, consent, processor, and deletion path is documented. |",
                  "| PRIV-001 | Privacy inventory, consent, and data minimization | P0 | VERIFIED | ENG-001 | Historical PR #33 established the privacy inventory/CI gate; issue #32 / PR #126 refreshed it against current main. The machine inventory now covers all 33 persisted SharedPreferences key/prefix families across progress, settings, transaction/migration integrity, and recovery snapshots; CI fails on missing/stale/duplicate persistence coverage and cross-checks the sole declared network processor, Google Mobile Ads. Flutter CI #651 / run `31299285194` passed the strengthened privacy gate, security baseline, Analyze, full Flutter tests, Debug APK build and artifact upload on head `659a78ce00b6fc3f95e7213bf1c04ceaa680cd55`. Debug artifact #9034063433 is 80,544,514 bytes with SHA-256 `6fc839b195551ffcdbb0bd30b69bb9f29124aa5b9f5277ab8aa981d3508f4f9c`; PR #126 squash-merged as `dd076dd383d6c3cd0dd33986f980e8b4f012b38b`. ADS-007, ENG-013, PRIV-003, and PRIV-002 remain explicit downstream gates. |"
              ),
              (
                  "- None after `ECON-005` verification.",
                  "- None after `PRIV-001` verification."
              ),
              (
                  "1. `PRIV-001` Privacy inventory, consent, and data minimization — `ENG-001` is VERIFIED; completing the release data inventory unlocks consent/store mapping and `TEST-011` privacy/security verification.\n2. `SEC-001` Mobile security baseline and threat model — `ENG-010` is VERIFIED; release trust boundaries and mitigations can now be reconciled against the existing security CI baseline.\n3. `AST-011` Asset licensing and provenance — `AST-001` is VERIFIED; commercial-use provenance remains a release-critical content-rights prerequisite.",
                  "1. `SEC-001` Mobile security baseline and threat model — historical PR #35 implemented the baseline, but current-main reconciliation must account for the refreshed PRIV-001 processor/gating truth and later persistence/release hardening.\n2. `AST-011` Asset licensing and provenance — `AST-001` is VERIFIED; commercial-use provenance remains a release-critical content-rights prerequisite."
              ),
              (
                  "## Recently verified\n\n- `ECON-005` Versioned economy configuration and balance rules",
                  "## Recently verified\n\n- `PRIV-001` Privacy inventory, consent, and data minimization — issue #32 / PR #126 refreshed the historical PR #33 inventory to current main, mechanically covers all 33 persisted key/prefix families, records Google Mobile Ads as the only network data processor, and explicitly preserves ADS-007/ENG-013/PRIV-003/PRIV-002 as downstream gaps. Flutter CI #651 passed all gates and uploaded artifact #9034063433 (`6fc839b195551ffcdbb0bd30b69bb9f29124aa5b9f5277ab8aa981d3508f4f9c`); PR #126 merged as `dd076dd383d6c3cd0dd33986f980e8b4f012b38b`.\n- `ECON-005` Versioned economy configuration and balance rules"
              ),
          ]

          for old, new in replacements:
              count = catalog.count(old)
              if count != 1:
                  raise SystemExit(f'catalog replacement expected once, found {count}: {old[:80]}')
              catalog = catalog.replace(old, new)
          catalog_path.write_text(catalog, encoding='utf-8')

          status_path = Path('docs/STATUS.md')
          status = status_path.read_text(encoding='utf-8')
          status_replacements = [
              (
                  "| Primary feature | None; `ECON-005` is VERIFIED after issue #122 / PR #124. |",
                  "| Primary feature | None; `PRIV-001` is VERIFIED after issue #32 / PR #126 current-main refresh. |"
              ),
              (
                  "| Completed checkpoint | `ECON-005` versioned economy configuration — PR #124 merged as `2091cf35ff9b4a261fa76f9d90975735711c58e3` after Flutter CI #647 passed the full gate set and uploaded debug artifact #9033326885. |",
                  "| Completed checkpoint | `PRIV-001` privacy inventory current-main reconciliation — PR #126 merged as `dd076dd383d6c3cd0dd33986f980e8b4f012b38b` after Flutter CI #651 passed the strengthened privacy drift gate, security cross-check, full Flutter suite, Debug APK and artifact upload. |"
              ),
              (
                  "| Status | Shipped v1 economy values are centralized in immutable validated `EconomyConfig.v1`; migration is non-destructive/fail-closed, shop prices and quantities are authoritative by stable offer IDs, and configured heart purchases retain SHOP-002 transaction atomicity. |",
                  "| Status | Privacy inventory is synchronized with the current 33 persisted key/prefix families and mechanically drift-protected; Google Mobile Ads is the sole declared network processor. ADS-007 ad-consent/bootstrap gating, ENG-013 diagnostics gating, PRIV-003 in-app data controls, and PRIV-002 store/policy mapping remain explicit follow-ups. |"
              ),
              (
                  "| Previous checkpoint | `REW-007` reward transaction reconciliation — PR #120 merged as `b915d95b938d459133a9a8b120f38815178b1852` after Flutter CI #623. |",
                  "| Previous checkpoint | `ECON-005` versioned economy configuration — PR #124 merged as `2091cf35ff9b4a261fa76f9d90975735711c58e3` after Flutter CI #647. |"
              ),
              (
                  "| Next recommended feature | `PRIV-001` privacy inventory, consent, and data minimization: unblocked by `ENG-001`, release-critical, and it unlocks consent/store mapping plus `TEST-011`. |",
                  "| Next recommended feature | `SEC-001` mobile security baseline and threat model current-main reconciliation: historical PR #35 exists, but it must be checked against the refreshed privacy processor/gating truth and later release-hardening changes. |"
              ),
              (
                  "## ECON-005 economy configuration verification — 2026-08-09",
                  "## PRIV-001 privacy inventory current-main verification — 2026-08-09\n\n- Historical PR #33 established the original human/machine privacy inventory and CI validation gate; issue #32 was reopened because later SHOP-002, REL-004, REW-007, and ECON-005 work expanded local persistence.\n- PR #126 reconciles the inventory with all 33 current SharedPreferences key/prefix families across gameplay/progress, settings, transaction/migration integrity metadata, and the storage-recovery snapshot.\n- `tool/verify_privacy_inventory.py` now extracts persisted key declarations from `ProgressStore`, `AppSettingsStore`, and `RecoveringPreferences` and fails on missing, stale, or duplicate inventory ownership.\n- Google Mobile Ads remains the only declared production network data processor; no first-party analytics, account, cloud-save, or remote diagnostics SDK is enabled.\n- Current runtime gaps are recorded rather than overstated: `AdService` request/load/show calls honor `ENABLE_ADS=false` but bootstrap still initializes `MobileAds`; `ENABLE_DIAGNOSTICS` exists but does not suppress local logger installation; complete in-app reset/export/delete remains pending. Owners remain ADS-007, ENG-013, and PRIV-003 respectively, while PRIV-002 owns policy/store mapping.\n- Final implementation head `659a78ce00b6fc3f95e7213bf1c04ceaa680cd55` passed Flutter CI #651 / run `31299285194`, including the strengthened privacy drift gate, security baseline, formatting, Analyze, full Flutter tests, Debug APK build, and upload.\n- Debug artifact #9034063433 is 80,544,514 bytes with SHA-256 `6fc839b195551ffcdbb0bd30b69bb9f29124aa5b9f5277ab8aa981d3508f4f9c`.\n- PR #126 squash-merged to `main` as `dd076dd383d6c3cd0dd33986f980e8b4f012b38b`; `PRIV-001` is VERIFIED.\n- Next release-critical reconciliation target: `SEC-001`.\n\n## ECON-005 economy configuration verification — 2026-08-09"
              ),
              (
                  "| 2026-08-09 | ECON-005 versioned economy configuration | PASSED — PR #124 / Flutter CI #647 / run `31296918681` / debug artifact #9033326885 / SHA-256 `bbca79f780b9effc07a93ecc8a5a0b0dd73b523e6706531fe292127165d2872a` |",
                  "| 2026-08-09 | PRIV-001 privacy inventory current-main reconciliation | PASSED — PR #126 / Flutter CI #651 / run `31299285194` / debug artifact #9034063433 / SHA-256 `6fc839b195551ffcdbb0bd30b69bb9f29124aa5b9f5277ab8aa981d3508f4f9c` |\n| 2026-08-09 | ECON-005 versioned economy configuration | PASSED — PR #124 / Flutter CI #647 / run `31296918681` / debug artifact #9033326885 / SHA-256 `bbca79f780b9effc07a93ecc8a5a0b0dd73b523e6706531fe292127165d2872a` |"
              ),
          ]

          for old, new in status_replacements:
              count = status.count(old)
              if count != 1:
                  raise SystemExit(f'status replacement expected once, found {count}: {old[:80]}')
              status = status.replace(old, new)
          status_path.write_text(status, encoding='utf-8')

      - name: Commit reconciliation and remove helper
        shell: bash
        run: |
          rm .github/workflows/priv001_reconcile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "docs: reconcile PRIV-001 verification"
          git push origin HEAD:${GITHUB_REF_NAME}
