name: SEC-002 Verification Reconciliation

on:
  push:
    branches:
      - agent/sec-002-reconcile
    paths:
      - .github/scripts/sec002_reconcile.py
      - .github/workflows/sec002_reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sec-002-reconcile
          fetch-depth: 0
      - name: Reconcile SEC-002 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sec002_reconcile.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          python3 tool/test_security_scans.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/SEC-002.md
          git rm .github/scripts/sec002_reconcile.py .github/workflows/sec002_reconcile.yml
          git commit -m 'docs: verify SEC-002 security scans'
          git push origin HEAD:agent/sec-002-reconcile
