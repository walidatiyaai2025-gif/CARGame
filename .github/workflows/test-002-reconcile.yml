name: TEST-002 Reconcile

on:
  push:
    branches:
      - agent/test-002-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-002-reconcile
          fetch-depth: 0
      - name: Reconcile TEST-002 verification evidence
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected tracking text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = 'docs/FEATURE_CATALOG.md'
          replace_once(
              catalog,
              '| TEST-002 | Level generator and solvability tests | P0 | IN PROGRESS | LEVEL-003 | Issue #143 consolidates the production 1..150 catalog into one deterministic release contract: exact identity, regeneration parity, `LevelSolvabilityValidator.validateAll`, `LevelDifficultyCurve.validateAll`, and explicit boundaries 1/25/26/150. Detailed negative cases stay in their owning suites; production level content changes only if integrated validation exposes a real defect. |',
              '| TEST-002 | Level generator and solvability tests | P0 | VERIFIED | LEVEL-003 | Issue #143 / PR #144 consolidate the exact production 1..150 catalog into one deterministic release contract: sequential identity, regeneration parity, `LevelSolvabilityValidator.validateAll`, `LevelDifficultyCurve.validateAll`, and explicit boundaries 1/25/26/150. No production level content changed. After UI3D-007 / PR #141 advanced main, PR #144 was reconciled and Flutter CI #697 / run `31310666540` passed all gates on head `a0f1de0e14b78f090bb770643c93492cc5164ebe`; artifact #9037363042 is 80,562,923 bytes with SHA-256 `ef6c18142dc7b1925f131848217ba8db8386f534aaee24becaede3d3ed598a9b`. PR #144 squash-merged as `d9afbb06564a08ee571ed7c9e4784adf99a7c3fe`. |',
          )
          replace_once(
              catalog,
              '## IN PROGRESS\n\n- `TEST-002` Level generator and solvability tests — issue #143; integrating deterministic generation, structural solvability, and quantitative difficulty acceptance into one release contract over the exact 150-level production catalog.',
              '## IN PROGRESS\n\n- None.',
          )
          replace_once(
              catalog,
              '## NEXT READY\n\n- To be selected after TEST-002 verification.',
              '## NEXT READY\n\n- `ENG-005` Clean architecture boundaries — P1 and dependency-ready through VERIFIED `ENG-001`; no remaining PLANNED P0 is currently dependency-ready, so this is the next highest-priority unblocked catalog item.',
          )
          replace_once(
              catalog,
              '## Recently verified\n\n- `LEVEL-002` Difficulty curve',
              '## Recently verified\n\n- `TEST-002` Level generator and solvability tests — issue #143 / PR #144 add one integrated deterministic release contract over the exact 150-level production catalog, combining regeneration parity, structural solvability, quantitative difficulty acceptance, and required boundaries 1/25/26/150. Final current-main Flutter CI #697 / run `31310666540` passed all gates and uploaded artifact #9037363042 (`ef6c18142dc7b1925f131848217ba8db8386f534aaee24becaede3d3ed598a9b`); PR #144 squash-merged as `d9afbb06564a08ee571ed7c9e4784adf99a7c3fe`.\n- `LEVEL-002` Difficulty curve',
          )

          status = 'docs/STATUS.md'
          replace_once(
              status,
              '| Primary feature | `TEST-002` Level generator and solvability tests — IN PROGRESS under issue #143. |',
              '| Primary feature | None — `TEST-002` is VERIFIED; `ENG-005` is the next dependency-ready catalog item. |',
          )
          replace_once(
              status,
              '| Completed checkpoint | `LEVEL-002` quantitative difficulty curve — PR #137 merged after final current-main reconciliation and green Flutter CI #681. |',
              '| Completed checkpoint | `TEST-002` integrated level release contract — PR #144 merged after current-main reconciliation and green Flutter CI #697. |',
          )
          replace_once(
              status,
              '| Status | TEST-002 is consolidating the exact production 150-level catalog into one deterministic release gate covering regeneration parity, structural solvability, quantitative difficulty acceptance, and required boundaries 1/25/26/150. No production level change is planned unless the integrated gate exposes a real defect. |',
              '| Status | TEST-002 is VERIFIED. One deterministic release gate now proves exact 1..150 identity, regeneration parity, structural solvability, quantitative difficulty acceptance, and boundaries 1/25/26/150 without changing production level content. |',
          )
          replace_once(
              status,
              '| Next recommended feature | Complete TEST-002 issue #143 and reconcile verification evidence; select the next unblocked catalog item only after current-head CI passes. |',
              '| Next recommended feature | `ENG-005` Clean architecture boundaries — highest-priority dependency-ready catalog item after TEST-002; audit current presentation/domain/application/storage/assets/motion/analytics/service boundaries before changing architecture. |',
          )
          replace_once(
              status,
              '## LEVEL-002 quantitative difficulty curve verification — 2026-08-09',
              '## TEST-002 integrated level release contract verification — 2026-08-09\n\n- Issue #143 / PR #144 add `level_release_contract_test.dart` as one release-level gate over the exact production `levels` catalog.\n- The gate requires exact sequential identity 1..150, regenerates every level and compares stable number/world/moves/difficulty plus ordered product IDs, then validates the full catalog through both `LevelSolvabilityValidator` and `LevelDifficultyCurve`.\n- Required release boundaries 1, 25, 26, and 150 pass both structural and quantitative contracts explicitly; detailed negative cases remain in their existing owning suites.\n- No production level, progression, save, economy, reward, or UI content changed for TEST-002.\n- UI3D-007 / PR #141 advanced main during verification, so TEST-002 was reconciled to main `c6e22c1fca7e82e8c48a3d79071ff0dc515471de` before the final gate.\n- Final Flutter CI #697 / run `31310666540` passed dynamic-target, secret/privacy/security/asset gates, formatting, whitespace, Analyze, optional-service regressions, the full Flutter suite, Debug APK build, and artifact upload on head `a0f1de0e14b78f090bb770643c93492cc5164ebe`.\n- Debug artifact #9037363042 is 80,562,923 bytes with SHA-256 `ef6c18142dc7b1925f131848217ba8db8386f534aaee24becaede3d3ed598a9b`.\n- PR #144 squash-merged to main as `d9afbb06564a08ee571ed7c9e4784adf99a7c3fe`.\n- `TEST-002` is VERIFIED; no PLANNED P0 is currently dependency-ready, so `ENG-005` is the next highest-priority unblocked catalog item.\n\n## LEVEL-002 quantitative difficulty curve verification — 2026-08-09',
          )

          work = Path('docs/work/TEST-002.md')
          text = work.read_text(encoding='utf-8')
          if 'Status: IN PROGRESS' not in text:
              raise SystemExit('TEST-002 work note no longer has expected IN PROGRESS state')
          text = text.replace('Status: IN PROGRESS', 'Status: VERIFIED', 1)
          text += '''\n## Final implementation\n\n- Added one integrated release contract over the exact production 150-level catalog.\n- Proves sequential identity, deterministic regeneration parity, structural solvability, quantitative difficulty acceptance, and explicit 1/25/26/150 boundaries.\n- Preserved all production level content and retained detailed negative cases in their existing focused suites.\n\n## Final verification — 2026-08-09\n\n- Implementation PR: #144.\n- Final reconciled head: `a0f1de0e14b78f090bb770643c93492cc5164ebe`.\n- Current-main baseline after UI3D-007: `c6e22c1fca7e82e8c48a3d79071ff0dc515471de`.\n- Flutter CI: #697 / run `31310666540` — all gates green, including full Flutter tests and Debug APK build/upload.\n- Artifact: #9037363042, 80,562,923 bytes, SHA-256 `ef6c18142dc7b1925f131848217ba8db8386f534aaee24becaede3d3ed598a9b`.\n- Squash merge: `d9afbb06564a08ee571ed7c9e4784adf99a7c3fe`.\n- Result: `TEST-002` VERIFIED.\n'''
          work.write_text(text, encoding='utf-8')

      - name: Remove temporary reconciliation workflow
        run: rm .github/workflows/test-002-reconcile.yml
      - name: Commit reconciled tracking
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/TEST-002.md .github/workflows/test-002-reconcile.yml
          git commit -m "docs: reconcile TEST-002 verification"
          git push origin HEAD:agent/test-002-reconcile
