name: Temporary GAME-016 reconciliation

on:
  push:
    branches:
      - agent/game-016-reconcile
    paths:
      - .github/workflows/_temporary_game016_reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/game-016-reconcile
          fetch-depth: 0
      - run: python3 tool/_reconcile_game016.py
      - run: |
          git rm .github/workflows/_temporary_game016_reconcile.yml tool/_reconcile_game016.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md
          git commit -m 'docs: verify GAME-016 input determinism'
          git push origin HEAD:agent/game-016-reconcile
