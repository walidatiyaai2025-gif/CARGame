name: SEC-002 Tracking Bootstrap

on:
  push:
    branches:
      - agent/sec-002-security-scans
    paths:
      - .github/scripts/sec002_bootstrap.py
      - .github/workflows/sec002_bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sec-002-security-scans
          fetch-depth: 0
      - name: Reconcile SEC-002 tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/sec002_bootstrap.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md
          git rm .github/scripts/sec002_bootstrap.py .github/workflows/sec002_bootstrap.yml
          git diff --cached --check
          git commit -m 'docs: activate SEC-002 security scans'
          git push origin HEAD:agent/sec-002-security-scans
