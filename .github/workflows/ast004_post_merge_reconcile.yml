name: AST-004 Post Merge Reconcile

on:
  push:
    branches:
      - agent/ast-004-post-merge-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/ast-004-post-merge-reconcile
          fetch-depth: 0

      - name: Reconcile AST-004 final evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:110]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = 'docs/FEATURE_CATALOG.md'
          replace_once(
              catalog,
              '| AST-004 | Precache and memory policy | P1 | IN PROGRESS | AST-002 | Issue #192 hardens the existing bounded LRU cache into a race-safe, observable near-future precache boundary with shared in-flight work, clear/forget invalidation, failure isolation, CI ownership guards, and focused regressions; implementation verification is pending. |',
              '| AST-004 | Precache and memory policy | P1 | VERIFIED | AST-002 | Issue #192 / PR #193 harden the bounded asset cache with shared same-ID in-flight operations, global/per-ID invalidation so clear/forget cannot be undone by late completion, bounded LRU/failure state, explicit near-future retry policy, immutable observability counters, safe eviction failures, and machine ownership gates that reject raw production `precacheImage` bypasses. Final PR head `61c5741ba8340e0baafb2d2cea9989137b25a279` passed Flutter CI #839 / run `31408977215`: AST-004 focused tests 14/14, validator regressions 6/6, full 320-test Flutter suite, 88.34% authored-source coverage, Debug APK and artifact security/upload; artifact #9071093253 is 80,633,602 bytes with SHA-256 `0e6da3e6d75212817f22c91592009e97532d838f4f395a4f4f1c9f488a59f5bb`. PR #193 squash-merged as `22239a6cdd7af3770a03a4b9a86e8d32d078a01b`; exact-main Flutter CI #840 / run `31409971405` repeated 320 tests, 88.34% coverage, Debug APK, artifact security and upload. Main artifact #9071436511 is 80,633,603 bytes with SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`. Asset admission remains 9 descriptors / 0 provenance / 0 runtime WebP, so fallback-safe runtime behavior is unchanged. |',
          )
          replace_once(
              catalog,
              '- `AST-004` Precache and memory policy — IN PROGRESS under issue #192 on `agent/ast-004-cache-policy`; TEST-008 is VERIFIED and no other primary workstream should start until AST-004 is reconciled.',
              '- None. `AST-004` is VERIFIED after its 100/100 checkpoint sprint and exact-main CI #840; start exactly one next primary workstream only after the recorded dependency-ready selection.',
          )
          replace_once(
              catalog,
              '- Finish AST-004 race-safety, observability, policy validation, full CI and reconciliation; if VERIFIED, run a fresh dependency-ready scan with PERF-001 newly unblocked.',
              '- `PERF-001` Frame performance budget — P0 and dependency-ready now that MOT-001 is IMPLEMENTED and AST-004 is VERIFIED. It is the selected next primary workstream and must be marked IN PROGRESS only when implementation begins; completing it unlocks TEST-009 device/API compatibility work.',
          )
          replace_once(
              catalog,
              '- `TEST-009` is not yet ready because its declared `PERF-001` dependency remains PLANNED; physical-device/API matrix work should follow performance-budget definition.',
              '- `TEST-009` remains dependency-blocked until selected next workstream `PERF-001` is VERIFIED; the device/API compatibility matrix should follow the performance-budget checkpoint.',
          )
          marker = '## Recently verified\n\n'
          p = Path(catalog)
          text = p.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('catalog Recently verified anchor missing or duplicated')
          recent = (
              '- `AST-004` Precache and memory policy — issue #192 / PR #193 complete the 100-checkpoint cache hardening sprint. Final PR head `61c5741ba8340e0baafb2d2cea9989137b25a279` passed Flutter CI #839 / run `31408977215` with 14/14 focused cache tests, 6/6 validator regressions, 320 Flutter tests, 88.34% authored-source coverage, Debug APK, artifact security and upload; artifact #9071093253 is 80,633,602 bytes with SHA-256 `0e6da3e6d75212817f22c91592009e97532d838f4f395a4f4f1c9f488a59f5bb`. PR #193 squash-merged as `22239a6cdd7af3770a03a4b9a86e8d32d078a01b`; exact-main Flutter CI #840 / run `31409971405` repeated all gates and uploaded artifact #9071436511 (80,633,603 bytes; SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`).\n'
          )
          p.write_text(text.replace(marker, marker + recent, 1), encoding='utf-8')

          status = 'docs/STATUS.md'
          replace_once(
              status,
              '| Primary feature | `AST-004` Precache and memory policy — IN PROGRESS under issue #192. |',
              '| Primary feature | None — `AST-004` Precache and memory policy is VERIFIED after 100/100 checkpoints; `PERF-001` is selected next but not started. |',
          )
          replace_once(
              status,
              '| Completed checkpoint | `TEST-008` coverage thresholds and flaky-test policy — VERIFIED and merged; PR #191 squash-merged as `87ab162c1fe1a73b962dd98370ac04aee7d15b90` after final-head Flutter CI #835, and exact-main Flutter CI #836 / run `31406357471` passed the full 310-test suite, 88.01% authored-source coverage, Debug APK, artifact security, and upload. |',
              '| Completed checkpoint | `AST-004` bounded asset precache and memory policy — VERIFIED; issue #192 / PR #193 completed 100/100 checkpoints, PR #193 squash-merged as `22239a6cdd7af3770a03a4b9a86e8d32d078a01b`, and exact-main Flutter CI #840 / run `31409971405` passed all gates with 320 tests and 88.34% authored-source coverage. |',
          )
          replace_once(
              status,
              '| Status | AST-004 is active on current main: harden the existing bounded asset cache against in-flight clear/forget races, deduplicate concurrent loads, add observable counters and machine CI ownership guards while preserving fallback-safe zero-binary asset behavior. |',
              '| Status | AST-004 is VERIFIED: same-ID precache work is shared, clear/forget invalidation is race-safe, LRU/failure state is bounded, observability is immutable, raw precache bypasses are CI-blocked, and descriptor-only fallback behavior remains intact. Exact-main artifact #9071436511 is 80,633,603 bytes with SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`. |',
          )
          replace_once(
              status,
              '| Previous checkpoint | `TEST-010` dashboard/catalog parser validation — VERIFIED and merged; exact-main Flutter CI #828 passed all gates before TEST-008. |',
              '| Previous checkpoint | `TEST-008` coverage thresholds and flaky-test policy — VERIFIED and merged; exact-main Flutter CI #836 passed 310 tests and 88.01% authored-source coverage before AST-004. |',
          )
          replace_once(
              status,
              '| Next recommended feature | Finish AST-004 normal-CI verification/reconciliation; when VERIFIED, run a fresh dependency-ready scan with P0 PERF-001 expected to become dependency-ready. |',
              '| Next recommended feature | `PERF-001` Frame performance budget — P0, now dependency-ready via MOT-001 + AST-004. Establish measurable frame targets and graceful fallback before TEST-009 device/API matrix work. |',
          )
          replace_once(
              status,
              '`TEST-009` also remains dependency-blocked while `PERF-001` is PLANNED.',
              '`TEST-009` remains dependency-blocked until selected next workstream `PERF-001` is VERIFIED.',
          )
          p = Path(status)
          text = p.read_text(encoding='utf-8')
          header = '## AST-004 bounded asset precache and memory policy — 2026-08-10\n\n'
          start = text.find(header)
          if start < 0:
              raise SystemExit('STATUS AST-004 section missing')
          next_header = text.find('\n## TEST-008 coverage thresholds and flaky-test policy — 2026-08-10\n', start)
          if next_header < 0:
              raise SystemExit('STATUS TEST-008 section boundary missing')
          final_section = '''## AST-004 bounded asset precache and memory policy — 2026-08-10

- Issue #192 / PR #193 complete the 100-checkpoint AST-004 sprint; issue #192 is closed completed.
- `GameAssetCachePolicy` shares concurrent same-ID load operations, permits independent different-ID loads, and uses global/per-ID generations so `clear()` or `forget(id)` cannot be reversed by stale async completion.
- Completed cache state and failure history remain bounded; cache hits update LRU priority without reload; near-future work is sequential/deduplicated/budget-clamped and skips known failures unless retry is explicit.
- Immutable snapshots expose hit/miss, joined request, successful load, load failure, eviction, stale completion, and eviction-failure counters; reset affects statistics only.
- `tool/verify_asset_cache_policy.py` mechanically blocks raw production `precacheImage` bypasses and required CI/test drift; its regression suite passes 6/6. Focused cache widget coverage passes 14/14.
- Final clean PR head `61c5741ba8340e0baafb2d2cea9989137b25a279` passed Flutter CI #839 / run `31408977215`: 320 Flutter tests, 88.34% authored-source coverage, Debug APK, artifact security and upload. Artifact #9071093253 is 80,633,602 bytes with SHA-256 `0e6da3e6d75212817f22c91592009e97532d838f4f395a4f4f1c9f488a59f5bb`.
- PR #193 squash-merged as `22239a6cdd7af3770a03a4b9a86e8d32d078a01b`. Exact-main Flutter CI #840 / run `31409971405` passed all 51 gates, the full 320-test suite, 88.34% coverage, Debug APK, artifact security and upload; main artifact #9071436511 is 80,633,603 bytes with SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`.
- Asset admission remains deliberately unchanged at 9 descriptors / 0 provenance records / 0 runtime WebP files; missing art remains fallback-safe. No gameplay, economy, persistence, ads, privacy runtime, production identifiers, signing, packages, or binary art changed.
- Fresh dependency scan selects `PERF-001` as the next P0 workstream; AST-004 verification also satisfies the asset-cache dependency for PERF-002/AST-010.
'''
          p.write_text(text[:start] + final_section + text[next_header:], encoding='utf-8')

          work = Path('docs/work/AST-004.md')
          text = work.read_text(encoding='utf-8')
          text = text.replace('- State: IN PROGRESS', '- State: VERIFIED', 1)
          for number in range(97, 101):
              old = f'- [ ] T{number:03d} '
              new = f'- [x] T{number:03d} '
              if old not in text:
                  raise SystemExit(f'AST-004 checkpoint T{number:03d} missing or already completed')
              text = text.replace(old, new, 1)
          if '## Final verification and merge evidence' not in text:
              text += '''
## Final verification and merge evidence

- Final PR head `61c5741ba8340e0baafb2d2cea9989137b25a279` passed Flutter CI #839 / run `31408977215`: AST-004 widget suite 14/14, machine validator regressions 6/6, full Flutter suite 320/320, authored-source coverage 5,650 / 6,396 = 88.34%, Debug APK build, artifact security and upload. Artifact #9071093253 is 80,633,602 bytes with SHA-256 `0e6da3e6d75212817f22c91592009e97532d838f4f395a4f4f1c9f488a59f5bb`.
- PR #193 squash-merged to `main` as `22239a6cdd7af3770a03a4b9a86e8d32d078a01b`; issue #192 closed completed.
- Exact-main Flutter CI #840 / run `31409971405` passed every gate on the merge SHA, including AST-004 policy/tests, TEST-007/008/010, privacy/security/dependency contracts, Analyze, 320 Flutter tests, 88.34% coverage, Debug APK, artifact security and upload.
- Exact-main artifact #9071436511 is 80,633,603 bytes with SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`.
- AST-004 is VERIFIED at 100/100 checkpoints. Fresh dependency scan selects P0 `PERF-001` Frame performance budget as the next primary workstream; it is selected but not yet started.
'''
          work.write_text(text, encoding='utf-8')
          PY

      - name: Validate final tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/verify_asset_cache_policy.py
          python3 tool/test_asset_cache_policy.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          python3 tool/verify_test_quality.py
          python3 tool/test_test_quality.py
          git diff --check

      - name: Commit post-merge reconciliation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ast004_post_merge_reconcile.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/AST-004.md .github/workflows/ast004_post_merge_reconcile.yml
          git diff --cached --check
          git commit -m "AST-004: reconcile final verified evidence"
          git push origin HEAD:agent/ast-004-post-merge-reconcile
