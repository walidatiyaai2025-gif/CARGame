name: AST-007 Batch 01 Generate Once

on:
  push:
    branches:
      - agent/ast-007-batch01-procedural-art
    paths:
      - 'tool/generate_ast007_cargo_batch01.py'
      - '.github/workflows/ast007_batch01_generate_once.yml'
  pull_request:
    paths:
      - 'tool/generate_ast007_cargo_batch01.py'
      - '.github/workflows/ast007_batch01_generate_once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ast007-batch01-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: agent/ast-007-batch01-procedural-art
          fetch-depth: 0

      - name: Install deterministic image dependency
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate first 12 cargo WebP assets and provenance
        run: python3 tool/generate_ast007_cargo_batch01.py

      - name: Verify generated image contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          paths = sorted(Path('assets/3d/runtime/cargo').rglob('*.webp'))
          if len(paths) != 12:
              raise SystemExit(f'expected exactly 12 runtime cargo WebP files, found {len(paths)}')
          for path in paths:
              with Image.open(path) as image:
                  if image.size != (384, 384):
                      raise SystemExit(f'{path}: expected 384x384, got {image.size}')
                  if image.format != 'WEBP':
                      raise SystemExit(f'{path}: expected WebP, got {image.format}')
          print('AST-007 batch image contract: 12/12 PASS')
          PY

      - name: Commit generated source-controlled evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/3d/runtime/cargo \
            assets/3d/provenance/catalog.json \
            pubspec.yaml \
            docs/work/AST-007-batch01.md
          if git diff --cached --quiet; then
            echo 'Generated batch is already current.'
            exit 0
          fi
          git commit -m 'AST-007 admit first 12 original cargo WebP assets'
          git push origin HEAD:agent/ast-007-batch01-procedural-art
