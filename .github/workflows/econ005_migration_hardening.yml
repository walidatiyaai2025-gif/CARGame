name: ECON005 Migration Hardening

on:
  push:
    branches:
      - agent/econ-005-versioned-economy

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/econ-005-versioned-economy
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply migration ordering fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/core/storage/progress_store.dart')
          text = path.read_text()
          old = '''  Future<void> load() async {
              await _ensureRewardLedgerLoaded();
              await _recoverPendingRewardTransaction();
              await _recoverPendingShopPurchase();
              await _reconcileEconomyVersion();
          '''
          new = '''  Future<void> load() async {
              await _reconcileEconomyVersion();
              await _ensureRewardLedgerLoaded();
              await _recoverPendingRewardTransaction();
              await _recoverPendingShopPurchase();
          '''
          if old not in text:
              raise SystemExit('load ordering anchor missing')
          text = text.replace(old, new, 1)
          old_default = '''    hearts = (await _prefs.getInt(_heartsKey) ?? maxHearts).clamp(
                0,
                economy.maxHearts,
              );'''
          new_default = '''    hearts = (await _prefs.getInt(_heartsKey) ?? economy.maxHearts).clamp(
                0,
                economy.maxHearts,
              );'''
          if old_default not in text:
              raise SystemExit('heart default anchor missing')
          text = text.replace(old_default, new_default, 1)
          path.write_text(text)
          PY
          dart format \
            lib/core/storage/progress_store.dart \
            test/core/economy/economy_migration_test.dart
          flutter pub get
          flutter test \
            test/core/economy/economy_migration_test.dart \
            test/core/economy/economy_config_test.dart \
            test/core/storage/progress_store_test.dart \
            test/core/storage/shop_purchase_recovery_test.dart \
            test/core/storage/reward_transaction_recovery_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check
          git rm .github/workflows/econ005_migration_hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/core/storage/progress_store.dart test/core/economy/economy_migration_test.dart
          git commit -m 'fix: reject newer economy saves before recovery'
          git push origin HEAD:agent/econ-005-versioned-economy