name: ECON005 Semantics Apply

on:
  push:
    branches:
      - agent/econ-005-versioned-economy

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/econ-005-versioned-economy
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply and verify semantics patch
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/econ005_semantics_fix.py
          dart format lib/features/game/game_screen.dart
          flutter pub get
          flutter test test/features/game/game_screen_semantics_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check
          git rm tools/econ005_semantics_fix.py .github/workflows/econ005_semantics_apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/game/game_screen.dart
          git commit -m 'fix: preserve rewarded continue semantics'
          git push origin HEAD:agent/econ-005-versioned-economy