name: ENG-006 Reconcile

on:
  push:
    branches:
      - agent/eng-006-reconcile
    paths:
      - .github/workflows/eng006_reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eng-006-reconcile
          fetch-depth: 0
      - name: Reconcile ENG-006 verification evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/eng006_reconcile.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/ENG-006.md
          git rm .github/scripts/eng006_reconcile.py .github/workflows/eng006_reconcile.yml
          git commit -m 'docs: reconcile ENG-006 verification evidence'
          git push origin HEAD:agent/eng-006-reconcile
