name: AST-004 Final Reconcile

on:
  push:
    branches:
      - agent/ast-004-post-merge-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/ast-004-post-merge-reconcile
          fetch-depth: 0

      - name: Merge latest main and add promotion evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

          python3 - <<'PY'
          from pathlib import Path

          PROMO = 'Latest-verified promotion run `31410745473` succeeded and committed `4379937b51309644a11bffc43d7375888e258823`; the QA release APK is 55,878,023 bytes with SHA-256 `df60e5bc0471cdf99ab66a3e01987cc7948fc52ba353da647070b29bcd137a72`, ephemeral CI signing, ads disabled, and is not production/Play Store signed.'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = 'docs/FEATURE_CATALOG.md'
          old = 'Main artifact #9071436511 is 80,633,603 bytes with SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`. Asset admission remains 9 descriptors / 0 provenance / 0 runtime WebP, so fallback-safe runtime behavior is unchanged. |'
          new = 'Main artifact #9071436511 is 80,633,603 bytes with artifact ZIP SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`. ' + PROMO + ' Asset admission remains 9 descriptors / 0 provenance / 0 runtime WebP, so fallback-safe runtime behavior is unchanged. |'
          replace_once(catalog, old, new)

          old = 'exact-main Flutter CI #840 / run `31409971405` repeated all gates and uploaded artifact #9071436511 (80,633,603 bytes; SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`).'
          new = 'exact-main Flutter CI #840 / run `31409971405` repeated all gates and uploaded artifact #9071436511 (80,633,603 bytes; artifact ZIP SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`). ' + PROMO
          replace_once(catalog, old, new)

          status = 'docs/STATUS.md'
          old = '| Status | AST-004 is VERIFIED: same-ID precache work is shared, clear/forget invalidation is race-safe, LRU/failure state is bounded, observability is immutable, raw precache bypasses are CI-blocked, and descriptor-only fallback behavior remains intact. Exact-main artifact #9071436511 is 80,633,603 bytes with SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`. |'
          new = '| Status | AST-004 is VERIFIED: same-ID precache work is shared, clear/forget invalidation is race-safe, LRU/failure state is bounded, observability is immutable, raw precache bypasses are CI-blocked, and descriptor-only fallback behavior remains intact. Exact-main artifact #9071436511 is 80,633,603 bytes with artifact ZIP SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`; latest-verified promotion #28 / run `31410745473` produced the 55,878,023-byte QA APK with SHA-256 `df60e5bc0471cdf99ab66a3e01987cc7948fc52ba353da647070b29bcd137a72`. |'
          replace_once(status, old, new)

          old = '- PR #193 squash-merged as `22239a6cdd7af3770a03a4b9a86e8d32d078a01b`. Exact-main Flutter CI #840 / run `31409971405` passed all 51 gates, the full 320-test suite, 88.34% coverage, Debug APK, artifact security and upload; main artifact #9071436511 is 80,633,603 bytes with SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`.'
          new = '- PR #193 squash-merged as `22239a6cdd7af3770a03a4b9a86e8d32d078a01b`. Exact-main Flutter CI #840 / run `31409971405` passed all 51 gates, the full 320-test suite, 88.34% coverage, Debug APK, artifact security and upload; main artifact #9071436511 is 80,633,603 bytes with artifact ZIP SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`.\n- ' + PROMO
          replace_once(status, old, new)

          work = 'docs/work/AST-004.md'
          replace_once(work, '- Full normal-PR CI evidence remains required for T097-T100.', '- Final normal-PR and exact-main CI evidence fulfilled T097-T100; latest-verified QA promotion evidence is recorded below.')
          old = '- Exact-main artifact #9071436511 is 80,633,603 bytes with SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`.'
          new = '- Exact-main artifact #9071436511 is 80,633,603 bytes with artifact ZIP SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`.\n- ' + PROMO
          replace_once(work, old, new)
          PY

      - name: Validate final AST-004 reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/verify_asset_cache_policy.py
          python3 tool/test_asset_cache_policy.py
          python3 tool/verify_test_quality.py
          python3 tool/test_test_quality.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          git diff --check

      - name: Commit final evidence
        shell: bash
        run: |
          set -euo pipefail
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/AST-004.md
          git diff --cached --check
          git commit -m "AST-004: record final promotion evidence [skip ci]"
          git push origin HEAD:agent/ast-004-post-merge-reconcile
