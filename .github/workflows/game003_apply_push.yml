name: GAME-003 Apply Push

on:
  push:
    branches: [agent/game-003-gameplay-visual-refresh]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/game-003-gameplay-visual-refresh
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.8'
          cache: true
      - name: Wire premium operations deck
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/game/game_screen.dart')
          text = path.read_text()

          if "../../core/motion/ambient_motion_background.dart" not in text:
              text = text.replace(
                  "import '../../core/economy/economy_config.dart';\n",
                  "import '../../core/economy/economy_config.dart';\nimport '../../core/motion/ambient_motion_background.dart';\n",
                  1,
              )
          if "../../core/theme/three_d_game_icon.dart" not in text:
              text = text.replace(
                  "import '../../core/theme/game_skin.dart';\n",
                  "import '../../core/theme/game_skin.dart';\nimport '../../core/theme/three_d_game_icon.dart';\n",
                  1,
              )
          if "'gameplay_operations_deck.dart'" not in text:
              text = text.replace(
                  "import 'city_catalog.dart';\n",
                  "import 'city_catalog.dart';\nimport 'gameplay_operations_deck.dart';\n",
                  1,
              )

          state_start = text.index('class _GameScreenState')
          build_start = text.index('  @override\n  Widget build(BuildContext context) {', state_start)
          result_marker = text.index('class _ResultChip', build_start)

          new_build = r'''  @override
          Widget build(BuildContext context) {
            final skin = gameSkinById(widget.store.selectedTheme);
            final world = gameWorlds[widget.level.world - 1];
            final ar = Localizations.localeOf(context).languageCode == 'ar';
            final flight = _flight;
            final canGoBack = Navigator.of(context).canPop();

            return PopScope(
              canPop: !_resultVisible && !_resolving,
              child: Scaffold(
                backgroundColor: const Color(0xFFF4F7FB),
                body: Stack(
                  key: _motionLayerKey,
                  children: [
                    Positioned.fill(
                      child: AmbientMotionBackground(
                        startColor: world.startColor,
                        endColor: world.endColor,
                      ),
                    ),
                    Positioned.fill(
                      child: IgnorePointer(
                        child: DecoratedBox(
                          decoration: BoxDecoration(
                            gradient: LinearGradient(
                              begin: Alignment.topCenter,
                              end: Alignment.bottomCenter,
                              colors: [
                                const Color(0xFF091321).withValues(alpha: .82),
                                const Color(0xFFF4F7FB).withValues(alpha: .82),
                                const Color(0xFFF4F7FB).withValues(alpha: .97),
                              ],
                              stops: const [0, .31, 1],
                            ),
                          ),
                        ),
                      ),
                    ),
                    SafeArea(
                      child: LayoutBuilder(
                        builder: (context, constraints) {
                          final compact =
                              constraints.maxHeight < 690 ||
                              constraints.maxWidth < 370;
                          final horizontal = compact ? 9.0 : 14.0;
                          return Padding(
                            padding: EdgeInsets.fromLTRB(
                              horizontal,
                              compact ? 6 : 9,
                              horizontal,
                              compact ? 8 : 12,
                            ),
                            child: Column(
                              children: [
                                GameplayCommandBar(
                                  cityName: widget.level.cityName,
                                  worldName: world.name,
                                  levelNumber: widget.level.number,
                                  difficulty: widget.level.difficulty,
                                  compact: compact,
                                  isArabic: ar,
                                  onBack:
                                      !canGoBack || _resultVisible || _resolving
                                      ? null
                                      : () => Navigator.maybePop(context),
                                  onRestart:
                                      _finished || _resultVisible || _resolving
                                      ? null
                                      : () => setState(() => _reset()),
                                ),
                                SizedBox(height: compact ? 6 : 9),
                                GameplayStatusPanel(
                                  moves: _moves,
                                  matched: _matchedCount,
                                  total: widget.level.items.length,
                                  progress: _progress,
                                  combo: _combo,
                                  hearts: widget.store.hearts,
                                  skin: skin,
                                  shieldActive: _shieldActive,
                                  compact: compact,
                                  isArabic: ar,
                                ),
                                SizedBox(height: compact ? 5 : 8),
                                GameplayMissionBanner(
                                  isBoss: widget.level.isBossCity,
                                  isArabic: ar,
                                  selectedCargo: _selected,
                                  resolving: _resolving,
                                  accent: skin.accent,
                                  primary: skin.primary,
                                  compact: compact,
                                ),
                                SizedBox(height: compact ? 5 : 8),
                                Expanded(
                                  flex: 3,
                                  child: GameplayCargoBoard(
                                    items: _remaining,
                                    selectedIndex: _selectedIndex,
                                    travellingIndex: _resolving
                                        ? _selectedIndex
                                        : null,
                                    onTap: _choosePackage,
                                    compact: compact,
                                    isArabic: ar,
                                    accent: skin.primary,
                                  ),
                                ),
                                SizedBox(height: compact ? 6 : 9),
                                Expanded(
                                  flex: 2,
                                  child: GameplayWarehouseBoard(
                                    warehouses: _warehouses,
                                    activeWarehouseId: flight?.warehouse.id,
                                    activeCargoId: flight?.item.id,
                                    onTap: _chooseWarehouse,
                                    compact: compact,
                                    isArabic: ar,
                                    accent: skin.primary,
                                  ),
                                ),
                                SizedBox(height: compact ? 6 : 9),
                                GameplayBoosterDock(
                                  compact: compact,
                                  children: [
                                    GameplayBoosterButton(
                                      type: ThreeDIconType.hint,
                                      label: ar ? 'تلميح' : 'HINT',
                                      count:
                                          widget.store.freeHints + _preparedHints,
                                      active: _selected != null,
                                      accent: const Color(0xFFFFB300),
                                      compact: compact,
                                      onPressed:
                                          _selected == null ||
                                              _finished ||
                                              _resolving
                                          ? null
                                          : _useHint,
                                    ),
                                    GameplayBoosterButton(
                                      type: ThreeDIconType.extraMoves,
                                      label: ar ? 'حركات' : 'MOVES',
                                      count: widget.store.extraMovesBoosters,
                                      accent: const Color(0xFF2D6CDF),
                                      compact: compact,
                                      onPressed: _finished || _resolving
                                          ? null
                                          : _useExtraMoves,
                                    ),
                                    GameplayBoosterButton(
                                      type: ThreeDIconType.shield,
                                      label: ar ? 'درع' : 'SHIELD',
                                      count: widget.store.comboShields,
                                      active: _shieldActive,
                                      accent: const Color(0xFF7B3FF2),
                                      compact: compact,
                                      onPressed: _finished || _resolving
                                          ? null
                                          : _useComboShield,
                                    ),
                                  ],
                                ),
                              ],
                            ),
                          );
                        },
                      ),
                    ),
                    if (flight != null)
                      GameTravelMotion(
                        key: ValueKey(flight.id),
                        start: flight.start,
                        end: flight.end,
                        size: 58,
                        onCompleted: () => unawaited(_completeFlight(flight)),
                        child: GameplayFlightCargo(item: flight.item),
                      ),
                    if (_feedbackKind case final feedbackKind?)
                      GameActionFeedback(
                        key: ValueKey(_feedbackSequence),
                        kind: feedbackKind,
                        combo: _feedbackCombo,
                        semanticLabel:
                            feedbackKind == GameActionFeedbackKind.correct
                            ? (ar
                                  ? 'وضع صحيح، سلسلة $_feedbackCombo'
                                  : 'Correct placement, combo $_feedbackCombo')
                            : (ar ? 'وضع غير صحيح' : 'Wrong placement'),
                        hapticsEnabled: widget.hapticsEnabled,
                        onSound: widget.soundEnabled
                            ? widget.onPlacementSound
                            : null,
                        onCompleted: () =>
                            _completeActionFeedback(_feedbackSequence),
                      ),
                  ],
                ),
              ),
            );
          }
          }

          '''
          text = text[:build_start] + new_build + text[result_marker:]
          path.write_text(text)
          PY

          dart format lib/features/game/game_screen.dart lib/features/game/gameplay_operations_deck.dart test/features/game/gameplay_operations_deck_visual_test.dart
          git diff --check
          flutter test test/features/game/gameplay_operations_deck_visual_test.dart test/features/game/game_screen_responsive_test.dart test/features/game/game_screen_motion_test.dart test/features/game/game_result_responsive_test.dart test/features/game/game_result_navigation_guard_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/game/game_screen.dart lib/features/game/gameplay_operations_deck.dart test/features/game/gameplay_operations_deck_visual_test.dart
          git rm .github/workflows/game003_visual_apply.yml .github/workflows/game003_apply_push.yml
          git commit -m 'feat: refresh GAME-003 gameplay operations deck'
          git push origin HEAD:agent/game-003-gameplay-visual-refresh
