name: LEVEL002 Generator Integration

on:
  push:
    branches:
      - agent/level-002-quantitative-difficulty-curve

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate difficulty policy
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/game/level_data.dart')
          text = path.read_text(encoding='utf-8')

          old_import = "import 'package:flutter/material.dart';\n"
          new_import = "import 'package:flutter/material.dart';\n\nimport 'level_difficulty_policy.dart';\n"
          if text.count(old_import) != 1:
              raise SystemExit('expected Flutter import exactly once')
          text = text.replace(old_import, new_import)

          old = "  final difficulty = min(10, 1 + ((number - 1) ~/ 15));\n  final safetyMoves = max(2, 6 - world);\n  final moves = items.length + safetyMoves + random.nextInt(3);"
          new = "  final difficulty = LevelDifficultyPolicy.declaredDifficultyForLevel(number);\n  final safetyMoves = LevelDifficultyPolicy.safetyMoveBaseForLevel(\n    levelNumber: number,\n    world: world,\n  );\n  final moves = items.length + safetyMoves + random.nextInt(3);"
          if text.count(old) != 1:
              raise SystemExit('expected balance formula exactly once')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

      - name: Commit integration and remove helper
        shell: bash
        run: |
          rm .github/workflows/level002_generator_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate LEVEL-002 balance policy"
          git push origin HEAD:${GITHUB_REF_NAME}
