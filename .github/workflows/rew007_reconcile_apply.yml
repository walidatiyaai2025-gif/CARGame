name: REW007 Apply Reconciliation

on:
  push:
    branches:
      - agent/rew-007-reconcile

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rew-007-reconcile
      - name: Apply tracking update
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rew007_reconcile.py
          git diff --check
          git rm tools/rew007_reconcile.py .github/workflows/rew007_reconcile_apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/REW-007.md
          git commit -m 'docs: reconcile REW-007 verification'
          git push origin HEAD:agent/rew-007-reconcile