name: REW007 Reconciliation Apply

on:
  push:
    branches:
      - agent/rew-007-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rew-007-reconciliation
      - name: Apply verified REW-007 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          catalog = Path('docs/FEATURE_CATALOG.md')
          text = catalog.read_text()
          old = '| REW-007 | Reward transaction ledger and reconciliation | P0 | IN PROGRESS | ENG-008, REW-001 | Issue #119 / PR #120 add stable reason/idempotency keys, a bounded completed ledger, an absolute-state pending journal, and deterministic interruption recovery for level, daily reward, and daily mission grants; full CI/build verification is in progress. |'
          new = '| REW-007 | Reward transaction ledger and reconciliation | P0 | VERIFIED | ENG-008, REW-001 | Issue #119 / PR #120 add stable gameplay/daily/mission/heart reward idempotency keys, a bounded completed ledger, a validated absolute-state pending journal, deterministic interruption recovery, durable-ledger-before-memory ordering, and best-effort stale-journal cleanup while preserving legacy saves. PR #120 squash-merged as `b915d95b938d459133a9a8b120f38815178b1852`; Flutter CI #623 passed formatting, Analyze, the full Flutter suite, Debug APK build and artifact upload. Debug artifact #9032765167 is 80,530,583 bytes with SHA-256 `534037a3cdd4fe75d54a53df6452f8188d4c81cdcc859040a51725315f20070b`. |'
          if text.count(old) != 1:
              raise SystemExit('REW-007 catalog row did not match exactly once')
          catalog.write_text(text.replace(old, new, 1))

          status = Path('docs/STATUS.md')
          text = status.read_text()
          replacements = [
              (
                  '| Primary feature | `REW-007` IN PROGRESS — issue #119 / draft PR #120 on `agent/rew-007-reward-ledger`. |',
                  '| Primary feature | `REW-007` VERIFIED — implementation PR #120 merged; reconciliation evidence is being finalized on `agent/rew-007-reconciliation`. |',
              ),
              (
                  '| Status | `REW-007` implementation adds an interruption-safe absolute-state reward journal, bounded completed-idempotency ledger, deterministic recovery before load, and stable gameplay-attempt IDs; CI/build verification remains before VERIFIED. |',
                  '| Status | `REW-007` VERIFIED: level, daily reward, daily mission, and explicit heart grants use interruption-safe absolute-state journaling/idempotency; Flutter CI #623 and Debug APK artifact #9032765167 are green evidence. |',
              ),
              (
                  '| Next recommended feature | Complete `REW-007` CI/build verification and tracking reconciliation; then select the next unblocked RC P0 from the catalog. |',
                  '| Next recommended feature | `ECON-005` versioned economy configuration and balance rules — its `REW-007` dependency is now VERIFIED and it continues the RC save/economy/reward integrity audit. |',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'STATUS replacement did not match exactly once: {old}')
              text = text.replace(old, new, 1)

          marker = '## ADS-002 release ad configuration verification — 2026-08-09'
          section = '''## REW-007 reward transaction reconciliation — 2026-08-09

          - Issue #119 / PR #120 replace multi-key reward persistence risk with a validated absolute-state pending journal plus a bounded completed idempotency ledger.
          - Gameplay completion uses a stable per-attempt transaction ID; daily reward and daily mission claims use stable per-day keys; explicit heart grants are journaled and can clear the refill timestamp atomically when hearts reach the cap.
          - Recovery runs before normal state load, malformed journals are discarded safely, completed IDs are persisted before mutating the in-memory ledger, and stale pending cleanup is best-effort after the durable ledger is authoritative.
          - Legacy saves remain compatible because absent reward-ledger keys default to empty state; existing shop transaction recovery remains unchanged.
          - Flutter CI #623 / run `31295126718` passed secret/privacy/security gates, formatting, whitespace, Analyze, focused checks, the full Flutter test suite, Debug APK build, and artifact upload on head `2df14361ec829ae00739aac2e72e6b43cdc0a7e4`.
          - Debug artifact #9032765167 is 80,530,583 bytes with SHA-256 `534037a3cdd4fe75d54a53df6452f8188d4c81cdcc859040a51725315f20070b`.
          - PR #120 squash-merged to `main` as `b915d95b938d459133a9a8b120f38815178b1852`; `REW-007` is VERIFIED.
          - Next recommended RC P0: `ECON-005` versioned economy configuration and balance rules.

          '''
          if marker not in text:
              raise SystemExit('STATUS insertion marker missing')
          if '## REW-007 reward transaction reconciliation — 2026-08-09' not in text:
              text = text.replace(marker, section + marker, 1)
          status.write_text(text)

          work = Path('docs/work/REW-007.md')
          text = work.read_text()
          if text.count('Status: IN PROGRESS  ') != 1:
              raise SystemExit('REW-007 work status did not match')
          text = text.replace('Status: IN PROGRESS  ', 'Status: VERIFIED  ', 1)
          if '## Final verification evidence' not in text:
              text = text.rstrip() + '''

          ## Final verification evidence

          - Implementation PR: #120; squash merge: `b915d95b938d459133a9a8b120f38815178b1852`.
          - Final implementation head: `2df14361ec829ae00739aac2e72e6b43cdc0a7e4`.
          - Flutter CI #623 / run `31295126718`: formatting, whitespace, Analyze, focused checks, full Flutter suite, Debug APK build, and artifact upload all passed.
          - Debug artifact #9032765167: 80,530,583 bytes; SHA-256 `534037a3cdd4fe75d54a53df6452f8188d4c81cdcc859040a51725315f20070b`.
          - Acceptance covers replay no-op, interruption recovery, corrupt-journal handling, legacy saves, stable gameplay/daily/mission IDs, heart grants, and durable completed-ledger ordering.
          '''.rstrip() + '\n'
          work.write_text(text)
          PY
          git diff --check
          git rm .github/workflows/rew007_reconcile_apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/REW-007.md
          git commit -m 'docs: reconcile REW-007 verified evidence'
          git push origin HEAD:agent/rew-007-reconciliation
