name: ECON005 Integration

on:
  push:
    branches:
      - agent/econ-005-versioned-economy

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/econ-005-versioned-economy
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply ECON-005 runtime integration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/econ005_integrate.py
          dart format \
            lib/core/economy/economy_config.dart \
            lib/core/storage/progress_store.dart \
            lib/features/game/game_screen.dart \
            lib/features/shop/shop_screen.dart \
            test/core/economy/economy_config_test.dart \
            test/core/storage/progress_store_test.dart \
            test/core/storage/shop_purchase_recovery_test.dart
          flutter pub get
          flutter test \
            test/core/economy/economy_config_test.dart \
            test/core/storage/progress_store_test.dart \
            test/core/storage/shop_purchase_recovery_test.dart \
            test/core/storage/reward_transaction_recovery_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check
          git rm tools/econ005_integrate.py .github/workflows/econ005_integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/core/economy/economy_config.dart \
            lib/core/storage/progress_store.dart \
            lib/features/game/game_screen.dart \
            lib/features/shop/shop_screen.dart \
            test/core/economy/economy_config_test.dart \
            test/core/storage/progress_store_test.dart \
            test/core/storage/shop_purchase_recovery_test.dart \
            docs/FEATURE_CATALOG.md \
            docs/STATUS.md \
            docs/work/ECON-005.md
          git commit -m 'feat: integrate versioned economy config'
          git push origin HEAD:agent/econ-005-versioned-economy