name: Temporary game navigator test formatter

on:
  push:
    branches:
      - agent/fix-game-navigator-test-format

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-game-navigator-test-format
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Format file
        run: dart format test/core/navigation/game_navigator_test.dart

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Formatter produced no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/core/navigation/game_navigator_test.dart
          git commit -m "style(test): format game navigator coverage"
          git push origin HEAD:agent/fix-game-navigator-test-format
