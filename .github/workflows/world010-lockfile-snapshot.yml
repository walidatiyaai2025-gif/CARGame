name: WORLD-010 Lockfile Snapshot

on:
  push:
    branches:
      - agent/world-010-ai-continent-map
    paths:
      - pubspec.yaml
      - .github/workflows/world010-lockfile-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: world010-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1
