name: TEST-008 Bootstrap Reconcile

on:
  push:
    branches:
      - agent/test-008-coverage-flaky-policy

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/test-008-coverage-flaky-policy
          fetch-depth: 0

      - name: Patch TEST-008 tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}: {old[:90]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'docs/FEATURE_CATALOG.md',
              '| TEST-008 | Coverage thresholds and flaky-test policy | P1 | PLANNED | ENG-007 | Coverage targets, retries, quarantine rules, and failure ownership are enforced. |',
              '| TEST-008 | Coverage thresholds and flaky-test policy | P1 | IN PROGRESS | ENG-007 | Issue #190 adds a versioned coverage/flaky-test policy, LCOV validator, focused regressions, zero blanket retries, bounded owned quarantines, and CI threshold enforcement; full PR CI evidence is pending. |',
          )
          replace_once(
              'docs/FEATURE_CATALOG.md',
              '- None. TEST-010 is VERIFIED; select exactly one next workstream only after a fresh dependency-ready scan.',
              '- `TEST-008` Coverage thresholds and flaky-test policy — IN PROGRESS under issue #190 on `agent/test-008-coverage-flaky-policy`; no other primary workstream should start until this checkpoint is reconciled.',
          )
          replace_once(
              'docs/FEATURE_CATALOG.md',
              '- Run the catalog dependency-ready scan and select exactly one next primary workstream; preserve TEST-007, TEST-010, and latest-verified-APK gates.',
              '- Complete TEST-008 CI verification and reconciliation, then run a fresh dependency-ready scan; preserve TEST-007, TEST-010, and latest-verified-APK gates.',
          )

          replace_once(
              'docs/STATUS.md',
              '| Primary feature | None — TEST-010 Dashboard/catalog parser validation is VERIFIED; run the dependency-ready scan before starting the next single primary workstream. |',
              '| Primary feature | `TEST-008` Coverage thresholds and flaky-test policy — IN PROGRESS under issue #190. |',
          )
          replace_once(
              'docs/STATUS.md',
              '| Status | TEST-010 is VERIFIED on main. Main debug artifact #9061890276 is 80,633,607 bytes (SHA-256 `a2684e4697cf2e153ee75f471cc1bfeaaf0feb15638e43a788984c2bc585b173`); latest-verified promotion run `31386487136` produced and committed the release-mode QA APK (55,878,023 bytes; SHA-256 `7b24570855c3e3f48007f53eac9770cde3a6a9fe0de519abff35fcb36925383f`) with ephemeral CI signing and ads disabled. No game runtime behavior changed. |',
              '| Status | TEST-008 implementation is active: repository-owned coverage/flaky policy, LCOV validation, focused regressions, and CI wiring are being added without changing game runtime behavior. TEST-007 and TEST-010 remain protected gates. |',
          )
          replace_once(
              'docs/STATUS.md',
              '| Next recommended feature | Run the catalog dependency-ready scan and select exactly one next primary workstream; preserve the verified TEST-007 and TEST-010 CI gates. |',
              '| Next recommended feature | Finish TEST-008 normal-CI verification/reconciliation, then run a fresh dependency-ready scan before selecting the next single primary workstream. |',
          )
          status = Path('docs/STATUS.md')
          text = status.read_text(encoding='utf-8')
          marker = '## TEST-010 dashboard/catalog parser validation — 2026-08-10\n'
          if text.count(marker) != 1:
              raise SystemExit('STATUS TEST-010 section anchor missing or duplicated')
          section = (
              '## TEST-008 coverage thresholds and flaky-test policy — 2026-08-10\n\n'
              '- Issue #190 / branch `agent/test-008-coverage-flaky-policy` are the single active primary workstream after TEST-010.\n'
              '- `tool/test_quality_policy.json` defines a 35% enforced repository line-coverage floor, 60% improvement target, zero blanket retries, at most one temporary quarantine retry, a 14-day quarantine ceiling, and currently zero active quarantines.\n'
              '- `tool/verify_test_quality.py` validates policy shape, quarantine ownership/issue/reason/expiry, preserved TEST-007/TEST-010 workflow anchors, LCOV structure, generated-localization exclusion, and the enforced line-coverage floor.\n'
              '- `tool/test_test_quality.py` contains 10 focused policy/LCOV/workflow regressions; local execution passed 10/10 before CI wiring.\n'
              '- Normal Flutter CI runs policy/regression validation before package restore, generates LCOV from the full suite, and enforces the threshold before Debug APK packaging.\n'
              '- No gameplay, economy, persistence, navigation, ads, privacy, signing, package, or asset behavior is intentionally changed.\n\n'
          )
          status.write_text(text.replace(marker, section + marker, 1), encoding='utf-8')

          work = Path('docs/work/TEST-008.md')
          text = work.read_text(encoding='utf-8')
          text = text.replace('- [ ] Wire policy validation into normal Flutter CI before package restore.', '- [x] Wire policy validation into normal Flutter CI before package restore.')
          text = text.replace('- [ ] Generate LCOV from the full Flutter suite in CI.', '- [x] Generate LCOV from the full Flutter suite in CI.')
          text = text.replace('- [ ] Enforce the LCOV threshold after the full suite.', '- [x] Enforce the LCOV threshold after the full suite.')
          text = text.replace('- [ ] Preserve TEST-007 and TEST-010 blocking gates.', '- [x] Preserve TEST-007 and TEST-010 blocking gates.')
          work.write_text(text, encoding='utf-8')
          PY

      - name: Validate TEST-008 tracking and CI
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/test_test_quality.py
          python3 tool/verify_test_quality.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          git diff --check

      - name: Commit tracking reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/TEST-008.md
          git diff --cached --check
          git commit -m "TEST-008: mark quality gate in progress"
          git push origin HEAD:agent/test-008-coverage-flaky-policy
