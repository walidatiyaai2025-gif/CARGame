name: Temporary TEST-004 tracking patch

on:
  push:
    branches:
      - agent/test-004-navigation-race-current
    paths:
      - .github/workflows/_temporary_test004_tracking_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/test-004-navigation-race-current
          fetch-depth: 0
      - name: Apply tracking transition
        shell: python
        run: |
          from pathlib import Path

          catalog = Path('docs/FEATURE_CATALOG.md')
          text = catalog.read_text()
          old_rel = '| REL-004 | Storage corruption backup/recovery | P0 | PLANNED | ENG-008 | Invalid local data is detected, backed up when possible, migrated/reset safely, and diagnosed. |'
          new_rel = '| REL-004 | Storage corruption backup/recovery | P0 | VERIFIED | ENG-008 | PR #107 verifies versioned pre-repair snapshots, single-backup preservation across multiple repairs, safe normalization/removal, diagnostics, unrelated-state preservation, and continued recovery when snapshot creation fails. Flutter CI #551 passed formatting, Analyze, the full Flutter suite, Debug APK build, and artifact upload before merge. |'
          old_test = '| TEST-004 | Navigation race regression tests | P0 | PLANNED | NAV-001 | Repeated Next/Retry/Start and external entry cannot duplicate actions/routes. |'
          new_test = '| TEST-004 | Navigation race regression tests | P0 | IN PROGRESS | NAV-001 | Issue #108 / PR #109 reproduced a deterministic current-main result navigation defect: after a visible settled Next action the Game route remains mounted. Work is closing result-route dismissal first, then reconciling Retry/Start duplicate-action coverage before verification. |'
          if old_rel not in text or old_test not in text:
              raise SystemExit('Expected catalog rows were not found')
          catalog.write_text(text.replace(old_rel, new_rel).replace(old_test, new_test))

          status = Path('docs/STATUS.md')
          text = status.read_text()
          text = text.replace(
              '| Primary feature | None during evidence-only reconciliation; next implementation selection follows this docs checkpoint. |',
              '| Primary feature | `TEST-004` navigation race regression tests — issue #108 / PR #109. |',
          )
          text = text.replace(
              '| Status | `REL-006`, `TEST-001`, and `REL-001` are VERIFIED from current repository/CI evidence. No Android source/build blocker is known; production-signed distribution verification remains externally blocked. |',
              '| Status | IN PROGRESS — current-main CI reproduced a deterministic result navigation defect after a real visible Next activation; result-route dismissal is being hardened before Retry/Start coverage reconciliation. `REL-004` is VERIFIED by PR #107 / CI #551. |',
          )
          text = text.replace(
              '| Next recommended feature | `REL-004` reconcile storage corruption backup/recovery evidence and fill only any remaining P0 persistence gap; then reconcile `TEST-004` navigation-race coverage and audit `GAME-016` rapid-input determinism. |',
              '| Next recommended feature | Finish `TEST-004` on current main, then audit `GAME-016` rapid-input determinism and the remaining unblocked RC P0 gaps. |',
          )
          status.write_text(text)
      - name: Remove temporary workflow and push
        run: |
          git rm .github/workflows/_temporary_test004_tracking_patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md
          git commit -m 'docs: mark TEST-004 in progress after reproduced race'
          git push origin HEAD:agent/test-004-navigation-race-current
