name: RT3D Visual Polish Regenerate Once

on:
  push:
    branches:
      - agent/rt3d-002-visual-polish-slice-03

permissions:
  contents: write

concurrency:
  group: rt3d-polish-regenerate-once
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rt3d-002-visual-polish-slice-03
          fetch-depth: 0
      - name: Regenerate deterministic polished GLB
        run: python3 tool/generate_rt3d_native_slice_glb.py
      - name: Verify pinned digest
        shell: bash
        run: |
          set -euo pipefail
          echo '99ccaf68303dfac2ef45855b21aa1160b9421fa711ac2093c0a75a8a78e39358  assets/3d/runtime/models/cargame_native_slice_v1.glb' | sha256sum -c -
      - name: Commit generated binary and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rt3d_polish_regenerate_once.yml
          git add assets/3d/runtime/models/cargame_native_slice_v1.glb
          git commit -m 'RT3D-002: pin generated visual polish GLB'
          git push origin HEAD:agent/rt3d-002-visual-polish-slice-03
