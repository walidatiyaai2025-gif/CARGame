name: One-time analyzer cleanup

on:
  push:
    paths:
      - .github/workflows/one_time_clean_analyzer.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply cleanup
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/core/storage/progress_store.dart')
          text = path.read_text(encoding='utf-8')
          old = """    if (hearts >= maxHearts || _heartRefillTimestamp == null)\n      return Duration.zero;"""
          new = """    if (hearts >= maxHearts || _heartRefillTimestamp == null) {\n      return Duration.zero;\n    }"""
          if old not in text:
              raise SystemExit('Expected progress-store statement was not found.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Verify
        run: |
          flutter pub get
          dart format lib test
          flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/one_time_clean_analyzer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/storage/progress_store.dart .github/workflows/one_time_clean_analyzer.yml
          git commit -m "fix(analyzer): remove remaining Flutter info diagnostics"
          git push
