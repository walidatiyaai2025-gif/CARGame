name: ECON005 Start Tracking

on:
  push:
    branches:
      - agent/econ-005-versioned-economy-config

permissions:
  contents: write

jobs:
  tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/econ-005-versioned-economy-config
      - name: Mark ECON-005 in progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          catalog = Path('docs/FEATURE_CATALOG.md')
          text = catalog.read_text()
          old = '| ECON-005 | Versioned economy configuration and balance rules | P0 | PLANNED | ECON-001, REW-007 | Prices, rewards, sinks, sources, caps, and migrations are versioned and validated. |'
          new = '| ECON-005 | Versioned economy configuration and balance rules | P0 | IN PROGRESS | ECON-001, REW-007 | Issue #122 centralizes the shipped economy into a typed schema-versioned v1 config with parity validation, authoritative shop IDs/prices, and non-destructive migration semantics; implementation and CI verification are in progress. |'
          if text.count(old) != 1:
              raise SystemExit('ECON-005 catalog row did not match exactly once')
          catalog.write_text(text.replace(old, new, 1))

          status = Path('docs/STATUS.md')
          text = status.read_text()
          replacements = [
              (
                  '| Primary feature | `REW-007` VERIFIED — implementation PR #120 merged; reconciliation evidence is being finalized on `agent/rew-007-reconciliation`. |',
                  '| Primary feature | `ECON-005` IN PROGRESS — issue #122 on `agent/econ-005-versioned-economy-config`. |',
              ),
              (
                  '| Status | `REW-007` VERIFIED: level, daily reward, daily mission, and explicit heart grants use interruption-safe absolute-state journaling/idempotency; Flutter CI #623 and Debug APK artifact #9032765167 are green evidence. |',
                  '| Status | `ECON-005` audit confirms release-critical economy values are scattered across gameplay, progress/rewards, and shop presentation. v1 will centralize/version/validate the existing numbers without rebalancing player outcomes. |',
              ),
              (
                  '| Next recommended feature | `ECON-005` versioned economy configuration and balance rules — its `REW-007` dependency is now VERIFIED and it continues the RC save/economy/reward integrity audit. |',
                  '| Next recommended feature | Complete `ECON-005` typed v1 configuration, parity/migration regressions, and full Android CI verification before selecting another RC P0. |',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'STATUS replacement did not match exactly once: {old}')
              text = text.replace(old, new, 1)
          status.write_text(text)
          PY
          git diff --check
          git rm .github/workflows/econ005_start_tracking.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md
          git commit -m 'docs: mark ECON-005 in progress'
          git push origin HEAD:agent/econ-005-versioned-economy-config
