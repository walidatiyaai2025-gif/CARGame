name: TEST-010 reconcile verified evidence

on:
  push:
    branches:
      - agent/test-010-dashboard-catalog-parity
    paths:
      - .github/workflows/test010_reconcile_verified.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/test-010-dashboard-catalog-parity
          fetch-depth: 0

      - name: Reconcile TEST-010 evidence
        run: python3 tool/reconcile_test010_verified.py

      - name: Validate reconciled contracts
        run: |
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py

      - name: Commit verified tracking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/TEST-010.md
          if git diff --cached --quiet; then
            echo "No reconciliation changes required"
            exit 0
          fi
          git commit -m "TEST-010: reconcile verified CI evidence"
          git push origin HEAD:agent/test-010-dashboard-catalog-parity
