name: ADS-007 Tracking Bootstrap

on:
  push:
    branches:
      - agent/ads-007-consent-privacy
    paths:
      - .github/scripts/ads007_tracking_bootstrap.py
      - .github/workflows/ads007_tracking_bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ads-007-consent-privacy
          fetch-depth: 0
      - name: Register ADS-007 as active work
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ads007_tracking_bootstrap.py
          python3 tool/verify_ci_integrity.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/ADS-007.md
          git rm .github/scripts/ads007_tracking_bootstrap.py .github/workflows/ads007_tracking_bootstrap.yml
          git commit -m 'docs: start ADS-007 consent integration'
          git push origin HEAD:agent/ads-007-consent-privacy
