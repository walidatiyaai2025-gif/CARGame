name: GAME-017 Format Probe

on:
  pull_request:
    paths:
      - 'lib/features/game/**'
      - 'test/features/game/**'
      - '.github/workflows/game_017_format_probe.yml'

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Print canonical formatting patch
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/game/gameplay_house_cargo_board.dart \
            lib/features/game/level_data.dart \
            test/features/game/level_data_test.dart \
            test/features/game/level_validator_test.dart
          git diff -- \
            lib/features/game/gameplay_house_cargo_board.dart \
            lib/features/game/level_data.dart \
            test/features/game/level_data_test.dart \
            test/features/game/level_validator_test.dart
