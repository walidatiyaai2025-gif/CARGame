name: GAME-017 Final Format Probe

on:
  pull_request:
    paths:
      - 'test/features/game/game_result_navigation_guard_test.dart'
      - 'test/features/game/game_rewarded_no_fill_test.dart'
      - 'test/features/game/game_screen_motion_test.dart'
      - '.github/workflows/game_017_format_probe.yml'

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Print canonical formatting patch
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            test/features/game/game_result_navigation_guard_test.dart \
            test/features/game/game_rewarded_no_fill_test.dart \
            test/features/game/game_screen_motion_test.dart
          git diff -- \
            test/features/game/game_result_navigation_guard_test.dart \
            test/features/game/game_rewarded_no_fill_test.dart \
            test/features/game/game_screen_motion_test.dart
