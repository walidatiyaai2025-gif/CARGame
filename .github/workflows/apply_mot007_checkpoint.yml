name: Apply MOT-007 checkpoint

on:
  push:
    branches: [main]
    paths:
      - scripts/apply_mot007_checkpoint.py
      - .github/workflows/apply_mot007_checkpoint.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - run: python scripts/apply_mot007_checkpoint.py
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test test/core/motion/game_action_feedback_test.dart
      - run: flutter test test/core/motion/game_travel_motion_test.dart
      - name: Commit checkpoint
        run: |
          rm scripts/apply_mot007_checkpoint.py
          rm .github/workflows/apply_mot007_checkpoint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat(motion): add synchronized action feedback [skip ci]"
          git push
