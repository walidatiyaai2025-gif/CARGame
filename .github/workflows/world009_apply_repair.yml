name: WORLD-009 Apply Repair

on:
  push:
    branches:
      - agent/world-009-real-capital-map

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/world-009-real-capital-map
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Repair map, destination labels, and remove probes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def require_replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected >= {count} matches, found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          p = Path('lib/features/levels/level_select_screen.dart')
          text = p.read_text()
          text, n = re.subn(
              r'''                    Row\(\n                      children: \[\n                        _StageMeta\(\n                          icon: Icons\.flag_rounded,\n                          text:\n                              '\$\{isArabic \? 'مرحلة' : 'Level'\} \$\{level\.number\}',\n                        \),\n                        const SizedBox\(width: 7\),\n                        _StageMeta\(\n                          icon: Icons\.inventory_2_rounded,\n                          text:\n                              '\$\{level\.items\.length\} \$\{isArabic \? 'منتج' : 'cargo'\}',\n                        \),\n                        const SizedBox\(width: 7\),\n                        _StageMeta\(\n                          icon: Icons\.house_rounded,\n                          text:\n                              '\$\{level\.houseCount\} \$\{isArabic \? 'بيوت' : 'houses'\}',\n                        \),\n                      \],\n                    \),''',
              '''                    Wrap(\n                      spacing: 7,\n                      runSpacing: 5,\n                      children: [\n                        _StageMeta(\n                          icon: Icons.flag_rounded,\n                          text:\n                              '${isArabic ? 'مرحلة' : 'Level'} ${level.number}',\n                        ),\n                        _StageMeta(\n                          icon: Icons.inventory_2_rounded,\n                          text:\n                              '${level.items.length} ${isArabic ? 'منتج' : 'cargo'}',\n                        ),\n                        _StageMeta(\n                          icon: Icons.house_rounded,\n                          text:\n                              '${level.houseCount} ${isArabic ? 'بيوت' : 'houses'}',\n                        ),\n                      ],\n                    ),''',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'level_select metadata row replacement count={n}')

          old_stage_meta = '''  Widget build(BuildContext context) {\n    return Flexible(\n      child: Container(\n        padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 5),\n        decoration: BoxDecoration(\n          color: const Color(0xFFF1F4F8),\n          borderRadius: BorderRadius.circular(12),\n        ),\n        child: Row(\n          mainAxisSize: MainAxisSize.min,\n          children: [\n            Icon(icon, size: 12, color: AppTheme.muted),\n            const SizedBox(width: 4),\n            Flexible(\n              child: Text(\n                text,\n                maxLines: 1,\n                overflow: TextOverflow.ellipsis,\n                style: const TextStyle(\n                  color: AppTheme.muted,\n                  fontSize: 8.5,\n                  fontWeight: FontWeight.w800,\n                ),\n              ),\n            ),\n          ],\n        ),\n      ),\n    );\n  }'''
          new_stage_meta = '''  Widget build(BuildContext context) {\n    return Container(\n      padding: const EdgeInsets.symmetric(horizontal: 7, vertical: 5),\n      decoration: BoxDecoration(\n        color: const Color(0xFFF1F4F8),\n        borderRadius: BorderRadius.circular(12),\n      ),\n      child: Row(\n        mainAxisSize: MainAxisSize.min,\n        children: [\n          Icon(icon, size: 12, color: AppTheme.muted),\n          const SizedBox(width: 4),\n          Text(\n            text,\n            maxLines: 1,\n            overflow: TextOverflow.ellipsis,\n            style: const TextStyle(\n              color: AppTheme.muted,\n              fontSize: 8.5,\n              fontWeight: FontWeight.w800,\n            ),\n          ),\n        ],\n      ),\n    );\n  }'''
          if old_stage_meta not in text:
              raise SystemExit('stage meta block not found')
          text = text.replace(old_stage_meta, new_stage_meta, 1)
          p.write_text(text)

          capital_map = Path('lib/features/levels/capital_world_map.dart')
          capital_text = capital_map.read_text().replace("import '../../core/theme/app_theme.dart';\n", '')
          capital_map.write_text(capital_text)

          briefing = Path('lib/features/levels/city_briefing_screen.dart')
          text = briefing.read_text()
          replacements = [
              ("    final world = gameWorlds[level.world - 1];\n    final previousStars = store.starsForLevel(level.number);", "    final world = gameWorlds[level.world - 1];\n    final route = capitalRouteForWorld(level.world);\n    final previousStars = store.starsForLevel(level.number);"),
              ("                                worldName: world.name,", "                                worldName: route.name(isArabic),"),
              ("              '${isArabic ? 'العالم' : 'WORLD'} $worldNumber',", "              '${isArabic ? 'المسار' : 'ROUTE'} $worldNumber',"),
              ("                        level.cityName,", "                        level.localizedCityName(isArabic),"),
              ("                        '$worldName • ${isArabic ? 'المرحلة' : 'Level'} ${level.number}',", "                        '${level.localizedCountryName(isArabic)} • $worldName • ${isArabic ? 'المرحلة' : 'Level'} ${level.number}',"),
              ("                    semanticLabel: level.cityName,", "                    semanticLabel: level.localizedDestinationLabel(isArabic),"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'briefing block missing: {old!r}')
              text = text.replace(old, new, 1)
          briefing.write_text(text)

          game = Path('lib/features/game/game_screen.dart')
          text = game.read_text()
          replacements = [
              ("    final world = gameWorlds[widget.level.world - 1];\n\n    await showModalBottomSheet<void>(", "    final routeName = capitalRouteForWorld(widget.level.world).name(ar);\n\n    await showModalBottomSheet<void>("),
              ("        cityName: widget.level.cityName,\n        worldName: world.name,", "        cityName: widget.level.localizedDestinationLabel(ar),\n        worldName: routeName,"),
              ("    final world = gameWorlds[widget.level.world - 1];\n    final ar = Localizations.localeOf(context).languageCode == 'ar';\n    final flight = _flight;", "    final world = gameWorlds[widget.level.world - 1];\n    final ar = Localizations.localeOf(context).languageCode == 'ar';\n    final routeName = capitalRouteForWorld(widget.level.world).name(ar);\n    final flight = _flight;"),
              ("                          cityName: widget.level.cityName,\n                          worldName: world.name,", "                          cityName: widget.level.localizedDestinationLabel(ar),\n                          worldName: routeName,"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'game block missing: {old!r}')
              text = text.replace(old, new, 1)
          game.write_text(text)

          responsive = Path('test/features/levels/level_select_responsive_test.dart')
          text = responsive.read_text()
          debug_block = '''    final compactException = tester.takeException();\n    if (compactException != null) {\n      debugPrint('WORLD009_COMPACT_EXCEPTION: $compactException');\n      debugDumpRenderTree();\n    }\n    expect(compactException, isNull);'''
          if debug_block in text:
              text = text.replace(debug_block, '    expect(tester.takeException(), isNull);', 1)
          responsive.write_text(text)

          for path in [
              'test/features/levels/level_select_overflow_probe_test.dart',
              '.github/workflows/world009_overflow_probe.yml',
              '.github/workflows/world009_apply_repair.yml',
          ]:
              Path(path).unlink(missing_ok=True)
          PY

          dart format \
            lib/features/levels/level_select_screen.dart \
            lib/features/levels/capital_world_map.dart \
            lib/features/levels/city_briefing_screen.dart \
            lib/features/game/game_screen.dart \
            test/features/levels/level_select_responsive_test.dart

          flutter pub get --enforce-lockfile
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test test/features/levels/level_select_responsive_test.dart test/features/levels/capital_world_map_test.dart test/features/levels/level_select_navigation_test.dart

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'WORLD-009 fix compact map and localize destinations'
          git push origin HEAD:agent/world-009-real-capital-map
