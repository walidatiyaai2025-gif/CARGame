name: REW007 Heart Grant Apply

on:
  push:
    branches:
      - agent/rew-007-reward-ledger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rew-007-reward-ledger
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Apply heart reward coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/rew007_heart_patch.py
          dart format lib/core/storage/progress_store.dart test/core/storage/reward_transaction_recovery_test.dart
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/storage/progress_store.dart test/core/storage/reward_transaction_recovery_test.dart
          git commit -m "feat: reconcile heart reward grants"
          git push origin HEAD:agent/rew-007-reward-ledger
