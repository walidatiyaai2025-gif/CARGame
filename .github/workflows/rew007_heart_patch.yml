name: REW007 Heart Grant Patch

on:
  push:
    branches:
      - agent/rew-007-reward-ledger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/rew-007-reward-ledger
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Add heart grant transaction coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/core/storage/progress_store.dart')
          text = path.read_text()
          replacements = [
              (
                  "      if (key == _missionClaimedKey) {\n        if (value is! bool) {\n          throw const FormatException('Invalid mission claim value.');\n        }\n        validated[key] = value;\n        continue;\n      }\n\n      if (key == _dailyRewardKey) {",
                  "      if (key == _heartsKey) {\n        if (value is! int || value < 0 || value > maxHearts) {\n          throw const FormatException('Invalid heart grant value.');\n        }\n        validated[key] = value;\n        continue;\n      }\n\n      if (key == _heartTimestampKey) {\n        if (value != null) {\n          throw const FormatException(\n            'Reward transactions may only clear the heart refill timestamp.',\n          );\n        }\n        validated[key] = null;\n        continue;\n      }\n\n      if (key == _missionClaimedKey) {\n        if (value is! bool) {\n          throw const FormatException('Invalid mission claim value.');\n        }\n        validated[key] = value;\n        continue;\n      }\n\n      if (key == _dailyRewardKey) {",
              ),
              (
                  "    if (!validated.containsKey(_coinsKey)) {\n      throw const FormatException('Reward transaction has no wallet value.');\n    }",
                  "    if (!validated.containsKey(_coinsKey) &&\n        !validated.containsKey(_heartsKey)) {\n      throw const FormatException(\n        'Reward transaction has no supported grant value.',\n      );\n    }",
              ),
              (
                  "      } else if (value is String) {\n        await _prefs.setString(entry.key, value);\n      } else {\n        throw FormatException('Unsupported reward value: ${entry.key}');\n      }",
                  "      } else if (value is String) {\n        await _prefs.setString(entry.key, value);\n      } else if (value == null && entry.key == _heartTimestampKey) {\n        await _prefs.remove(entry.key);\n      } else {\n        throw FormatException('Unsupported reward value: ${entry.key}');\n      }",
              ),
              (
                  "        case _coinsKey:\n          coins = value as int;\n        case _gamesKey:",
                  "        case _coinsKey:\n          coins = value as int;\n        case _heartsKey:\n          hearts = value as int;\n        case _heartTimestampKey:\n          _heartRefillTimestamp = null;\n        case _gamesKey:",
              ),
              (
                  "  Future<void> addHearts(int amount) async {\n    hearts = (hearts + amount).clamp(0, maxHearts);\n    if (hearts >= maxHearts) {\n      _heartRefillTimestamp = null;\n      await _prefs.remove(_heartTimestampKey);\n    }\n    await _prefs.setInt(_heartsKey, hearts);\n    notifyListeners();\n  }",
                  "  Future<void> addHearts(\n    int amount, {\n    String? transactionId,\n  }) => _serializeReward<void>(() async {\n    await _ensureRewardLedgerLoaded();\n    await _recoverPendingRewardTransaction();\n\n    final transactionKey = _rewardTransactionKey(\n      reason: 'heart_grant',\n      idempotencyKey: transactionId,\n    );\n    if (_completedRewardTransactions.contains(transactionKey)) return;\n\n    final nextHearts = (hearts + amount).clamp(0, maxHearts);\n    final values = <String, Object?>{\n      _heartsKey: nextHearts,\n      if (nextHearts >= maxHearts) _heartTimestampKey: null,\n    };\n    final committed = await _commitRewardTransaction(\n      reason: 'heart_grant',\n      idempotencyKey: transactionKey,\n      values: values,\n    );\n    if (!committed) return;\n\n    hearts = nextHearts;\n    if (hearts >= maxHearts) _heartRefillTimestamp = null;\n    notifyListeners();\n  });",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

          test_path = Path('test/core/storage/reward_transaction_recovery_test.dart')
          test_text = test_path.read_text()
          marker = "\n}\n"
          if not test_text.endswith(marker):
              raise SystemExit('Unexpected reward recovery test ending')
          addition = r'''

  test('heart grants replay and recover without double-award', () async {
    final prefs = SharedPreferencesAsync();
    await prefs.setInt('hearts', 2);
    await prefs.setString(
      'heart_refill_timestamp',
      DateTime.now().subtract(const Duration(minutes: 5)).toIso8601String(),
    );

    final store = ProgressStore();
    await store.load();
    expect(store.hearts, 2);

    await store.addHearts(2, transactionId: 'revive-001');
    expect(store.hearts, 4);
    await store.addHearts(2, transactionId: 'revive-001');
    expect(store.hearts, 4);
    expect(store.completedRewardTransactions, contains('heart_grant:revive-001'));

    await prefs.setString(
      pendingRewardKey,
      jsonEncode(<String, Object?>{
        'version': 1,
        'reason': 'heart_grant',
        'idempotencyKey': 'heart_grant:revive-recovery',
        'values': <String, Object?>{
          'hearts': 5,
          'heart_refill_timestamp': null,
        },
      }),
    );

    final recovered = ProgressStore();
    await recovered.load();
    expect(recovered.hearts, 5);
    expect(
      recovered.completedRewardTransactions,
      contains('heart_grant:revive-recovery'),
    );
    expect(await prefs.containsKey(pendingRewardKey), isFalse);
    expect(await prefs.containsKey('heart_refill_timestamp'), isFalse);

    final secondLoad = ProgressStore();
    await secondLoad.load();
    expect(secondLoad.hearts, 5);
  });
'''
          test_path.write_text(test_text[:-len(marker)] + addition + marker)
          PY
          dart format lib/core/storage/progress_store.dart test/core/storage/reward_transaction_recovery_test.dart
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/storage/progress_store.dart test/core/storage/reward_transaction_recovery_test.dart
          git commit -m "feat: reconcile heart reward grants"
          git push origin HEAD:agent/rew-007-reward-ledger
