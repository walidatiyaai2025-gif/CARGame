name: PERF-001 Final Reconcile

on:
  push:
    branches:
      - agent/perf-001-post-merge-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/perf-001-post-merge-reconcile
          fetch-depth: 0

      - name: Merge latest main and add final promotion evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

          python3 - <<'PY'
          from pathlib import Path

          PROMO = 'Latest-verified promotion #37 / run `31416602117` succeeded and committed `3e2fa6592e98c18216e7dff9a79888cc3e5e7dbc`; the QA release APK is 55,943,559 bytes with SHA-256 `358d38a81708fce2a667f9b78a00b6b1bd28ae2f68013cdb60266ecbc65da1a2`, ephemeral CI signing, ads disabled, and not production/Play Store signed.'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = 'docs/FEATURE_CATALOG.md'
          old = 'Main debug artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`. Source-controlled acceptance is IMPLEMENTED; VERIFIED still requires real Android device/profile frame measurements, so TEST-009 remains dependency-blocked. |'
          new = 'Main debug artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`. ' + PROMO + ' Source-controlled acceptance is IMPLEMENTED; VERIFIED still requires real Android device/profile frame measurements, so TEST-009 remains dependency-blocked. |'
          replace_once(catalog, old, new)

          old = 'main artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`. Physical-device frame measurements remain required before VERIFIED; issue #196 stays open and TEST-009 remains blocked.'
          new = 'main artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`. ' + PROMO + ' Physical-device frame measurements remain required before VERIFIED; issue #196 stays open and TEST-009 remains blocked.'
          replace_once(catalog, old, new)

          status = 'docs/STATUS.md'
          old = '| Status | PERF-001 source-controlled acceptance is IMPLEMENTED: bounded rolling frame timing drives a presentation-only full/constrained/reduced quality state machine; sustained pressure sheds ambient motion and scales shared effects while reduced-motion accessibility remains authoritative. Main debug artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`. VERIFIED remains pending honest physical-device/profile frame evidence. |'
          new = '| Status | PERF-001 source-controlled acceptance is IMPLEMENTED: bounded rolling frame timing drives a presentation-only full/constrained/reduced quality state machine; sustained pressure sheds ambient motion and scales shared effects while reduced-motion accessibility remains authoritative. Main debug artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`; latest-verified promotion #37 / run `31416602117` produced the 55,943,559-byte QA APK with SHA-256 `358d38a81708fce2a667f9b78a00b6b1bd28ae2f68013cdb60266ecbc65da1a2`. VERIFIED remains pending honest physical-device/profile frame evidence. |'
          replace_once(status, old, new)

          replace_once(
              status,
              '- Issue #196 / branch `agent/perf-001-frame-budget` are the single active primary workstream after AST-004 reconciliation.',
              '- Issue #196 remains open only for real Android device/profile verification; source implementation PR #197 is merged and no source-controlled primary workstream is active after reconciliation.',
          )
          anchor = '- Exact-main Flutter CI #849 / run `31415750686` passed 332/332 tests, 88.21% authored-source coverage, Debug APK, artifact security and upload. Main artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`.\n'
          replace_once(status, anchor, anchor + '- ' + PROMO + '\n')

          work = 'docs/work/PERF-001.md'
          anchor = '- Exact-main Flutter CI #849 / run `31415750686` passed the same repository gates with 332/332 tests and 88.21% authored-source coverage. Main debug artifact #9073641322 is 80,644,379 bytes with artifact ZIP SHA-256 `4d2726add801d28d517cc29461506e2d4580e57fb86b6b50e362847d0628f13b`.\n'
          replace_once(work, anchor, anchor + '- ' + PROMO + '\n')
          PY

      - name: Validate final reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/verify_frame_performance_budget.py
          python3 tool/test_frame_performance_budget.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          git diff --check

      - name: Commit final evidence
        shell: bash
        run: |
          set -euo pipefail
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/PERF-001.md
          git diff --cached --check
          git commit -m "PERF-001: record final promotion evidence [skip ci]"
          git push origin HEAD:agent/perf-001-post-merge-reconcile
