name: ADS-007 Next Candidate Audit

on:
  push:
    branches:
      - agent/ads-007-reconcile
    paths:
      - .github/scripts/ads007_candidate_audit.py
      - .github/workflows/ads007_candidate_audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ads-007-reconcile
          fetch-depth: 0
      - name: Compute next dependency-ready feature
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ads007_candidate_audit.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/ads007_candidate_audit.py .github/workflows/ads007_candidate_audit.yml
          git commit -m 'chore: remove ADS-007 candidate audit'
          git push origin HEAD:agent/ads-007-reconcile
