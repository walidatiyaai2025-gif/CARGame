name: ENG-012 Tracking Start

on:
  push:
    paths:
      - 'tool/eng012_tracking_trigger.txt'

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Update tracking state
        run: python3 tool/track_eng012.py

      - name: Validate tracking state
        run: |
          git diff --check
          python3 tool/verify_ci_integrity.py
          grep -F '| ENG-012 | Analytics event schema and privacy gating | P1 | IN PROGRESS |' docs/FEATURE_CATALOG.md
          grep -F 'IN PROGRESS under Issue #175' docs/STATUS.md

      - name: Commit and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/eng012_tracking.yml tool/eng012_tracking_trigger.txt tool/track_eng012.py
          git add docs/FEATURE_CATALOG.md docs/STATUS.md
          git commit -m 'ENG-012: mark analytics schema in progress'
          git push origin "HEAD:${GITHUB_REF_NAME}"
