name: TEST-002 Format Probe

on:
  push:
    branches:
      - agent/test-002-level-release-contract

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Print canonical formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format test/features/game/level_release_contract_test.dart
          git diff -- test/features/game/level_release_contract_test.dart
