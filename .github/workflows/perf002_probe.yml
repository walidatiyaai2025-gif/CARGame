name: PERF-002 Probe

on:
  push:
    branches:
      - agent/perf-002-memory-image-budget

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PERF-002 branch
        uses: actions/checkout@v4
        with:
          ref: agent/perf-002-memory-image-budget
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Restore packages
        run: flutter pub get --enforce-lockfile

      - name: Format PERF-002 Dart files
        run: >-
          dart format
          lib/core/assets/game_image_memory_policy.dart
          lib/core/assets/game_asset_cache_policy.dart
          lib/core/assets/game_asset_view.dart
          lib/main.dart
          test/core/assets/game_image_memory_policy_test.dart
          test/core/assets/game_asset_view_memory_test.dart

      - name: Validate machine policy
        run: |
          python3 tool/verify_memory_image_budget.py
          python3 tool/test_memory_image_budget.py
          python3 tool/verify_asset_cache_policy.py
          python3 tool/test_asset_cache_policy.py
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run PERF-002 focused tests
        run: >-
          flutter test
          test/core/assets/game_image_memory_policy_test.dart
          test/core/assets/game_asset_view_memory_test.dart
          test/core/assets/game_asset_cache_policy_test.dart

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/core/assets/game_image_memory_policy.dart \
            lib/core/assets/game_asset_cache_policy.dart \
            lib/core/assets/game_asset_view.dart \
            lib/main.dart \
            test/core/assets/game_image_memory_policy_test.dart \
            test/core/assets/game_asset_view_memory_test.dart
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git commit -m "PERF-002: apply Dart formatter [skip ci]"
          git push origin HEAD:agent/perf-002-memory-image-budget
