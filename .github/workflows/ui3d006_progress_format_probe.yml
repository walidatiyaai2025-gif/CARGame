name: UI3D006 Progress Format Probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Print exact formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format test/features/progress/progress_hub_responsive_test.dart
          git diff -- test/features/progress/progress_hub_responsive_test.dart
          exit 1
