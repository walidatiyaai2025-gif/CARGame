name: ENG-013 Verification Reconciliation

on:
  push:
    branches:
      - agent/eng-013-crash-reporting

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eng-013-crash-reporting
      - name: Apply tracking reconciliation
        run: python3 tool/reconcile_eng013_tracking.py
      - name: Validate reconciled contracts
        run: |
          python3 tool/verify_privacy_inventory.py
          python3 tool/verify_crash_reporting_privacy.py
          python3 tool/verify_security_baseline.py
          python3 tool/verify_ci_integrity.py
          git diff --check
      - name: Commit reconciliation and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/eng013_reconcile.yml tool/reconcile_eng013_tracking.py
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/PRIVACY_DATA_INVENTORY.md docs/work/ENG-013.md
          git commit -m 'ENG-013: reconcile verified tracking'
          git push origin HEAD:agent/eng-013-crash-reporting
