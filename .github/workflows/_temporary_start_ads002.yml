name: Temporary ADS-002 tracking start

on:
  push:
    branches: [agent/ads-002-release-config-audit]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ads-002-release-config-audit
      - run: python3 tool/_start_ads002.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temporary_start_ads002.yml tool/_start_ads002.py
          git add docs/FEATURE_CATALOG.md docs/STATUS.md
          git commit -m "docs: start ADS-002 release configuration audit"
          git push origin HEAD:agent/ads-002-release-config-audit
