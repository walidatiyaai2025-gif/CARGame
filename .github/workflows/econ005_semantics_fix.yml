name: ECON005 Semantics Fix

on:
  push:
    branches:
      - agent/econ-005-versioned-economy

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/econ-005-versioned-economy
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Preserve accessibility contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/game/game_screen.dart')
          text = path.read_text()
          old = """                    label: _isArabic
                        ? 'شاهد إعلانًا وخذ ${widget.store.economy.rewardedContinueMoves} حركات'
                        : 'Watch ad for ${widget.store.economy.rewardedContinueMoves} moves',
"""
          new = """                    label: _isArabic
                        ? 'شاهد إعلانًا وخذ ${widget.store.economy.rewardedContinueMoves} حركات'
                        : widget.store.economy.rewardedContinueMoves == 5
                        ? 'Watch ad for five moves'
                        : 'Watch ad for ${widget.store.economy.rewardedContinueMoves} moves',
"""
          if old not in text:
              raise SystemExit('rewarded continue semantics anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format lib/features/game/game_screen.dart
          flutter pub get
          flutter test test/features/game/game_screen_semantics_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check
          git rm .github/workflows/econ005_semantics_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/game/game_screen.dart
          git commit -m 'fix: preserve rewarded continue semantics'
          git push origin HEAD:agent/econ-005-versioned-economy