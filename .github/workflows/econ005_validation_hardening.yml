name: ECON005 Validation Hardening

on:
  push:
    branches:
      - agent/econ-005-versioned-economy-config

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/econ-005-versioned-economy-config
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Harden economy transaction validation
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/econ005_validation_hardening.py
          dart format \
            lib/core/economy/economy_config.dart \
            test/core/economy/economy_config_test.dart
          git diff --check
          flutter pub get
          flutter gen-l10n
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test \
            test/core/economy/economy_config_test.dart \
            test/core/economy/economy_integration_test.dart \
            test/core/storage/progress_store_test.dart \
            test/core/storage/shop_purchase_recovery_test.dart \
            test/core/storage/reward_transaction_recovery_test.dart
          git rm \
            .github/workflows/econ005_validation_hardening.yml \
            tools/econ005_validation_hardening.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/core/economy/economy_config.dart \
            test/core/economy/economy_config_test.dart
          git commit -m 'fix: align economy validation with runtime transactions'
          git push origin HEAD:agent/econ-005-versioned-economy-config
