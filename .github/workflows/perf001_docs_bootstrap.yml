name: PERF-001 Docs Bootstrap

on:
  push:
    branches:
      - agent/perf-001-frame-budget

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PERF-001 branch
        uses: actions/checkout@v4
        with:
          ref: agent/perf-001-frame-budget
          fetch-depth: 0

      - name: Mark PERF-001 active in project tracking
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = 'docs/FEATURE_CATALOG.md'
          replace_once(
              catalog,
              '| PERF-001 | Frame performance budget | P0 | PLANNED | MOT-001, AST-004 | Core gameplay meets documented frame targets with graceful fallback. |',
              '| PERF-001 | Frame performance budget | P0 | IN PROGRESS | MOT-001, AST-004 | Issue #196 adds the source-controlled 60 Hz/16.67 ms frame policy, bounded rolling FrameTiming evaluation, deterministic full/constrained/reduced visual-quality state machine, conservative recovery hysteresis, app-wide performance scope, shared-motion degradation, ambient ticker shedding, focused regressions and CI ownership gates. Physical-device frame-time proof remains intentionally external before VERIFIED. |',
          )

          status = 'docs/STATUS.md'
          replace_once(
              status,
              '| Primary feature | None — `AST-004` Precache and memory policy is VERIFIED after 100/100 checkpoints; `PERF-001` is selected next but not started. |',
              '| Primary feature | `PERF-001` Frame performance budget — IN PROGRESS under issue #196 on `agent/perf-001-frame-budget`. |',
          )
          replace_once(
              status,
              '| Completed checkpoint | `AST-004` bounded asset precache and memory policy — VERIFIED; issue #192 / PR #193 completed 100/100 checkpoints, PR #193 squash-merged as `22239a6cdd7af3770a03a4b9a86e8d32d078a01b`, and exact-main Flutter CI #840 / run `31409971405` passed all gates with 320 tests and 88.34% authored-source coverage. |',
              '| Completed checkpoint | `AST-004` bounded asset precache and memory policy — VERIFIED and reconciled on main as `82fbc4ac9abeb12ebad6484def9860c71e2027ca`; PERF-001 is the new single primary workstream. |',
          )
          replace_once(
              status,
              '| Status | AST-004 is VERIFIED: same-ID precache work is shared, clear/forget invalidation is race-safe, LRU/failure state is bounded, observability is immutable, raw precache bypasses are CI-blocked, and descriptor-only fallback behavior remains intact. Exact-main artifact #9071436511 is 80,633,603 bytes with artifact ZIP SHA-256 `b7150ca0969b0f32e3741ca4a47e9c51e7c8d6ce02880af9d47b5f1cfbfec562`; latest-verified promotion #28 / run `31410745473` produced the 55,878,023-byte QA APK with SHA-256 `df60e5bc0471cdf99ab66a3e01987cc7948fc52ba353da647070b29bcd137a72`. |',
              '| Status | PERF-001 implementation is active: bounded rolling frame timing drives a presentation-only full/constrained/reduced quality state machine; sustained pressure sheds ambient motion and scales shared effects while reduced-motion accessibility remains authoritative. No gameplay/economy/persistence/ad/privacy truth is affected. |',
          )
          replace_once(
              status,
              '| Next recommended feature | `PERF-001` Frame performance budget — P0, now dependency-ready via MOT-001 + AST-004. Establish measurable frame targets and graceful fallback before TEST-009 device/API matrix work. |',
              '| Next recommended feature | Finish PERF-001 focused/full CI and Debug APK verification; if source-controlled gates pass, reconcile as IMPLEMENTED pending real device-tier frame profiling, then rescan dependencies before TEST-009. |',
          )
          marker = '## AST-004 bounded asset precache and memory policy — 2026-08-10\n'
          insertion = '''## PERF-001 adaptive frame performance budget — 2026-08-10\n\n- Issue #196 / branch `agent/perf-001-frame-budget` are the single active primary workstream after AST-004 reconciliation.\n- `FramePerformancePolicy.mobile60Hz` defines a 60 Hz target, nominal 16.67 ms frame budget, >24 ms jank threshold, >34 ms severe-jank threshold, 60-frame bounded history, 30-sample warmup, and 15-frame evaluation stride.\n- Sustained pressure degrades visual quality one level at a time from full to constrained to reduced; recovery requires three healthy evaluation windows and also occurs one level at a time to prevent oscillation.\n- `FramePerformanceScope` observes Flutter `FrameTiming` for the full app route tree. Shared motion shortens/scales nonessential effects under pressure, and ambient motion stops outside full quality; system reduced-motion remains the strongest override.\n- `FramePerformanceSnapshot` is local-only, bounded diagnostic state. PERF-001 adds no remote telemetry, persistence, packages, production identifiers, or gameplay/economy/ad/privacy changes.\n- `docs/PERFORMANCE_BUDGET.md` records the verification boundary: CI proves deterministic policy/integration/build safety, while actual device-tier frame measurements remain later device/profile evidence and must not be fabricated.\n\n'''
          p = Path(status)
          text = p.read_text(encoding='utf-8')
          if insertion not in text:
              if marker not in text:
                  raise SystemExit('STATUS: AST-004 section anchor missing')
              p.write_text(text.replace(marker, insertion + marker, 1), encoding='utf-8')

          work = 'docs/work/PERF-001.md'
          for task in ('T44', 'T45', 'T46'):
              p = Path(work)
              text = p.read_text(encoding='utf-8')
              old = f'- [ ] {task}'
              new = f'- [x] {task}'
              if old not in text:
                  raise SystemExit(f'{work}: missing {task} unchecked anchor')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate repository-owned PERF-001 contract
        run: |
          python3 tool/verify_frame_performance_budget.py
          python3 tool/test_frame_performance_budget.py
          python3 tool/verify_dashboard_catalog.py
          python3 tool/test_dashboard_catalog.py
          python3 tool/verify_ci_integrity.py
          python3 tool/test_ci_integrity.py
          git diff --check

      - name: Commit tracking bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/PERF-001.md
          git diff --cached --check
          git commit -m "PERF-001: mark frame budget workstream active [skip ci]"
          git push origin HEAD:agent/perf-001-frame-budget
