name: Update MOT-006 status

on:
  push:
    branches: [main]
    paths:
      - scripts/update_mot006_status.py
      - .github/workflows/update_mot006_status.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_mot006_status.py
      - name: Commit status
        run: |
          rm scripts/update_mot006_status.py
          rm .github/workflows/update_mot006_status.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: mark MOT-006 pickup checkpoint in progress"
          git push
