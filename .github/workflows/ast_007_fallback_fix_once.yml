name: AST-007 Fallback Fix Once

on:
  push:
    branches:
      - agent/ast-007-cargo-visual-pack

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/ast-007-cargo-visual-pack

      - name: Apply fallback preservation
        run: python3 tool/fix_ast_007_warehouse_fallback_once.py

      - name: Verify whitespace
        run: git diff --check

      - name: Remove one-shot tooling
        run: |
          rm .github/workflows/ast_007_fallback_fix_once.yml
          rm tool/fix_ast_007_warehouse_fallback_once.py

      - name: Commit fallback preservation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "AST-007: preserve warehouse fallback visual"
          git push origin HEAD:agent/ast-007-cargo-visual-pack
