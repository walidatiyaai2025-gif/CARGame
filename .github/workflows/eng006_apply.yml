name: ENG-006 Apply

on:
  push:
    branches:
      - agent/eng-006-dependency-governance
    paths:
      - .github/workflows/eng006_apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/eng-006-dependency-governance
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true
      - name: Verify ENG-006 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python3 tool/dependency_governance.py verify
          python3 tool/test_dependency_governance.py
          python3 .github/scripts/eng006_apply.py
          flutter analyze --no-fatal-infos --no-fatal-warnings
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/flutter_ci.yml \
            docs/DEPENDENCY_GOVERNANCE.md \
            docs/FEATURE_CATALOG.md \
            docs/STATUS.md \
            docs/work/ENG-006.md \
            tool/dependency_governance.py \
            tool/dependency_license_policy.json \
            tool/test_dependency_governance.py
          git rm \
            .github/scripts/eng006_probe.py \
            .github/scripts/eng006_apply.py \
            .github/workflows/eng006_audit.yml \
            .github/workflows/eng006_apply.yml
          git commit -m 'ENG-006: enforce dependency governance policy'
          git push origin HEAD:agent/eng-006-dependency-governance
