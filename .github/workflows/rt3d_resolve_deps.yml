name: RT3D Resolve Renderer Dependencies

on:
  push:
    branches:
      - agent/rt3d-002-slice-01

permissions:
  contents: write

jobs:
  resolve-lock:
    if: ${{ !contains(github.event.head_commit.message, 'chore(rt3d): resolve Thermion dependency lock') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout RT3D branch
        uses: actions/checkout@v4
        with:
          ref: agent/rt3d-002-slice-01
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Enable native assets
        run: flutter config --enable-native-assets

      - name: Resolve production renderer dependencies
        run: >-
          flutter pub add
          thermion_flutter:^0.4.1
          vector_math:^2.2.0

      - name: Commit lockfile update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml pubspec.lock
          if git diff --cached --quiet; then
            echo 'Dependency files already resolved.'
            exit 0
          fi
          git commit -m 'chore(rt3d): resolve Thermion dependency lock [skip ci]'
          git push origin HEAD:agent/rt3d-002-slice-01
