name: LEVEL002 Apply Integration

on:
  push:
    branches:
      - agent/level-002-quantitative-difficulty-curve

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate difficulty policy
        shell: python
        run: |
          from pathlib import Path

          level_path = Path('lib/features/game/level_data.dart')
          level = level_path.read_text(encoding='utf-8')
          old_import = "import 'package:flutter/material.dart';\n"
          new_import = "import 'package:flutter/material.dart';\n\nimport 'level_difficulty_policy.dart';\n"
          if level.count(old_import) != 1:
              raise SystemExit('expected Flutter import exactly once')
          level = level.replace(old_import, new_import)

          old_balance = "  final difficulty = min(10, 1 + ((number - 1) ~/ 15));\n  final safetyMoves = max(2, 6 - world);\n  final moves = items.length + safetyMoves + random.nextInt(3);"
          new_balance = "  final difficulty = LevelDifficultyPolicy.declaredDifficultyForLevel(number);\n  final safetyMoves = LevelDifficultyPolicy.safetyMoveBaseForLevel(\n    levelNumber: number,\n    world: world,\n  );\n  final moves = items.length + safetyMoves + random.nextInt(3);"
          if level.count(old_balance) != 1:
              raise SystemExit('expected level balance formula exactly once')
          level = level.replace(old_balance, new_balance)
          level_path.write_text(level, encoding='utf-8')

          workflow_path = Path('.github/workflows/flutter_ci.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old_step = "      - name: Test animated GameButton\n        run: flutter test test/core/widgets/game_button_test.dart\n\n      - name: Run full test suite"
          new_step = "      - name: Test animated GameButton\n        run: flutter test test/core/widgets/game_button_test.dart\n\n      - name: Test quantitative level difficulty curve\n        run: flutter test test/features/game/level_difficulty_curve_test.dart\n\n      - name: Run full test suite"
          if workflow.count(old_step) != 1:
              raise SystemExit('expected GameButton/full-suite boundary exactly once')
          workflow = workflow.replace(old_step, new_step)
          workflow_path.write_text(workflow, encoding='utf-8')

      - name: Commit integration and remove helper
        shell: bash
        run: |
          rm .github/workflows/level002_apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: integrate LEVEL-002 balance policy"
          git push origin HEAD:${GITHUB_REF_NAME}
