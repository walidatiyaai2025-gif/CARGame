name: LEVEL-002 Reconcile

on:
  push:
    branches:
      - agent/level-002-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/level-002-reconcile
          fetch-depth: 0
      - name: Reconcile LEVEL-002 verification evidence
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected tracking text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          catalog = 'docs/FEATURE_CATALOG.md'
          replace_once(
              catalog,
              '| LEVEL-002 | Difficulty curve | P0 | IN PROGRESS | LEVEL-001 | Issue #134 defines typed tutorial/easy/medium/hard/expert bands, deterministic per-level balance metrics, quantitative envelopes, macro-progression validation, and explicit boundary regressions across the 150-level generator. Preserve current generated content unless measured acceptance exposes a real imbalance. |',
              '| LEVEL-002 | Difficulty curve | P0 | VERIFIED | LEVEL-001 | Issue #134 / PR #137 define typed tutorial/easy/medium/hard/expert bands, deterministic per-level balance metrics, quantitative envelopes, macro-progression validation, and explicit boundary regressions across all 150 generated levels. Expert levels 121–150 deliberately use 1–3 spare moves while preserving stable level/world/save identities. PR #137 squash-merged as `938ed6ea100a987b2513e5f5221aab90a850c2d6`; Flutter CI #681 / run `31309097571` passed formatting, Analyze, the full Flutter suite, Debug APK build and artifact upload. Artifact #9036909677 is 80,547,511 bytes with SHA-256 `e3d2acc260fdc39462b299f19295660dccae130a89b63a8cc52aeddf38647ee6`. |',
          )
          replace_once(
              catalog,
              '- `LEVEL-002` Difficulty curve — issue #134; defining typed quantitative bands and deterministic balance validation across all 150 generated levels.',
              '- None.',
          )
          replace_once(
              catalog,
              '- To be selected after LEVEL-002 verification.',
              '- `TEST-002` Level generator and solvability tests — P0 and dependency-ready because `LEVEL-003` is VERIFIED; consolidate generator, structural solvability, and LEVEL-002 difficulty acceptance into one deterministic regression gate.',
          )
          replace_once(
              catalog,
              '## Recently verified\n\n- `LEVEL-003` Level solvability validator',
              '## Recently verified\n\n- `LEVEL-002` Difficulty curve — issue #134 / PR #137 add typed quantitative bands and deterministic validation for all 150 generated levels, with an intentional Expert 1–3 spare-move envelope. Flutter CI #681 / run `31309097571` passed all gates and uploaded artifact #9036909677 (`e3d2acc260fdc39462b299f19295660dccae130a89b63a8cc52aeddf38647ee6`); PR #137 squash-merged as `938ed6ea100a987b2513e5f5221aab90a850c2d6`.\n- `LEVEL-003` Level solvability validator',
          )

          status = 'docs/STATUS.md'
          replace_once(
              status,
              '| Primary feature | `LEVEL-002` Difficulty curve — IN PROGRESS under issue #134. |',
              '| Primary feature | None — `LEVEL-002` is VERIFIED; `TEST-002` is the next dependency-ready P0. |',
          )
          replace_once(
              status,
              '| Completed checkpoint | `LEVEL-003` level solvability validator current-main reconciliation — the existing validator plus deterministic 150-level regression suite satisfy the catalog acceptance without duplicate production code. |',
              '| Completed checkpoint | `LEVEL-002` quantitative difficulty curve — PR #137 merged after final current-main reconciliation and green Flutter CI #681. |',
          )
          replace_once(
              status,
              '| Status | LEVEL-002 is converting the deterministic generator\'s implicit progression into typed tutorial/easy/medium/hard/expert quantitative bands with per-level metrics and macro-progression acceptance. Current content remains unchanged unless measured validation exposes a real balance defect. |',
              '| Status | LEVEL-002 is VERIFIED. All 150 generated levels satisfy typed difficulty envelopes and macro-progression checks; Expert levels intentionally tighten spare-move slack to 1–3 without changing level IDs, worlds, products, persistence keys, unlock IDs, or reward identity. |',
          )
          replace_once(
              status,
              '| Next recommended feature | Complete LEVEL-002 issue #134; select the next unblocked catalog task only after its final verification/reconciliation. |',
              '| Next recommended feature | `TEST-002` Level generator and solvability tests — highest-priority dependency-ready P0 after LEVEL-002; consolidate generator, solvability, and difficulty acceptance into one deterministic regression gate. |',
          )
          replace_once(
              status,
              '## LEVEL-003 level solvability validator current-main verification — 2026-08-09',
              '## LEVEL-002 quantitative difficulty curve verification — 2026-08-09\n\n- Issue #134 / PR #137 introduced typed Tutorial, Easy, Medium, Hard, and Expert bands covering levels 1..150 with no gaps or overlaps.\n- `LevelDifficultyCurve` validates declared difficulty, cargo count, distinct-product count, move slack, complete-set identity, boundary levels, and macro pressure progression while keeping structural solvability in LEVEL-003.\n- Expert levels 121..150 deliberately use a base safety budget of one move, producing 1..3 spare moves; other bands preserve the prior deterministic generator behavior.\n- Stable level numbers, six-world boundaries, product generation, persistence keys, unlock IDs, and reward transaction identity are preserved.\n- Final Flutter CI #681 / run `31309097571` passed release/privacy/security/asset gates, formatting, Analyze, optional-service regressions, the full Flutter suite, Debug APK build, and artifact upload on head `1c1c39ad5d1fb336da2e5b3f7845a83d04d454ff`.\n- Debug artifact #9036909677 is 80,547,511 bytes with SHA-256 `e3d2acc260fdc39462b299f19295660dccae130a89b63a8cc52aeddf38647ee6`.\n- PR #137 squash-merged to main as `938ed6ea100a987b2513e5f5221aab90a850c2d6`.\n- `LEVEL-002` is VERIFIED; `TEST-002` is the next dependency-ready P0.\n\n## LEVEL-003 level solvability validator current-main verification — 2026-08-09',
          )

          work = Path('docs/work/LEVEL-002.md')
          text = work.read_text(encoding='utf-8')
          if 'Status: IN PROGRESS' not in text:
              raise SystemExit('LEVEL-002 work note no longer has expected IN PROGRESS state')
          text = text.replace('Status: IN PROGRESS', 'Status: VERIFIED', 1)
          marker = '## Final verification — 2026-08-09'
          if marker not in text:
              text += f'''\n## Final implementation\n\n- Added typed Tutorial, Easy, Medium, Hard, and Expert policy bands covering levels 1..150 exactly once.\n- Added deterministic balance metrics and curve validation for difficulty rating, cargo volume, product variety, move slack, complete-set coverage, and macro pressure.\n- Tightened only Expert move slack to 1..3 spare moves; all level/world/product/save/reward identities remain stable.\n- Updated legacy move-budget regression to derive its expectation from `LevelDifficultyPolicy` instead of a global magic-number range.\n\n{marker}\n\n- Implementation PR: #137.\n- Squash merge: `938ed6ea100a987b2513e5f5221aab90a850c2d6`.\n- Final reconciled head: `1c1c39ad5d1fb336da2e5b3f7845a83d04d454ff`.\n- Flutter CI: #681 / run `31309097571` — all gates green, including full Flutter tests and Debug APK build/upload.\n- Artifact: #9036909677, 80,547,511 bytes, SHA-256 `e3d2acc260fdc39462b299f19295660dccae130a89b63a8cc52aeddf38647ee6`.\n- Result: `LEVEL-002` VERIFIED. Structural solvability remains independently owned by `LEVEL-003`.\n'''
          work.write_text(text, encoding='utf-8')

      - name: Remove temporary reconciliation workflow
        run: rm .github/workflows/level-002-reconcile.yml
      - name: Commit reconciled tracking
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/FEATURE_CATALOG.md docs/STATUS.md docs/work/LEVEL-002.md .github/workflows/level-002-reconcile.yml
          git commit -m "docs: reconcile LEVEL-002 verification"
          git push origin HEAD:agent/level-002-reconcile
